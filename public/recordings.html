<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SureCast -SEAMLESS REMOTE RECORDING-</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #222222;
      --border: #2a2a2a;
      --accent: #d97706;
      --accent-hover: #f59e0b;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
      --text: #f5f5f5;
      --text-dim: #a0a0a0;
      --radius: 12px;
    }

    body {
      font-family: 'Hiragino Sans', 'Meiryo', 'Yu Gothic', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: #0f0f0f;
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }
    .header-logo {
      height: 50px;
      width: auto;
      display: block;
    }
    header a {
      margin-left: auto;
      font-size: 0.82rem;
      color: var(--accent);
      text-decoration: none;
      padding: 6px 12px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      transition: background 0.15s;
      white-space: nowrap;
    }
    header a:hover { background: rgba(217,119,6,0.15); }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .page-title {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .page-subtitle {
      font-size: 0.82rem;
      color: var(--text-dim);
      margin-top: 4px;
    }
    .btn-refresh {
      padding: 8px 16px;
      background: var(--surface2);
      border: 1px solid var(--accent);
      border-radius: 8px;
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .btn-refresh:hover { background: rgba(217,119,6,0.15); }

    #file-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .file-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
    }
    .file-card.failure {
      border-color: rgba(239,68,68,0.65);
      background: rgba(69,26,26,0.55);
    }
    .failure-message { color: #fecaca; font-size: 0.88rem; font-weight: 700; }
    .file-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .file-icon {
      font-size: 1.4rem;
      flex-shrink: 0;
    }
    .file-info { flex: 1; min-width: 0; }
    .file-name {
      font-size: 0.9rem;
      font-weight: 600;
      word-break: break-all;
    }
    .file-meta {
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-top: 3px;
    }
    .file-badge {
      display: inline-block;
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 700;
      margin-left: 6px;
      vertical-align: middle;
    }
    .badge-flac { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
    .badge-srv  { background: rgba(217,119,6,0.15); color: var(--accent); border: 1px solid rgba(217,119,6,0.3); }
    .badge-local{ background: rgba(96,165,250,0.15); color: #60a5fa; border: 1px solid rgba(96,165,250,0.3); }
    .badge-webm { background: rgba(160,160,160,0.15); color: var(--text-dim); border: 1px solid rgba(160,160,160,0.3); }
    .badge-mix { background: rgba(217,119,6,0.15); color: #fbbf24; border: 1px solid rgba(217,119,6,0.4); }
    .badge-master { background: rgba(168,85,247,0.15); color: #c084fc; border: 1px solid rgba(168,85,247,0.3); }
    .badge-sync-warning { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.45); }
    .flac-note  { font-size: 0.72rem; color: var(--text-dim); margin-top: 6px; font-style: italic; }
    .noise-note {
      margin-top: 7px;
      padding: 7px 9px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.74rem;
      line-height: 1.45;
    }
    .noise-note.applied { color: #86efac; border-color: rgba(34,197,94,0.45); background: rgba(34,197,94,0.08); }
    .noise-note.skipped { color: #fbbf24; border-color: rgba(245,158,11,0.5); background: rgba(245,158,11,0.08); }
    .file-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .btn-dl {
      padding: 7px 16px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 7px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .btn-dl:hover { background: var(--accent-hover); }
    .btn-process {
      padding: 7px 14px;
      background: var(--surface2);
      color: #c084fc;
      border: 1px solid rgba(168,85,247,0.5);
      border-radius: 7px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .btn-process:hover:not(:disabled) { background: rgba(168,85,247,0.15); }
    .btn-process:disabled { opacity: 0.6; cursor: default; }

    audio {
      width: 100%;
      height: 36px;
      margin-top: 12px;
      border-radius: 6px;
      background: var(--surface2);
    }
    audio::-webkit-media-controls-panel { background: var(--surface2); }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }
    .empty-state .empty-icon { font-size: 3rem; margin-bottom: 16px; }
    .empty-state p { font-size: 0.92rem; }

    .loading-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
      font-size: 0.92rem;
    }

    .error-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--red);
      font-size: 0.88rem;
      background: rgba(255,68,68,0.08);
      border: 1px solid rgba(255,68,68,0.3);
      border-radius: var(--radius);
    }

    .total-info {
      font-size: 0.82rem;
      color: var(--text-dim);
      text-align: right;
      margin-bottom: 12px;
    }

    @media (max-width: 768px) {
      header { padding: 10px 16px; }
      .header-logo { height: 36px; }
    }
    @media (max-width: 600px) {
      main { padding: 14px; }
      .file-card { padding: 12px 14px; }
      .file-actions { width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>

<header>
  <img src="/images/surecast-logo-2-white.png" alt="SureCast" class="header-logo">
  <a href="/">← 収録ページへ戻る</a>
</header>

<main>
  <div class="page-header">
    <div>
      <div class="page-title">サーバー保存済みファイル</div>
      <div class="page-subtitle">サーバーにアップロードされた録音ファイルの一覧です</div>
    </div>
    <button class="btn-refresh" onclick="loadRecordings()">🔄 更新</button>
  </div>

  <div id="total-info" class="total-info" style="display:none"></div>
  <div id="file-list">
    <div class="loading-state">読み込み中...</div>
  </div>
</main>

<script>
function formatSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
}

function formatDate(str) {
  const d = new Date(str);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[char]);
}

function renderNoiseNote(file) {
  const noise = file.processing && file.processing.noise;
  if (!noise) return '';
  if (noise.method === 'profile' && noise.applied) {
    const start = Number(noise.profileStartSec).toFixed(1);
    const end = Number(noise.profileEndSec).toFixed(1);
    return `<div class="noise-note applied">ノイズ除去済み（自動プロファイル ${start}〜${end}秒 ／ nr=${noise.reductionDb} dB ／ 全体平均より ${noise.quieterByDb} dB静か）</div>`;
  }
  if (noise.method === 'arnndn' && noise.applied) {
    return `<div class="noise-note applied">AIノイズ除去済み（arnndn ／ ${escapeHtml(noise.reason || '自動プロファイルから切り替えました')}）</div>`;
  }
  if (noise.applied) {
    const quietness = noise.profileWasSilent
      ? '冒頭は無音'
      : `冒頭は全体平均より ${noise.quieterByDb} dB静か`;
    return `<div class="noise-note applied">ノイズ除去済み（nr=${noise.reductionDb} dB ／ ${quietness}）</div>`;
  }
  return `<div class="noise-note skipped">ノイズ除去をスキップしました：${escapeHtml(noise.reason || 'ノイズプロファイルを安全に取得できませんでした')}。ハイパスとラウドネス調整は適用済みです。</div>`;
}

async function loadRecordings() {
  const listEl = document.getElementById('file-list');
  const totalEl = document.getElementById('total-info');
  listEl.innerHTML = '<div class="loading-state">読み込み中...</div>';
  totalEl.style.display = 'none';

  try {
    const res = await fetch('/recordings');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const files = await res.json();

    if (files.length === 0) {
      listEl.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🎙️</div>
          <p>まだ録音ファイルがありません。<br>収録ページから録音するとここに表示されます。</p>
        </div>
      `;
      return;
    }

    const failureCount = files.filter(f => f.failure).length;
    const audioCount = files.length - failureCount;
    const totalSize = files.reduce((sum, f) => sum + f.size, 0);
    totalEl.textContent = `${audioCount} ファイル ／ 取得失敗 ${failureCount} 件 ／ 合計 ${formatSize(totalSize)}`;
    totalEl.style.display = 'block';

    listEl.innerHTML = '';
    files.forEach(f => {
      if (f.failure) {
        const username = escapeHtml(f.failure.username || '不明');
        const card = document.createElement('div');
        card.className = 'file-card failure';
        card.innerHTML = `
          <div class="file-row">
            <div class="file-icon">⚠</div>
            <div class="file-info">
              <div class="failure-message">${username}さんの録音は取得できませんでした</div>
              <div class="file-meta">${formatDate(f.mtime)} ／ マイクと録音状態を確認してください</div>
            </div>
          </div>
        `;
        listEl.appendChild(card);
        return;
      }
      const isFlac = /\.flac$/i.test(f.name);
      const isMaster = /-master\.flac$/i.test(f.name);
      const isLocal = /-local\.flac$/i.test(f.name);
      const isMix = /^MIX-.*\.mp3$/i.test(f.name);

      let badge = '';
      let icon = '🎵';
      if (isMix) {
        icon = '🎧';
        badge = '<span class="file-badge badge-mix">確認用ミックス</span>';
      } else if (isMaster) {
        icon = '✨';
        badge = '<span class="file-badge badge-master">整音済み</span>';
      } else if (isFlac) {
        icon = '🎙️';
        if (isLocal) {
          badge = '<span class="file-badge badge-local">ローカル録音</span>';
        } else {
          badge = '<span class="file-badge badge-flac">サーバー録音</span>';
        }
      } else {
        badge = '<span class="file-badge badge-webm">WebM</span>';
      }
      if (f.sync && f.sync.clockSyncOk === false) {
        badge += '<span class="file-badge badge-sync-warning">⚠ 位置合わせ未保証</span>';
      }

      const card = document.createElement('div');
      card.className = 'file-card';
      card.innerHTML = `
        <div class="file-row">
          <div class="file-icon">${icon}</div>
          <div class="file-info">
            <div class="file-name">${f.name}${badge}</div>
            <div class="file-meta">${formatDate(f.mtime)} ／ ${formatSize(f.size)}</div>
            ${isMaster ? renderNoiseNote(f) : ''}
            ${isFlac ? '<div class="flac-note">FLAC形式 — ダウンロードしてご使用ください（ブラウザ再生非対応の場合があります）</div>' : ''}
          </div>
          <div class="file-actions">
            <a class="btn-dl" href="/recordings/${encodeURIComponent(f.name)}" download="${f.name}">
              ⬇ ダウンロード
            </a>
          </div>
        </div>
        ${!isFlac ? `<audio controls src="/recordings/${encodeURIComponent(f.name)}"></audio>` : ''}
      `;
      if (!isMaster && !isMix) {
        const btn = document.createElement('button');
        btn.className = 'btn-process';
        btn.textContent = '✨ 整音';
        btn.title = 'ハイパス・ノイズ除去・ラウドネス正規化(-16 LUFS)を適用した整音済みFLACを作成します';
        btn.addEventListener('click', () => processFile(f.name, btn));
        card.querySelector('.file-actions').prepend(btn);
      }
      listEl.appendChild(card);
    });
  } catch (err) {
    listEl.innerHTML = `
      <div class="error-state">
        ⚠️ ファイル一覧の取得に失敗しました：${err.message}<br>
        <br>サーバーが起動しているか確認してください。
      </div>
    `;
  }
}

async function processFile(name, btn) {
  btn.disabled = true;
  btn.textContent = '⏳ 整音中…';
  try {
    const res = await fetch('/process/' + encodeURIComponent(name), { method: 'POST' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
    const poll = setInterval(async () => {
      try {
        const st = await (await fetch('/process-status/' + encodeURIComponent(name))).json();
        if (st.status === 'done') {
          clearInterval(poll);
          loadRecordings();
        } else if (st.status === 'error') {
          clearInterval(poll);
          btn.disabled = false;
          btn.textContent = '✨ 整音';
          alert('整音に失敗しました：' + (st.error || '不明なエラー'));
        }
      } catch {}
    }, 3000);
  } catch (err) {
    btn.disabled = false;
    btn.textContent = '✨ 整音';
    alert('整音を開始できませんでした：' + err.message);
  }
}

loadRecordings();
</script>
</body>
</html>
