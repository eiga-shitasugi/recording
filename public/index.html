const LS_EPISODES_KEY = 'podcast-episodes-v2';

const episodeState = {
  episodes: [],
  activeId: null,
};

function genLocalId() {
  return 'l_' + Math.random().toString(36).slice(2, 10);
}

function getActiveEpisode() {
  return episodeState.episodes.find(e => e.id === episodeState.activeId) || episodeState.episodes[0] || null;
}

function saveLocalEpisodes() {
  if (ws.inCall) return;
  try {
    localStorage.setItem(LS_EPISODES_KEY, JSON.stringify({
      episodes: episodeState.episodes,
      activeId: episodeState.activeId,
    }));
  } catch {}
}

function loadLocalEpisodes() {
  try {
    const saved = localStorage.getItem(LS_EPISODES_KEY);
    if (saved) {
      const data = JSON.parse(saved);
      episodeState.episodes = data.episodes || [];
      episodeState.activeId = data.activeId || null;
    }
  } catch {}

  if (episodeState.episodes.length === 0) {
    const ep = { id: genLocalId(), name: 'EP1', content: '' };
    episodeState.episodes = [ep];
    episodeState.activeId = ep.id;
  }
  if (!episodeState.episodes.find(e => e.id === episodeState.activeId)) {
    episodeState.activeId = episodeState.episodes[0].id;
  }
  renderEpisodeTabs();
  renderActiveEpisode();
}

function handleEpisodesSync(data) {
  const serverEpisodes = data.list || [];
  const serverHasContent = serverEpisodes.some(e => e.content && e.content.trim().length > 0);
  const hasOtherParticipants = !!data.hasOtherParticipants; // 参加時のみサーバーが付与

  if (isFirstJoin && hasOtherParticipants) {
    // ★ 既存ルームへの参加：コンテンツの有無に関わらずサーバーのEP一覧を使用
    // → room-state ハンドラが後から selectEpisode() で正しいEPに切り替える
    episodeState.episodes = serverEpisodes;
    episodeState.activeId = data.activeId || (serverEpisodes[0] && serverEpisodes[0].id);

  } else if (isFirstJoin && !serverHasContent && preJoinEpisodes && preJoinEpisodes.length > 0) {
    // 新規ルーム（自分が最初の参加者）：ローカルエピソードを維持し、コンテンツをサーバーに同期
    episodeState.episodes = preJoinEpisodes;
    episodeState.activeId = preJoinActiveId || preJoinEpisodes[0].id;

    const activeEp = getActiveEpisode();
    const serverFirstEpId = serverEpisodes.length > 0 ? serverEpisodes[0].id : null;
    if (activeEp && activeEp.content && serverFirstEpId && ws.socket) {
      ws.socket.emit('episode-update', { id: serverFirstEpId, content: activeEp.content });
    }

  } else {
    // 通話中の再同期（EP作成・削除・名前変更・選択など）：サーバーEP一覧を使用、アクティブIDはローカル優先
    episodeState.episodes = serverEpisodes;
    const localActiveStillExists = preJoinActiveId && serverEpisodes.find(e => e.id === preJoinActiveId);
    episodeState.activeId = localActiveStillExists
      ? preJoinActiveId
      : (data.activeId || (serverEpisodes[0] && serverEpisodes[0].id));
  }

  isFirstJoin = false;
  preJoinScriptContent = '';
  preJoinActiveId = null;
  preJoinEpisodes = null;

  renderEpisodeTabs();
  renderActiveEpisode();
}

function renderEpisodeTabs() {
  const tabsEl = $('episode-tabs');
  tabsEl.innerHTML = '';
  episodeState.episodes.forEach(ep => {
    const btn = document.createElement('button');
    btn.className = 'ep-tab' + (ep.id === episodeState.activeId ? ' active' : '');
    btn.textContent = ep.name;
    btn.dataset.id = ep.id;
    btn.addEventListener('click', () => selectEpisode(ep.id));
    tabsEl.appendChild(btn);
  });
}

function renderActiveEpisode() {
  const ep = getActiveEpisode();
  $('script-textarea').value = ep ? ep.content : '';
}

function selectEpisode(id) {
  const current = getActiveEpisode();
  if (current) current.content = $('script-textarea').value;

  episodeState.activeId = id;
  renderEpisodeTabs();
  renderActiveEpisode();
  saveLocalEpisodes();

  if (ws.inCall && ws.socket) {
    if (myHeldLock && myHeldLock !== id) ws.socket.emit('episode-lock-release', { episodeId: myHeldLock });
    ws.socket.emit('episode-select', { id });
  }
  applyLockUI();
}

function addEpisode() {
  const epNum = episodeState.episodes.length + 1;
  const name = `EP${epNum}`;

  if (ws.inCall && ws.socket) {
    ws.socket.emit('episode-create', { name });
  } else {
    const ep = { id: genLocalId(), name, content: '' };
    episodeState.episodes.push(ep);
    episodeState.activeId = ep.id;
    renderEpisodeTabs();
    renderActiveEpisode();
    saveLocalEpisodes();
  }
}

function renameEpisode() {
  const ep = getActiveEpisode();
  if (!ep) return;
  const newName = prompt('エピソード名を入力してください:', ep.name);
  if (!newName || !newName.trim()) return;
  const name = newName.trim().slice(0, 30);

  if (ws.inCall && ws.socket) {
    ws.socket.emit('episode-rename', { id: ep.id, name });
  } else {
    ep.name = name;
    renderEpisodeTabs();
    saveLocalEpisodes();
  }
}

function deleteEpisode() {
  if (episodeState.episodes.length <= 1) {
    showToast('エピソードは最低1つ必要です', 'error');
    return;
  }
  const ep = getActiveEpisode();
  if (!ep) return;
  if (!confirm(`「${ep.name}」を削除しますか？`)) return;

  if (ws.inCall && ws.socket) {
    ws.socket.emit('episode-delete', { id: ep.id });
  } else {
    episodeState.episodes = episodeState.episodes.filter(e => e.id !== ep.id);
    episodeState.activeId = episodeState.episodes[0].id;
    renderEpisodeTabs();
    renderActiveEpisode();
    saveLocalEpisodes();
  }
}

$('btn-ep-add').addEventListener('click', addEpisode);
$('btn-ep-rename').addEventListener('click', renameEpisode);
$('btn-ep-delete').addEventListener('click', deleteEpisode);

// ===== 台本ファイル インポート =====
$('btn-script-import').addEventListener('click', () => {
  $('script-file-input').click();
});

$('script-file-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const content = ev.target.result;
    const ep = getActiveEpisode();
    if (!ep) return;

    if (ep.content && ep.content.trim() &&
        !confirm(`「${ep.name}」の内容を上書きしますか？\n（現在の内容は失われます）`)) {
      return;
    }

    ep.content = content;
    $('script-textarea').value = content;

    if (ws.inCall && ws.socket) {
      ws.socket.emit('episode-update', { id: ep.id, content });
      updateSyncBadge('synced');
    } else {
      saveLocalEpisodes();
    }
    showToast(`「${file.name}」を読み込みました`, 'success');
  };
  reader.onerror = () => showToast('ファイルの読み込みに失敗しました', 'error');
  reader.readAsText(file, 'UTF-8');
  e.target.value = ''; // リセット（同ファイルの再アップを可能に）
});

// ===== 台本ファイル エクスポート =====
$('btn-script-export').addEventListener('click', () => {
  const ep = getActiveEpisode();
  if (!ep) return;
  const content = $('script-textarea').value;
  if (!content.trim()) {
    showToast('エクスポートする内容がありません', 'error');
    return;
  }
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${ep.name}-script.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`「${ep.name}」をエクスポートしました`, 'success');
});

function updateSyncBadge(state) {
  const badge = $('sync-badge');
  badge.className = `sync-badge ${state}`;
  const labels = { offline: 'ローカルのみ', syncing: '同期中...', synced: '同期済み' };
  badge.textContent = labels[state] || state;
}

const typingPeers = new Set();
let typingStopTimer = null;
// 台本編集ロック状態
const lockedEpisodes = {}; // episodeId -> 編集中の他人の名前
let myHeldLock = null;     // 自分が保持中のepisodeId
function applyLockUI() {
  const ta = $('script-textarea');
  const banner = $('script-lock-banner');
  const activeId = episodeState.activeId;
  const lockedBy = lockedEpisodes[activeId];
  if (lockedBy && myHeldLock !== activeId) {
    ta.readOnly = true; ta.classList.add('locked');
    if (banner) { banner.textContent = `🔒 ${lockedBy} さんが編集中です`; banner.style.display = 'block'; }
  } else {
    ta.readOnly = false; ta.classList.remove('locked');
    if (banner) banner.style.display = 'none';
  }
}

function updateTypingIndicator() {
  const el = $('script-typing-indicator');
  const count = typingPeers.size;
  if (count === 0 || !ws.inCall) { el.innerHTML = ''; return; }
  const text = count === 1 ? '1人が編集中' : `${count}人が編集中`;
  el.innerHTML = `<span>${text}</span><div class="typing-dots"><span></span><span></span><span></span></div>`;
}

let scriptDebounce = null;
$('script-textarea').addEventListener('input', () => {
  const ep = getActiveEpisode();
  if (ep) ep.content = $('script-textarea').value;

  if (!ws.inCall || !ws.roomId) {
    saveLocalEpisodes();
    return;
  }

  // 他人が編集ロック中なら送信しない（readOnlyの二重防御）
  if (lockedEpisodes[episodeState.activeId] && myHeldLock !== episodeState.activeId) return;

  // 編集ロックを取得/延長
  if (ws.socket) ws.socket.emit('episode-lock-request', { episodeId: episodeState.activeId });

  if (ws.socket) ws.socket.emit('script-typing', true);
  clearTimeout(typingStopTimer);
  typingStopTimer = setTimeout(() => {
    if (ws.socket) ws.socket.emit('script-typing', false);
    if (ws.socket && myHeldLock) ws.socket.emit('episode-lock-release', { episodeId: myHeldLock });
  }, 1500);

  clearTimeout(scriptDebounce);
  updateSyncBadge('syncing');
  scriptDebounce = setTimeout(() => {
    // ロック保持中のみ送信
    if (ep && ws.socket && myHeldLock === episodeState.activeId) {
      ws.socket.emit('episode-update', { id: ep.id, content: ep.content });
    }
    updateSyncBadge('synced');
  }, 150);
});

// =========================================================
// ===== VUメーター =====
// =========================================================

let vuAnalyser = null;
let vuStream = null;
let vuStreamShared = false; // VUが共有トラックを使用中か
let vuAnimFrame = null;
let vuCtx = null;
let silenceTimer = null;

// ===== マイク取得共通ヘルパー =====
const LS_SPEAKER_MODE_KEY = 'surecast-speaker-mode';
let sharedRawStream = null;
let sharedRawStreamPromise = null;
let sharedRawCaptureEpoch = 0;
let audioSwitchPromise = null;
let lastMicSelection = '';

function isSpeakerModeEnabled() {
  return Boolean($('speaker-mode')?.checked);
}

function getAudioCaptureOptions(sampleRate) {
  const processed = isSpeakerModeEnabled();
  return {
    echoCancellation: processed,
    noiseSuppression: processed,
    autoGainControl: processed,
    channelCount: 1,
    sampleRate: sampleRate || 48000,
  };
}

// 選択中のマイクで取得を試み、失敗したら既定マイクにフォールバックして警告を出す。
// 音声を含むgetUserMediaは、この関数からだけ呼び出す。
async function getMicStreamSafe(audioOpts) {
  const deviceId = $('mic-select').value;
  if (deviceId) {
    try {
      return await navigator.mediaDevices.getUserMedia({
        audio: { deviceId: { exact: deviceId }, ...audioOpts }
      });
    } catch (e) {
      console.warn('[マイク取得] 選択デバイスで失敗、既定マイクにフォールバック:', e.message);
      showToast('選択したマイクが使用できないため、既定のマイクに切り替えました', 'error');
    }
  }
  return await navigator.mediaDevices.getUserMedia({ audio: { ...audioOpts } });
}

function releaseSharedAudioCapture() {
  sharedRawCaptureEpoch++;
  sharedRawStream?.getTracks().forEach(track => track.stop());
  sharedRawStream = null;
}

// 通話・ローカル録音・サーバー録音・VUが同じ1本の音声トラックを共有する。
async function acquireRawAudioStream(sampleRate) {
  if (sharedRawStream) {
    const at = sharedRawStream.getAudioTracks()[0];
    if (at && at.readyState === 'live') return { stream: new MediaStream([at]), shared: true };
    sharedRawStream = null;
  }

  if (sharedRawStreamPromise) {
    try {
      const pendingStream = await sharedRawStreamPromise;
      const pendingTrack = pendingStream.getAudioTracks()[0];
      if (pendingTrack?.readyState === 'live') return { stream: new MediaStream([pendingTrack]), shared: true };
    } catch {}
  }

  const captureEpoch = sharedRawCaptureEpoch;
  const pending = getMicStreamSafe(getAudioCaptureOptions(sampleRate)).then(stream => {
    if (captureEpoch !== sharedRawCaptureEpoch) {
      stream.getTracks().forEach(track => track.stop());
      throw new Error('マイク取得がキャンセルされました');
    }
    sharedRawStream = stream;
    attachMicWatchdog(stream.getAudioTracks()[0]);
    return stream;
  });
  sharedRawStreamPromise = pending;
  pending.finally(() => {
    if (sharedRawStreamPromise === pending) sharedRawStreamPromise = null;
  }).catch(() => {});

  const st = await pending;
  return { stream: new MediaStream([st.getAudioTracks()[0]]), shared: true };
}

async function replaceSharedAudioTrackInCall(newAudioTrack) {
  if (!ws.localStream) return;
  ws.localStream.getAudioTracks().forEach(track => ws.localStream.removeTrack(track));
  ws.localStream.addTrack(newAudioTrack);
  if (window.__mediaCore) window.__mediaCore.setLocalStream(ws.localStream);
  await applyCallAudioMuteState();
}

async function reacquireSharedAudioTrack() {
  if (audioSwitchPromise) return audioSwitchPromise;
  audioSwitchPromise = (async () => {
    stopVUMeter();
    releaseSharedAudioCapture();
    const { stream } = await acquireRawAudioStream(48000);
    const newAudioTrack = stream.getAudioTracks()[0];
    if (!newAudioTrack) throw new Error('マイク音声を取得できませんでした');
    await replaceSharedAudioTrackInCall(newAudioTrack);
    await startVUMeter();
    return newAudioTrack;
  })().finally(() => { audioSwitchPromise = null; });
  return audioSwitchPromise;
}

async function inspectAudioTrackHealth(track, durationMs = 600) {
  if (!track || track.readyState !== 'live') return { dead: true, reason: 'ended' };
  if (track.muted) return { dead: true, reason: 'muted' };

  let context = null;
  let analyser = null;
  try {
    if (vuAnalyser && vuCtx?.state === 'running' && vuStream?.getAudioTracks()[0] === track) {
      analyser = vuAnalyser;
    } else {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return { dead: false, reason: 'probe-unavailable' };
      context = new AudioContextClass();
      if (context.state === 'suspended') await context.resume().catch(() => {});
      if (context.state !== 'running') return { dead: false, reason: 'probe-suspended' };
      analyser = context.createAnalyser();
      analyser.fftSize = 2048;
      context.createMediaStreamSource(new MediaStream([track])).connect(analyser);
    }

    const samples = new Float32Array(analyser.fftSize);
    const deadline = performance.now() + durationMs;
    do {
      if (track.muted || track.readyState !== 'live') return { dead: true, reason: track.muted ? 'muted' : 'ended' };
      analyser.getFloatTimeDomainData(samples);
      for (let i = 0; i < samples.length; i++) {
        if (Math.abs(samples[i]) > 0) return { dead: false, reason: 'signal' };
      }
      await new Promise(resolve => setTimeout(resolve, 50));
    } while (performance.now() < deadline);

    return { dead: true, reason: 'digital-silence' };
  } finally {
    if (context) context.close().catch(() => {});
  }
}

let recordingAudioPreflightPromise = null;
async function ensureRecordingAudioReady() {
  if (recordingAudioPreflightPromise) return recordingAudioPreflightPromise;
  recordingAudioPreflightPromise = (async () => {
    const username = getUserName() || 'user';
    let { stream } = await acquireRawAudioStream(48000);
    let track = stream.getAudioTracks()[0];
    let health = await inspectAudioTrackHealth(track);

    if (health.dead) {
      console.warn(`[録音前検査] マイク異常 (${health.reason})。1回だけ再取得します`);
      track = await reacquireSharedAudioTrack();
      health = await inspectAudioTrackHealth(track);
    }

    setRecordingHealthAlert({
      username,
      reason: 'no-audio',
      source: 'preflight',
      active: health.dead,
    });
    if (health.dead) {
      console.error(`[録音前検査] 再取得後も音声データを確認できません (${health.reason})。録音は開始します`);
    }
    return track;
  })().finally(() => { recordingAudioPreflightPromise = null; });
  return recordingAudioPreflightPromise;
}

function waitForRecorderStop(recorder, timeoutMs = 1500) {
  if (!recorder || recorder.state === 'inactive') return Promise.resolve();
  return new Promise(resolve => {
    const timer = setTimeout(resolve, timeoutMs);
    recorder.addEventListener('stop', () => {
      clearTimeout(timer);
      resolve();
    }, { once: true });
  });
}

function pauseServerRecorderForMicrophoneRecovery() {
  if (!srvRecActive) return null;
  srvRecActive = false;
  clearServerRecordingClientHealthTimers();
  const recorder = srvRecMR;
  if (recorder?.state !== 'inactive') recorder.stop();
  srvRecMR = null;
  srvRecStream = null;
  return recorder;
}

async function recoverMicrophoneFromWarning() {
  const button = $('btn-reacquire-mic');
  if (button?.disabled) return;
  const username = getUserName() || 'user';
  const restartLocal = state.isRecording;
  const restartServer = srvRecActive;
  button.disabled = true;
  button.textContent = '再取得中...';

  try {
    let localRecorder = null;
    let serverRecorder = null;
    if (restartLocal) localRecorder = stopRecording({ forRecovery: true });
    if (restartServer) serverRecorder = pauseServerRecorderForMicrophoneRecovery();
    await Promise.all([
      waitForRecorderStop(localRecorder),
      waitForRecorderStop(serverRecorder),
    ]);

    const track = await reacquireSharedAudioTrack();
    const health = await inspectAudioTrackHealth(track);
    if (health.dead) throw new Error(`再取得したマイクから音声データを確認できません (${health.reason})`);

    clearOwnRecoverableRecordingAlerts();
    const freshClock = await syncClockWithServer({ showWarning: true });
    const [localRestarted, serverRestarted] = await Promise.all([
      restartLocal ? startRecording(freshClock) : true,
      restartServer ? startServerRecording(username, freshClock) : true,
    ]);
    if (!localRestarted || !serverRestarted) throw new Error('録音を再開できませんでした');
    showToast(restartLocal || restartServer
      ? 'マイクを再取得し、録音を再開しました'
      : 'マイクを再取得しました', 'success');
  } catch (err) {
    console.error('[マイク復旧] エラー:', err);
    setRecordingHealthAlert({ username, source: 'recovery', active: true });
    if (!isRecordingActive()) setRecordingUI(false);
    showToast(`マイクの再取得に失敗しました: ${err.message}`, 'error');
  } finally {
    button.disabled = false;
    button.textContent = 'マイクを再取得';
  }
}

async function startVUMeter() {
  if (vuAnalyser) return;
  try {
    const _vu = await acquireRawAudioStream();
    vuStream = _vu.stream;
    vuStreamShared = _vu.shared;
    vuCtx = new AudioContext();
    // スマホ/Safari: ユーザー操作外で作られた AudioContext は suspended のままになる
    if (vuCtx.state === 'suspended') {
      vuCtx.resume().catch(() => {});
      const resumeOnTap = () => { if (vuCtx && vuCtx.state === 'suspended') vuCtx.resume().catch(() => {}); };
      document.addEventListener('click', resumeOnTap, { once: true });
      document.addEventListener('touchstart', resumeOnTap, { once: true });
    }
    const source = vuCtx.createMediaStreamSource(vuStream);
    vuAnalyser = vuCtx.createAnalyser();
    vuAnalyser.fftSize = 2048;
    vuAnalyser.smoothingTimeConstant = 0.25;
    source.connect(vuAnalyser);
    requestAnimationFrame(updateVUMeter);
    console.log('[VUメーター] 開始');
  } catch (e) {
    console.warn('[VUメーター] 初期化失敗:', e.message);
  }
}

function stopVUMeter() {
  if (vuAnimFrame) { cancelAnimationFrame(vuAnimFrame); vuAnimFrame = null; }
  if (vuStream) { if (!vuStreamShared) vuStream.getTracks().forEach(t => t.stop()); vuStream = null; }
  if (vuCtx) { vuCtx.close().catch(() => {}); vuCtx = null; }
  vuAnalyser = null;
  if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
  const bar = $('vu-bar');
  if (bar) bar.style.width = '0%';
  const dbLabel = $('vu-db-label');
  if (dbLabel) dbLabel.textContent = '— dB';
  const msg = $('vu-message');
  if (msg) msg.textContent = '';
}

function updateVUMeter() {
  if (!vuAnalyser) return;

  const data = new Float32Array(vuAnalyser.fftSize);
  vuAnalyser.getFloatTimeDomainData(data);

  let sum = 0;
  let peak = 0;
  for (let i = 0; i < data.length; i++) {
    sum += data[i] * data[i];
    if (Math.abs(data[i]) > peak) peak = Math.abs(data[i]);
  }
  const rms = Math.sqrt(sum / data.length);
  const db = rms > 0.000001 ? Math.max(-60, 20 * Math.log10(rms)) : -60;
  const pct = Math.max(0, Math.min(100, (db + 60) / 60 * 100));

  const bar = $('vu-bar');
  const dbLabel = $('vu-db-label');
  const msg = $('vu-message');

  if (bar) bar.style.width = pct + '%';
  if (dbLabel) dbLabel.textContent = db > -60 ? `${db.toFixed(1)} dB` : '-∞ dB';

  const isClipping = peak >= 0.99;

  if (msg) {
    if (isClipping || db >= 0) {
      msg.textContent = '⚠️ クリッピング！録音レベルが高すぎます';
      msg.style.color = 'var(--red)';
    } else if (db >= -6) {
      msg.textContent = '⚠️ 音量が高めです（-6dB以下を推奨）';
      msg.style.color = 'var(--yellow)';
    } else if (db >= -12) {
      msg.textContent = '✓ 適正レベルです';
      msg.style.color = 'var(--green)';
    } else {
      msg.textContent = '';
    }
  }

  if (!isRecordingActive() && db < -55) {
    if (!silenceTimer) {
      silenceTimer = setTimeout(() => {
        if (msg && !msg.textContent) {
          const sel = $('mic-select');
          const micName = (sel && sel.selectedIndex >= 0) ? sel.options[sel.selectedIndex].text : '選択中のマイク';
          msg.textContent = `⚠️ 「${micName}」が5秒以上無音です。マイクのミュート/ゲイン、または別のマイクを試してください`;
          msg.style.color = 'var(--yellow)';
        }
      }, 5000);
    }
  } else {
    if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
  }

  vuAnimFrame = requestAnimationFrame(updateVUMeter);
}

// ===== IndexedDB クラッシュリカバリー =====
// =========================================================

const IDB_NAME = 'surecast-recovery';
const IDB_VERSION = 1;
let idb = null;

function openIDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('sessions')) {
        db.createObjectStore('sessions', { keyPath: 'sessionId' });
      }
      if (!db.objectStoreNames.contains('chunks')) {
        const s = db.createObjectStore('chunks', { keyPath: 'key' });
        s.createIndex('sessionId', 'sessionId', { unique: false });
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

function idbReq(req) {
  return new Promise((resolve, reject) => {
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror  = (e) => reject(e.target.error);
  });
}

async function idbSaveChunk(sessionId, chunkIndex, blob, mimeType) {
  if (!idb) return;
  const tx = idb.transaction(['chunks', 'sessions'], 'readwrite');
  tx.objectStore('chunks').put({ key: `${sessionId}-${chunkIndex}`, sessionId, chunkIndex, blob, mimeType });
  tx.objectStore('sessions').put({ sessionId, mimeType, chunkCount: chunkIndex, ts: Date.now() });
}

async function idbGetSessions() {
  if (!idb) return [];
  const tx = idb.transaction('sessions', 'readonly');
  return idbReq(tx.objectStore('sessions').getAll());
}

async function idbGetChunks(sessionId) {
  if (!idb) return [];
  const tx = idb.transaction('chunks', 'readonly');
  const all = await idbReq(tx.objectStore('chunks').index('sessionId').getAll(sessionId));
  return all.sort((a, b) => a.chunkIndex - b.chunkIndex);
}

async function idbClearSession(sessionId) {
  if (!idb) return;
  const chunks = await idbGetChunks(sessionId);
  const tx = idb.transaction(['chunks', 'sessions'], 'readwrite');
  chunks.forEach(c => tx.objectStore('chunks').delete(c.key));
  tx.objectStore('sessions').delete(sessionId);
}

async function checkRecovery() {
  const sessions = await idbGetSessions();
  if (sessions.length === 0) return;

  const banner   = $('recovery-banner');
  const subLabel = $('recovery-sub');
  const btnDl    = $('btn-recovery-dl');
  const btnDel   = $('btn-recovery-del');

  const session = sessions.sort((a, b) => b.ts - a.ts)[0];
  const d = new Date(session.ts);
  subLabel.textContent =
    `セッション: ${session.sessionId}  チャンク数: ${session.chunkCount}  `
    + `(${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} `
    + `${pad(d.getHours())}:${pad(d.getMinutes())})`;

  banner.classList.add('visible');

  btnDl.onclick = async () => {
    btnDl.disabled = true;
    btnDl.textContent = '変換中...';
    const chunks = await idbGetChunks(session.sessionId);
    if (chunks.length === 0) { banner.classList.remove('visible'); return; }
    const mimeType = chunks[0].mimeType || 'audio/webm;codecs=opus';
    const blob = new Blob(chunks.map(c => c.blob), { type: mimeType });
    if (blob.size === 0) { banner.classList.remove('visible'); return; }

    const username = getUserName();
    addConvertStatus('recover', `変換中（クラッシュ復元）... ${formatSize(blob.size)}`, 'converting');
    try {
      const data = await uploadForFlacConversion(blob, username);
      updateConvertStatus('recover', `✓ 復元保存完了：${data.filename} (${formatSize(data.size)})`, 'done');
      await idbClearSession(session.sessionId);
    } catch (err) {
      // FLAC変換失敗時はWebMとして直接ダウンロード
      const webmFilename = downloadWebmDirect(blob, username, session.sessionId);
      updateConvertStatus('recover', `⚠️ FLAC変換失敗 → WebMで保存済み：${webmFilename}`, 'error');
    }

    banner.classList.remove('visible');
  };

  btnDel.onclick = async () => {
    await idbClearSession(session.sessionId);
    banner.classList.remove('visible');
    showToast('前回の録音データを削除しました', 'info');
  };
}

    || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia;

function detectInAppBrowser() {

    <button id="inapp-copy-btn" style="padding:12px 24px;background:#222;color:#d97706;border:1px solid #d97706;border-radius:10px;font-weight:700;font-size:0.9rem;cursor:pointer;font-family:inherit;">📋 URLをコピー</button>

  document.body.appendChild(overlay);

function getBestMimeType() {
  const types = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/ogg;codecs=opus',
    'audio/mp4'
  ];
  for (const t of types) {
    if (MediaRecorder.isTypeSupported(t)) return t;
  }
  return '';
}

async function startRecording(clockSync = null) {
  if (!LOCAL_RECORDING_ENABLED) return; // サーバー録音のみ運用
  if (state.isRecording || state.starting) return;
  state.starting = true;
  try {
    const freshClock = clockSync || await syncClockWithServer({ showWarning: true });
    const audioTrack = await ensureRecordingAudioReady();
    state.stream = new MediaStream([audioTrack]);
    state.streamShared = true;

    state.mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
      ? 'audio/webm;codecs=opus'
      : getBestMimeType();

    state.chunks = [];
    state.chunkCount = 0;
    const _now = new Date();
    state.sessionId = `${_now.getFullYear()}${pad(_now.getMonth()+1)}${pad(_now.getDate())}-${pad(_now.getHours())}${pad(_now.getMinutes())}${pad(_now.getSeconds())}`;

    state.mediaRecorder = new MediaRecorder(state.stream, {
      mimeType: state.mimeType || undefined,
      audioBitsPerSecond: 128000, // 128kbps（AGCオフの生録音。モノラル音声では実用上ロスレス相当）
    });

    state.mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) {
        // メモリに保持（主要パス）
        state.chunks.push(e.data);
        // IDBにバックアップ保存（クラッシュリカバリー用・失敗しても録音は続く）
        if (idb && state.sessionId) {
          state.chunkCount++;
          const idx = state.chunkCount;
          const sid = state.sessionId;
          const mt = state.mimeType;
          idbSaveChunk(sid, idx, e.data, mt).catch(() => {});
        }
      }
    };

    state.mediaRecorder.onstop = finalizeRecording;
    state.syncId = ws.syncId || null;
    state.startEpoch = null;
    state.clockSyncOk = freshClock.clockSyncOk;
    state.clockRttMs = freshClock.clockRttMs;
    state.clockOffsetMs = freshClock.clockOffsetMs;
    state.mediaRecorder.onstart = () => {
      state.startEpoch = Date.now() + (ws.clockOffset || 0);
    };
    state.mediaRecorder.start(10000); // 10秒チャンク（IDB書き込み頻度を下げCPU/IO負荷軽減）

    state.isRecording = true;
    state.startTime = Date.now();

    setRecordingUI(true);
    startTimer();

    setDot('local-rec', 'active');
    $('label-local-rec').textContent = 'ローカル録音：収録中';
    setFooterStatus('local', 'active', 'ローカル録音：収録中');

    showToast('録音を開始しました', 'success');
    if (ws.inCall && ws.socket) ws.socket.emit('recording-status', { isRecording: true });
    return true;

  } catch (err) {
    showToast(`録音開始エラー: ${err.message}`, 'error');
    return false;
  } finally {
    state.starting = false;
  }
}

function stopRecording({ forRecovery = false } = {}) {
  if (!state.mediaRecorder) return null;
  const recorder = state.mediaRecorder;
  clearInterval(state.timerInterval);
  if (recorder.state !== 'inactive') recorder.stop();
  if (!state.streamShared) state.stream?.getTracks().forEach(t => t.stop());
  state.isRecording = false;
  if (!forRecovery) setRecordingUI(false);

  setDot('local-rec', '');
  $('label-local-rec').textContent = forRecovery ? 'ローカル録音：マイク復旧中...' : 'ローカル録音：変換中...';
  setFooterStatus('local', '', forRecovery ? 'マイク復旧中...' : 'ローカル録音：変換中...');
  if (!forRecovery && ws.inCall && ws.socket) ws.socket.emit('recording-status', { isRecording: false });
  return recorder;
}

async function finalizeRecording() {
  const sessionId = state.sessionId;
  const mimeType = state.mimeType || 'audio/webm;codecs=opus';
  const syncMeta = {
    syncId: state.syncId || null,
    startEpoch: state.startEpoch || null,
    endEpoch: Date.now() + (ws.clockOffset || 0),
    clockSyncOk: state.clockSyncOk,
    clockRttMs: state.clockRttMs,
    clockOffsetMs: state.clockOffsetMs,
  };
  const memoryChunks = [...state.chunks]; // メモリチャンクをコピー
  state.chunks = []; // クリア
  const ownsRecordingUI = () => state.sessionId === sessionId && !state.isRecording;

  let finalBlob = null;

  if (memoryChunks.length > 0) {
    // ★ メインパス：メモリチャンクを使用（確実）
    finalBlob = new Blob(memoryChunks, { type: mimeType });
    console.log(`[録音] メモリチャンク ${memoryChunks.length}個 → ${formatSize(finalBlob.size)}`);
  } else {
    // フォールバック：IDBから読み出し（メモリが空の場合）
    console.warn('[録音] メモリチャンクが空 → IDBからフォールバック');
    const idbChunks = await idbGetChunks(sessionId);
    if (idbChunks.length > 0) {
      finalBlob = new Blob(idbChunks.map(c => c.blob), { type: mimeType });
      console.log(`[録音] IDBチャンク ${idbChunks.length}個 → ${formatSize(finalBlob.size)}`);
    }
  }

  if (!finalBlob || finalBlob.size === 0) {
    console.warn('[録音] データがありません（メモリ・IDB両方空）');
    if (ownsRecordingUI()) {
      setDot('local-rec', 'warn');
      $('label-local-rec').textContent = 'ローカル録音：停止中（データなし）';
      setFooterStatus('local', 'warn', 'データなし');
    }
    setRecordingHealthAlert({ username: getUserName(), source: 'local-empty', active: true });
    await idbClearSession(sessionId);
    return;
  }

  const username = getUserName();
  const itemId = 'local-' + sessionId;
  addConvertStatus(itemId, `FLAC変換・アップロード中... (${formatSize(finalBlob.size)}) ※低回線では時間がかかります`, 'converting');

  try {
    const data = await uploadForFlacConversion(finalBlob, username, syncMeta);
    updateConvertStatus(itemId, `✓ 保存完了：${data.filename} (${formatSize(data.size)})`, 'done');
    if (ownsRecordingUI()) {
      setDot('local-rec', 'ok');
      $('label-local-rec').textContent = 'ローカル録音：保存完了';
      setFooterStatus('local', 'ok', 'ローカル録音：保存完了');
      setTimeout(() => {
        if (!state.isRecording) {
          $('label-local-rec').textContent = 'ローカル録音：停止中';
          setFooterStatus('local', '', 'ローカル録音：停止中');
        }
      }, 5000);
    }
    await idbClearSession(sessionId);
  } catch (err) {
    // ★ FLAC変換失敗時：WebMとして直接ダウンロード（低回線でのセーフティネット）
    console.warn('[録音] FLAC変換失敗 → WebMダウンロードフォールバック:', err.message);
    const webmFilename = downloadWebmDirect(finalBlob, username, sessionId);
    updateConvertStatus(itemId,
      `⚠️ FLAC変換失敗のためWebMで保存済み：${webmFilename}\n（エラー：${err.message}）`,
      'error'
    );
    if (ownsRecordingUI()) {
      setDot('local-rec', 'warn');
      $('label-local-rec').textContent = 'ローカル録音：WebMで保存済み';
      setFooterStatus('local', 'warn', 'ローカル録音：WebMで保存済み');
    }
    showToast('FLAC変換に失敗しました。WebMファイルとしてダウンロードしました。', 'error');
    // IDBは保持しておく（再試行可能なように）
  }
}

async function uploadForFlacConversion(blob, username, syncMeta = null) {
  const formData = new FormData();
  formData.append('audio', blob, 'recording.webm');
  formData.append('username', (username || 'user').replace(/[^a-zA-Z0-9_\-]/g, '_').slice(0, 20));
  if (syncMeta?.syncId && syncMeta.startEpoch) {
    formData.append('syncId', syncMeta.syncId);
    formData.append('startEpoch', String(Math.round(syncMeta.startEpoch)));
    formData.append('endEpoch', String(Math.round(syncMeta.endEpoch || Date.now() + (ws.clockOffset || 0))));
    formData.append('clockSyncOk', String(syncMeta.clockSyncOk === true));
    if (syncMeta.clockRttMs !== null) formData.append('clockRttMs', String(Math.round(syncMeta.clockRttMs)));
    if (syncMeta.clockOffsetMs !== null) formData.append('clockOffsetMs', String(Math.round(syncMeta.clockOffsetMs)));
  }

  // タイムアウトを10分に設定（低回線での大容量アップロード対応）
  // 2時間×96kbps ≈ 86MB のアップロードを許容
  const controller = new AbortController();
  const uploadTimeout = setTimeout(() => controller.abort(), 10 * 60 * 1000);

  try {
    const res = await fetch('/convert-to-flac', {
      method: 'POST',
      body: formData,
      signal: controller.signal,
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
      throw new Error(err.error || `HTTP ${res.status}`);
    }
    return res.json();
  } finally {
    clearTimeout(uploadTimeout);
  }
}

// WebMとしてブラウザから直接ダウンロード（FLAC変換失敗時のバックアップ）
function downloadWebmDirect(blob, username, sessionId) {
  const safeUser = (username || 'user').replace(/[^a-zA-Z0-9_\-]/g, '_').slice(0, 20);
  const filename = `${safeUser}-${sessionId}-local.webm`;
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  showToast(`WebMとして保存しました: ${filename}`, 'info');
  return filename;
}

function addConvertStatus(id, text, type) {
  const list = $('convert-status-list');
  const item = document.createElement('div');
  item.className = `convert-item ${type}`;
  item.id = `convert-item-${id}`;

  const icons = { converting: '🔄', done: '✓', error: '⚠️' };
  item.innerHTML = `
    <div class="convert-icon">${icons[type] || '🎵'}</div>
    <div class="convert-text">
      <div class="convert-title" id="convert-title-${id}">${text}</div>
      <div class="convert-sub">${new Date().toLocaleTimeString('ja-JP')}</div>
    </div>
  `;
  list.insertBefore(item, list.firstChild);
}

function updateConvertStatus(id, text, type) {
  const item = $(`convert-item-${id}`);
  if (item) {
    item.className = `convert-item ${type}`;
    const icons = { converting: '🔄', done: '✓', error: '⚠️' };
    const icon = item.querySelector('.convert-icon');
    const title = $(`convert-title-${id}`);
    if (icon) icon.textContent = icons[type] || '🎵';
    if (title) title.textContent = text;
  }
}

function startTimer() {
  const timerEl = $('rec-timer-inline');
  timerEl.style.display = 'inline';
  // 呼び出し時点を必ず起点にする（サーバー録音のみの構成でも0:00から始まるように）
  state.startTime = Date.now();
  timerEl.textContent = '00:00';
  clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    timerEl.textContent = `${m}:${s}`;
  }, 500);
}

function setRecordingUI(recording) {
  btnStart.disabled = recording;
  btnStop.disabled  = !recording;
  micSelect.disabled = recording;
  $('speaker-mode').disabled = recording;
  updateRecAllButton();

  const leftCol = $('left-col');
  if (recording) {
    leftCol.classList.add('recording');
  } else {
    leftCol.classList.remove('recording');
    const timerEl = $('rec-timer-inline');
    timerEl.style.display = 'none';
    timerEl.textContent = '';
  }
}

function setFooterStatus(type, dotClass, label) {
  if (type === 'local') {
    setDot('local-rec', dotClass);
    $('label-local-rec').textContent = label;
  } else if (type === 'srv') {
    setDot('srv-rec', dotClass);
    $('label-srv-rec').textContent = label;
  }
}

async function checkServer() {
  try {
    const res = await fetch('/recordings', { signal: AbortSignal.timeout(3000) });
    if (res.ok) {
      setDot('srv-rec', '');
      $('label-srv-rec').textContent = '録音：待機中';
    }
  } catch {
    // サイレントに失敗
  }
}

// =========================================================
// ===== 接続品質モニタリング（RTT計測）=====
// =========================================================

let rttPingSentAt = null;
let rttInterval = null;

function startRTTMonitoring() {
  if (rttInterval) return;
  measureRTT(); // 即時計測
  rttInterval = setInterval(measureRTT, 15000); // 15秒ごと
}

function stopRTTMonitoring() {
  if (rttInterval) { clearInterval(rttInterval); rttInterval = null; }
  setDot('conn', '');
  $('label-conn').textContent = '接続品質：－';
}

function measureRTT() {
  if (!ws.socket || !ws.socket.connected) return;
  rttPingSentAt = Date.now();
  ws.socket.volatile.emit('client-ping'); // volatile: 計測用なので破棄されてもOK
}

function updateConnQuality(rtt) {
  const label = $('label-conn');
  const dot = $('dot-conn');
  if (!label || !dot) return;

  if (rtt < 150) {
    dot.className = 'dot ok';
    label.textContent = `接続品質：良好 (${rtt}ms)`;
  } else if (rtt < 500) {
    dot.className = 'dot warn';
    label.textContent = `接続品質：やや遅い (${rtt}ms)`;
  } else if (rtt < 1500) {
    dot.className = 'dot warn';
    label.textContent = `接続品質：低速 (${rtt}ms)`;
  } else {
    dot.className = 'dot active'; // 赤点滅
    label.textContent = `接続品質：非常に低速 (${rtt}ms) ⚠️`;
  }
}

btnStart.addEventListener('click', () => { void startRecordingPair(); });
btnStop.addEventListener('click', () => {
  // 一斉録音セッション中（syncIdあり）は全員停止、個別録音は自分だけ停止
  if ((state.syncId || ws.syncId) && ws.socket && ws.inCall) {
    if (!confirm('参加中の全員の録音を停止します。よろしいですか？')) return;
    ws.socket.emit('recording-stop-all');
  } else {
    stopRecording();
    stopServerRecording();
    ws.syncId = null;
  }
});
window.addEventListener('beforeunload', (e) => {
  if (isRecordingActive()) {
    e.preventDefault();
    e.returnValue = '録音中です。ページを離れると録音データが失われる可能性があります。';
    // メモリ上の未保存チャンクをIDBに緊急フラッシュ（クラッシュリカバリー用）
    if (idb && state.sessionId && state.chunks.length > 0) {
      try {
        const tx = idb.transaction(['chunks', 'sessions'], 'readwrite');
        state.chunks.forEach((chunk, i) => {
          const idx = state.chunkCount - state.chunks.length + i + 1;
          tx.objectStore('chunks').put({ key: `${state.sessionId}-${idx}`, sessionId: state.sessionId, chunkIndex: idx, blob: chunk, mimeType: state.mimeType });
        });
        tx.objectStore('sessions').put({ sessionId: state.sessionId, mimeType: state.mimeType, chunkCount: state.chunkCount, ts: Date.now() });
      } catch {}
    }
  }
  if (srvRecActive) {
    // sendBeacon でサーバーにページ離脱を通知（Socket.io emit は beforeunload で届かないことがある）
    // サーバー側は切断イベント + グレース期間で対応するので最低限の通知でOK
    try { navigator.sendBeacon('/api/recording-stop', JSON.stringify({ note: 'beforeunload' })); } catch {}
    stopServerRecording();
  }
});

// =========================================================
// ===== 初期化 =====
// =========================================================
(async () => {
  loadRoomFromUrl();
  loadUsername();
  // 初めて使う端末（保存名なし）では、入力欄を強調してフォーカスする
  const hasSavedUsername = Boolean(localStorage.getItem(LS_USERNAME_KEY));
  updateUsernameRequirement({ highlight: !hasSavedUsername });
  $('username-input')?.addEventListener('input', () => updateUsernameRequirement({ highlight: true }));
  if (!hasSavedUsername) {
    setTimeout(() => $('username-input')?.focus(), 300);
  }
  loadLocalEpisodes();
  updateSyncBadge('offline');
  initSocket();
  // マイク検出が10秒経っても終わらない場合の案内（許可ダイアログ放置・アプリ内ブラウザ等）
  const micTimeout = setTimeout(() => {
    if ($('label-mic').textContent.includes('未接続')) {
      $('label-mic').textContent = 'マイク：検出できません';
      setDot('mic', 'warn');
      showToast('マイクを検出できません。①許可ダイアログで「許可」を選択 ②Safari/Chromeで開いているか確認 ③OSのマイク権限を確認してください', 'error');
    }
  }, 10000);
  await loadMics();
  clearTimeout(micTimeout);
  await checkServer();
  idb = await openIDB().catch(() => null);
  await checkRecovery();

  // URLにroomパラメータがある場合、事前に台本を読み込む
  const _initParams = new URLSearchParams(window.location.search);
  const _initRoom = _initParams.get('room');
  if (_initRoom) {
    await preloadRoomEpisodes(_initRoom.trim().toUpperCase());
  }
})();
</script>
