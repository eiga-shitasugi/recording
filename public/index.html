<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SureCast -SEAMLESS REMOTE RECORDING-</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #222222;
      --border: #2a2a2a;
      --accent: #d97706;
      --accent-hover: #f59e0b;
      --red: #ef4444;
      --red-dark: #dc2626;
      --green: #22c55e;
      --yellow: #f59e0b;
      --teal: #22c55e;
      --text: #f5f5f5;
      --text-dim: #a0a0a0;
      --radius: 12px;
    }

    body {
      font-family: 'Hiragino Sans', 'Meiryo', 'Yu Gothic', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== ヘッダー ===== */
    header {
      background: #0f0f0f;
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .header-logo { height: 44px; width: auto; display: block; }
    header .header-link {
      margin-left: auto;
      font-size: 0.82rem;
      color: var(--accent);
      text-decoration: none;
      padding: 6px 12px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      transition: background 0.15s;
      white-space: nowrap;
    }
    header .header-link:hover { background: rgba(217,119,6,0.15); }

    /* ===== ステータスバー ===== */
    #status-bar {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      padding: 6px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 0.80rem;
      flex-shrink: 0;
    }
    .status-item { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    /* ステータスバー内のコンパクトマイク選択 */
    .status-mic-select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      padding: 1px 4px;
      font-size: 0.74rem;
      font-family: inherit;
      outline: none;
      width: auto;
      max-width: 160px;
      cursor: pointer;
      height: 20px;
    }
    .status-mic-select:focus { border-color: var(--accent); }
    .speaker-mode-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--text);
      cursor: pointer;
      white-space: normal;
    }
    .speaker-mode-toggle input { accent-color: var(--accent); }
    .speaker-mode-help {
      color: var(--text-dim);
      font-size: 0.70rem;
      white-space: normal;
    }
    #recording-health-bar {
      background: #451a1a;
      border-bottom: 1px solid var(--red);
      color: #fee2e2;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.86rem;
      font-weight: 700;
      flex-wrap: wrap;
    }
    #recording-health-bar[hidden] { display: none; }
    #recording-health-messages { display: grid; gap: 4px; }
    #btn-reacquire-mic {
      border: 1px solid #fecaca;
      border-radius: 6px;
      background: #fef2f2;
      color: #991b1b;
      padding: 7px 11px;
      font: inherit;
      cursor: pointer;
    }
    #btn-reacquire-mic:disabled { opacity: 0.55; cursor: wait; }
    #preflight-results {
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      background: #111;
      color: var(--text);
      font-size: 0.80rem;
    }
    #preflight-results[hidden] { display: none; }
    .preflight-summary { font-weight: 800; margin-bottom: 8px; }
    .preflight-summary.ok { color: var(--green); }
    .preflight-summary.warn { color: var(--yellow); }
    .preflight-table-wrap { overflow-x: auto; }
    .preflight-table { width: 100%; border-collapse: collapse; min-width: 760px; }
    .preflight-table th, .preflight-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; }
    .preflight-table th { color: var(--text-dim); font-size: 0.72rem; }
    .preflight-fix { color: var(--yellow); }
    .preflight-disk { margin-top: 8px; color: var(--text-dim); }
    /* ステータスバー内のdB表示（非表示） */
    .status-db {
      display: none;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
    }
    .dot.active      { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
    .dot.ok          { background: var(--green);  animation: none; }
    .dot.warn        { background: var(--yellow); animation: none; }
    .dot.converting  { background: var(--teal);   animation: pulse 0.6s ease-in-out infinite; }
    .dot.call-active { background: var(--teal);   animation: pulse 1s ease-in-out infinite; }
    .dot.srv-rec     { background: var(--red);    animation: pulse 0.8s ease-in-out infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.85); }
    }

    /* ===== 2カラム メインレイアウト ===== */
    main {
      flex: 1;
      padding: 16px;
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr);
      gap: 16px;
      align-items: stretch;   /* 縦方向も使い切る（従来は start で下が余っていた） */
      max-width: 1800px;
      width: 100%;
      margin: 0 auto;
      min-height: 0;          /* grid内のスクロール領域を正しく機能させる */
    }

    #left-col { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
    #right-col { display: flex; flex-direction: column; min-height: 0; }
    /* 台本カードを右カラムいっぱいに広げ、本文欄が余白を吸収する */
    #right-col > .card { flex: 1; display: flex; flex-direction: column; min-height: 0; }

    /* ===== カード ===== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }
    .card-title {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ===== ボタン共通 ===== */
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      padding: 11px 16px;
      border: none;
      border-radius: var(--radius);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-record { background: var(--accent); color: #000; }
    .btn-record:not(:disabled):hover { background: var(--accent-hover); }
    .btn-stop   { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-stop:not(:disabled):hover { background: var(--border); }
    .btn-teal   { background: var(--accent); color: #000; font-weight: 800; width: 100%; padding: 13px; font-size: 0.95rem; }
    .btn-teal:not(:disabled):hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-ghost  { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:not(:disabled):hover { background: var(--border); }
    .btn-danger { background: rgba(255,68,68,0.15); color: var(--red); border: 1px solid var(--red); }
    .btn-danger:not(:disabled):hover { background: rgba(255,68,68,0.25); }
    .btn.muted  { opacity: 0.55; }

    /* ===== フォーム ===== */
    .form-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    label { font-size: 0.80rem; color: var(--text-dim); }
    select, input[type="text"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 9px 12px;
      font-size: 0.88rem;
      font-family: inherit;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }
    select:focus, input[type="text"]:focus { border-color: var(--accent); }
    select { cursor: pointer; }
    select option { background: var(--surface2); }
    input[type="text"]::placeholder { color: var(--text-dim); }

    .room-input-row { display: flex; gap: 8px; align-items: stretch; }
    .room-input-row input {
      flex: 1;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .room-input-row .btn-ghost {
      flex: 0 0 auto;
      padding: 9px 12px;
      font-size: 0.80rem;
    }

    /* ===== ビデオグリッド ===== */
    #video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* JSが人数に応じて上書き */
      gap: 8px;
      margin-bottom: 10px;
      align-content: start;
    }
    /* 各ビデオタイルは16:9で列幅いっぱいに広げる */
    #video-grid .video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 72vh;
    }
    #video-grid .video-wrapper video { object-fit: cover; }
    /* 1人参加時：中央寄せの大きめ横長表示 */
    #video-grid.solo {
      grid-template-columns: 1fr;
      max-width: 640px;
      margin: 0 auto;
    }
    .video-wrapper {
      position: relative; background: #000;
      border-radius: 10px; overflow: hidden;
      border: 2px solid var(--border);
    }
    .video-wrapper.local-wrapper  { border-color: var(--teal); }
    .video-wrapper.remote-wrapper { border-color: var(--border); }
    .video-wrapper video { width: 100%; height: 100%; object-fit: contain; display: block; }
    .local-wrapper video { transform: scaleX(-1); }
    .video-label {
      position: absolute; bottom: 6px; left: 6px;
      background: rgba(0,0,0,0.65); color: #fff;
      padding: 2px 8px; border-radius: 20px;
      font-size: 0.70rem; font-weight: 700; pointer-events: none;
    }
    .local-wrapper .video-label { background: rgba(34,197,94,0.75); }
    .video-placeholder {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 6px; color: var(--text-dim); font-size: 0.80rem;
      background: var(--surface2);
    }
    .video-placeholder .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--border);
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
    }

    /* ===== 招待バー + コントロール 1行レイアウト ===== */
    #call-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    #invite-bar {
      flex: 1;
      min-width: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #invite-bar .invite-label { font-size: 0.74rem; color: var(--text-dim); flex-shrink: 0; }
    #invite-url-text { flex: 1; font-size: 0.76rem; color: var(--teal); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; font-weight: 600; }
    #btn-copy-url {
      flex-shrink: 0;
      background: var(--accent); color: #000;
      border: none; border-radius: 6px;
      padding: 4px 8px; font-size: 0.74rem; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: background 0.15s; white-space: nowrap;
    }
    #btn-copy-url:hover { background: var(--accent-hover); }

    /* ===== 通話メタ ===== */
    #call-meta {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.80rem; margin-bottom: 10px;
    }
    #call-participants { font-weight: 700; color: var(--teal); }

    /* ===== 通話コントロール行 ===== */
    #call-controls {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      align-items: center;
      flex-shrink: 0;
    }
    #call-controls .btn { padding: 7px 10px; font-size: 0.78rem; }

    /* ===== VUメーター ===== */
    .vu-container {
      padding: 6px 10px;
      background: #111;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 0;
    }
    .vu-label {
      font-size: 0.74rem;
      color: var(--text-dim);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .vu-label .vu-db { font-variant-numeric: tabular-nums; font-weight: 600; }
    .vu-bar-wrap {
      height: 8px;
      background: #1a1a1a;
      border-radius: 4px;
      overflow: hidden;
    }
    .vu-bar {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      transition: width 0.06s linear;
      background: linear-gradient(
        to right,
        #15803d 0%, #15803d 80%,
        #22c55e 80%, #22c55e 90%,
        #f59e0b 90%, #f59e0b 97%,
        #ef4444 97%, #ef4444 100%
      );
    }
    #vu-message {
      margin-top: 4px;
      font-size: 0.74rem;
      min-height: 0;
      font-weight: 600;
      line-height: 1.3;
    }

    /* ===== 録音タイマー ===== */
    #rec-timer-inline {
      font-size: 1.05rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      min-width: 48px;
      display: none;
    }

    /* ===== 変換ステータス ===== */
    #convert-status-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .convert-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.82rem;
    }
    .convert-item.converting { border-color: var(--accent); }
    .convert-item.done       { border-color: var(--green); }
    .convert-item.error      { border-color: var(--red); }
    .convert-icon { font-size: 1rem; flex-shrink: 0; }
    .convert-text { flex: 1; min-width: 0; }
    .convert-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .convert-sub { font-size: 0.72rem; color: var(--text-dim); margin-top: 1px; }

    /* ===== クラッシュリカバリーバナー ===== */
    #recovery-banner {
      display: none;
      background: #1a1200;
      border-bottom: 2px solid var(--accent);
      padding: 12px 24px;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 0.86rem;
      flex-shrink: 0;
    }
    #recovery-banner.visible { display: flex; }
    #recovery-banner .recovery-msg { flex: 1; color: var(--accent); font-weight: 600; }
    #recovery-banner .recovery-sub { font-size: 0.76rem; color: var(--text-dim); margin-top: 2px; }
    #recovery-banner .btn-recovery-dl {
      background: var(--accent); color: #000; border: none; border-radius: 6px;
      padding: 6px 14px; font-size: 0.80rem; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    #recovery-banner .btn-recovery-del {
      background: transparent; color: var(--text-dim); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 12px; font-size: 0.80rem; cursor: pointer; white-space: nowrap;
    }
    #recovery-banner .btn-recovery-del:hover { color: var(--red); border-color: var(--red); }

    /* ===== トースト ===== */
    #toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 18px;
      font-size: 0.86rem; font-weight: 600;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1000; white-space: nowrap; max-width: 90vw; text-align: center;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.success { border-color: var(--green); color: var(--green); }
    #toast.error   { border-color: var(--red);   color: var(--red);   }
    #toast.info    { border-color: var(--accent); color: var(--accent); }

    /* ===== 一斉録音カウントダウン ===== */
    #recording-countdown {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.92);
      color: #fff;
      text-align: center;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, visibility 0s linear 0.35s;
    }
    #recording-countdown.visible {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.18s ease;
    }
    .film-countdown-frame {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: min(100%, 420px);
    }
    .film-countdown-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #f59e0b;
    }
    .film-countdown-dial {
      position: relative;
      width: min(58vw, 230px);
      aspect-ratio: 1;
      overflow: hidden;
      border: 3px solid #fff;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #111;
    }
    .film-countdown-dial::before,
    .film-countdown-dial::after {
      content: '';
      position: absolute;
      z-index: 1;
      background: rgba(255, 255, 255, 0.35);
    }
    .film-countdown-dial::before { width: 100%; height: 1px; }
    .film-countdown-dial::after { width: 1px; height: 100%; }
    .film-countdown-wipe {
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
      animation: film-circle-wipe 1s linear forwards;
    }
    .film-countdown-sweep {
      position: absolute;
      z-index: 3;
      left: calc(50% - 1px);
      bottom: 50%;
      width: 2px;
      height: 46%;
      background: #fff;
      transform-origin: 50% 100%;
      animation: film-clock-sweep 1s linear forwards;
    }
    #recording-countdown-value {
      position: relative;
      z-index: 4;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 7rem;
      line-height: 1;
      font-weight: 700;
    }
    .film-countdown-note {
      min-height: 2.8em;
      font-size: 1rem;
      line-height: 1.6;
      font-weight: 700;
    }
    #recording-countdown.started .film-countdown-dial {
      border-color: #22c55e;
      background: #122d1b;
    }
    #recording-countdown.started #recording-countdown-value {
      font-family: inherit;
      font-size: 2.3rem;
      color: #86efac;
    }
    #recording-countdown.started .film-countdown-note { color: #86efac; }
    @keyframes film-circle-wipe {
      from { clip-path: circle(72% at 50% 50%); }
      to { clip-path: circle(0 at 50% 50%); }
    }
    @keyframes film-clock-sweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ===== 台本エリア ===== */
    #episode-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    #episode-tabs { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; }
    .ep-tab {
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-dim);
      font-size: 0.80rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      white-space: nowrap;
    }
    .ep-tab:hover { border-color: var(--accent); color: var(--text); }
    .ep-tab.active { background: var(--accent); border-color: var(--accent); color: #000; }
    #btn-ep-add {
      padding: 5px 10px;
      border-radius: 20px;
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--text-dim);
      font-size: 0.80rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      white-space: nowrap;
    }
    #btn-ep-add:hover { border-color: var(--accent); color: var(--accent); }
    #episode-actions { display: flex; gap: 5px; flex-shrink: 0; }
    .ep-action-btn {
      padding: 4px 9px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-dim);
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      white-space: nowrap;
    }
    .ep-action-btn:hover { color: var(--text); background: var(--border); }
    .ep-action-btn.danger:hover { border-color: var(--red); color: var(--red); background: rgba(255,68,68,0.1); }

    #script-textarea {
      width: 100%;
      flex: 1;
      min-height: 220px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 12px;
      font-size: 0.90rem;
      font-family: 'Hiragino Sans', 'Meiryo', 'Yu Gothic', sans-serif;
      line-height: 1.8;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }
    #script-textarea:focus { border-color: var(--accent); }

<script>
// ===== DOM ヘルパー =====
const $ = id => document.getElementById(id);

// ===== 共通 UI ヘルパー =====
function setDot(id, cls) {
  const dot = $(`dot-${id}`);
  if (dot) dot.className = 'dot' + (cls ? ` ${cls}` : '');
}

let toastTimer;
function showToast(msg, type = 'info') {
  const toast = $('toast');
  toast.textContent = msg;
  toast.className = `show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.className = ''; }, 3200);
}

const recordingHealthAlerts = new Map();

function renderRecordingHealthAlerts() {
  const bar = $('recording-health-bar');
  const messages = $('recording-health-messages');
  const recoverButton = $('btn-reacquire-mic');
  if (!bar || !messages || !recoverButton) return;

  messages.replaceChildren();
  let hasOwnRecoverableAlert = false;
  for (const alert of recordingHealthAlerts.values()) {
    const row = document.createElement('div');
    const isOwn = alert.username === getUserName();
    if (alert.reason === 'clock-sync') {
      row.textContent = alert.message || '⚠ サーバーとの時刻同期に失敗しました。録音は続行しますが、自動位置合わせは保証されません。';
    } else if (alert.reason === 'disk-low') {
      row.textContent = `⚠ サーバーの${alert.message || '空き容量が不足しています'}。録音は続行します。`;
    } else if (alert.reason === 'write-error') {
      row.textContent = `⚠ ${alert.message || `${alert.username}さんのサーバー録音を書き込めませんでした。`}`;
    } else if (alert.reason === 'discarded') {
      row.textContent = `⚠ ${alert.username}さんの録音は取得できませんでした。`;
    } else if (isOwn) {
      row.textContent = 'あなたの録音が記録されていません。マイクを選び直すか、ページを再読み込みしてください。';
      hasOwnRecoverableAlert = true;
    } else {
      row.textContent = `⚠ ${alert.username} さんの録音データが届いていません。マイクを確認してください。`;
    }
    messages.appendChild(row);
  }

  bar.hidden = recordingHealthAlerts.size === 0;
  recoverButton.style.display = hasOwnRecoverableAlert ? '' : 'none';
}

function setRecordingHealthAlert({ username, reason = 'no-audio', source = 'server', message = null, active = true }) {
  const safeName = String(username || 'user');
  const key = `${source}:${safeName}:${reason}`;
  if (active) recordingHealthAlerts.set(key, { username: safeName, reason, source, message });
  else recordingHealthAlerts.delete(key);
  renderRecordingHealthAlerts();
}

function clearOwnRecoverableRecordingAlerts() {
  const username = getUserName();
  for (const [key, alert] of recordingHealthAlerts) {
    if (alert.username === username && ['no-audio', 'recovered'].includes(alert.reason)) recordingHealthAlerts.delete(key);
  }
  renderRecordingHealthAlerts();
}

$('btn-reacquire-mic').addEventListener('click', () => recoverMicrophoneFromWarning());

let recordingCountdownTimer = null;
let recordingCountdownHideTimer = null;
let recordingCountdownLastValue = null;
let recordingCountdownAudioContext = null;

function playRecordingCountdownBeep(isStart = false) {
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    if (!recordingCountdownAudioContext) recordingCountdownAudioContext = new AudioContextClass();
    const ctx = recordingCountdownAudioContext;
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();
    const now = ctx.currentTime;
    oscillator.type = 'sine';
    oscillator.frequency.value = isStart ? 1040 : 760;
    gain.gain.setValueAtTime(0.015, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.045);
    oscillator.connect(gain);
    gain.connect(ctx.destination);
    oscillator.start(now);
    oscillator.stop(now + 0.05);
  } catch {}
}

function restartRecordingCountdownAnimation() {
  const dial = document.querySelector('.film-countdown-dial');
  if (!dial) return;
  dial.querySelectorAll('.film-countdown-wipe, .film-countdown-sweep').forEach((element) => {
    element.style.animation = 'none';
    void element.offsetWidth;
    element.style.animation = '';
  });
}

function hideRecordingCountdown() {
  clearInterval(recordingCountdownTimer);
  clearTimeout(recordingCountdownHideTimer);
  recordingCountdownTimer = null;
  recordingCountdownHideTimer = null;
  recordingCountdownLastValue = null;
  const overlay = $('recording-countdown');
  if (!overlay) return;
  overlay.classList.remove('visible', 'started');
  overlay.setAttribute('aria-hidden', 'true');
}

function showRecordingCountdown(countdownEndEpoch, { lateJoin = false } = {}) {
  const endEpoch = Number(countdownEndEpoch);
  const overlay = $('recording-countdown');
  const titleElement = $('recording-countdown-title');
  const valueElement = $('recording-countdown-value');
  const noteElement = $('recording-countdown-note');
  if (!overlay || !titleElement || !valueElement || !noteElement || !Number.isFinite(endEpoch)) return;
  if (endEpoch <= Date.now() + (ws.clockOffset || 0) - 500) return;

  hideRecordingCountdown();
  overlay.classList.add('visible');
  overlay.setAttribute('aria-hidden', 'false');
  titleElement.textContent = lateJoin ? '接続しました。録音を開始しています' : '録音準備中';
  noteElement.textContent = lateJoin
    ? '3、2、1の合図で会話に参加してください。'
    : '3、2、1の合図で本編を始めてください。';

  const render = () => {
    const remainingMs = endEpoch - (Date.now() + (ws.clockOffset || 0));
    if (remainingMs > 0) {
      const value = Math.max(1, Math.ceil(remainingMs / 1000));
      valueElement.textContent = String(value);
      overlay.dataset.value = String(value);
      if (value !== recordingCountdownLastValue) {
        recordingCountdownLastValue = value;
        restartRecordingCountdownAnimation();
        playRecordingCountdownBeep(false);
      }
      return;
    }

    clearInterval(recordingCountdownTimer);
    recordingCountdownTimer = null;
    if (recordingCountdownLastValue !== 0) playRecordingCountdownBeep(true);
    recordingCountdownLastValue = 0;
    valueElement.textContent = 'スタート';
    overlay.dataset.value = 'start';
    noteElement.textContent = lateJoin ? '会話に参加してください' : '収録を始めてください';
    overlay.classList.add('started');
    recordingCountdownHideTimer = setTimeout(hideRecordingCountdown, 900);
  };

  render();
  recordingCountdownTimer = setInterval(render, 50);
}

// ===== フォーマット =====
function pad(n) { return String(n).padStart(2, '0'); }
function formatDatetimeDisplay(d) {
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function formatSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
}

// ===== ユーザー名管理 =====
const LS_USERNAME_KEY = 'surecast-username';

function generateRandomName() {
  const adj = ['Swift', 'Calm', 'Bold', 'Deep', 'Pure', 'Keen'];
  const noun = ['Wave', 'Cast', 'Mic', 'Voice', 'Air', 'Studio'];
  return adj[Math.floor(Math.random() * adj.length)] + noun[Math.floor(Math.random() * noun.length)];
}

function getUserName() {
  if (ws.inCall && ws.username) return ws.username;
  const inputVal = $('username-input') ? $('username-input').value.trim() : '';
  return inputVal;
}

function loadUsername() {
  const saved = localStorage.getItem(LS_USERNAME_KEY);
  if (saved && $('username-input')) $('username-input').value = saved;
}

function saveUsername(name) {
  if (name) localStorage.setItem(LS_USERNAME_KEY, name);
}

// 表示名が未入力のままでは参加できないようにする。
// 録音ファイル名になるため、誰の声かを後から特定できるようにする目的。
function updateUsernameRequirement({ highlight = false } = {}) {
  const input = $('username-input');
  const hint = $('username-hint');
  const joinButton = $('btn-join-call');
  if (!input || !joinButton) return false;

  const filled = input.value.normalize('NFKC').trim().length > 0;
  // 接続処理中（ボタンが「接続中...」）は触らない
  if (!joinButton.textContent.includes('接続中')) {
    joinButton.disabled = !filled;
    joinButton.title = filled ? '' : '先に表示名を入力してください';
  }
  if (hint) {
    hint.textContent = filled
      ? '録音ファイル名になります。誰の声か分かる名前を入力してください。'
      : '表示名を入力すると参加できます。';
    hint.classList.toggle('required', !filled && highlight);
  }
  input.classList.toggle('needs-input', !filled && highlight);
  return filled;
}

// ===== ピアのユーザー名管理 =====
const peerUsernames = {}; // peerId -> username

// =========================================================
// ===== WebRTC / ビデオ通話 =====
// =========================================================

// ICE設定（接続時に毎回取得して確実に反映する）
let _iceConfig = null;
async function getIceConfig() {
  if (_iceConfig) return _iceConfig;
  try {
    const r = await fetch('/api/turn-credentials');
    const data = await r.json();
    if (data.iceServers && data.iceServers.length > 0) {
      _iceConfig = { iceServers: data.iceServers };
      console.log('[TURN] クレデンシャル取得OK');
      return _iceConfig;
    }
  } catch(e) { console.warn('[TURN] 取得失敗、STUNにフォールバック', e); }
  _iceConfig = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
    ]
  };
  return _iceConfig;
}
// 後方互換のためSTUNも定義
const STUN = null; // createPeer内でgetIceConfig()を使用する

const ws = {
  socket: null,
  peers: {},
  localStream: null,
  roomId: null,
  username: null,
  inCall: false,
  audioMuted: false,
  videoMuted: false,
  callCore: null,
  clockOffset: 0,
  clockSyncState: { clockSyncOk: false, clockRttMs: null, clockOffsetMs: 0, syncedAt: null },
};

function hasPeer(peerId) {
  if (ws.callCore && ws.callCore.peers) return ws.callCore.peers.has(peerId);
  return !!ws.peers[peerId];
}
function getPeer(peerId) {
  if (ws.callCore && ws.callCore.peers) return ws.callCore.peers.get(peerId);
  return ws.peers[peerId];
}
function setPeer(peerId, pc) {
  if (ws.callCore && ws.callCore.peers) ws.callCore.peers.set(peerId, pc);
  else ws.peers[peerId] = pc;
}
function deletePeer(peerId) {
  if (ws.callCore && ws.callCore.peers) ws.callCore.peers.delete(peerId);
  delete ws.peers[peerId];
}
function peerCount() {
  if (ws.callCore && ws.callCore.peers) return ws.callCore.peers.size;
  return Object.keys(ws.peers).length;
}

function shouldInitiatePeer(peerId) {
  const myId = ws.socket?.id;
  if (!myId || !peerId) return false;
  return myId > peerId;
}

function ensureCallCore() {
  if (ws.callCore || !window.__CallCoreClass) return ws.callCore;
  ws.callCore = new window.__CallCoreClass({
    io,
    socket: ws.socket,
    getIceConfig,
    getLocalStream: async () => {
      if (ws.localStream) return ws.localStream;
      const { stream } = await acquireRawAudioStream(48000);
      return new MediaStream(stream.getAudioTracks());
    },
    onRemoteTrack: (peerId, stream) => addRemoteVideo(peerId, stream),
    onPeerStateChange: (peerId, conn, ice) => {
      console.log(`[CallCore] ${peerId} conn=${conn} ice=${ice}`);
      updatePeerConnectionState(peerId, conn, ice);
    },
    onParticipantsChange: (count) => {
      updateParticipants(count);
      if (ws.audioMuted) setTimeout(() => applyCallAudioMuteState(), 0);
    },
    onQualityChange: (profile) => updateCallQuality(profile),
    onPeerLeft: (peerId) => {
      delete peerUsernames[peerId];
      const wrapper = $(`wrapper-${peerId}`);
      if (wrapper) wrapper.remove();
      typingPeers.delete(peerId);
      updateTypingIndicator();
      updateVideoGridLayout();
    },
    onRoomFull: (max) => {
      showToast(`Room is full. Maximum ${max} participants.`, 'error');
      leaveCall();
    },
  });
  return ws.callCore;
}

// ===== Socket.io 初期化 =====
function initSocket() {
  ws.socket = io({
    reconnection: true,
    reconnectionAttempts: Infinity,    // 何度でも再接続
    reconnectionDelay: 500,            // 初回0.5秒後（早めの再接続）
    reconnectionDelayMax: 5000,        // 最大5秒間隔（高レイテンシ回線でも素早く復帰）
    timeout: 120000,                   // 接続タイムアウト2分（ping1500ms超対応）
    retries: 0,                        // イベントバッファリング無効（誤再送防止）
  });

  ws.socket.on('connect', () => {
    setDot('call', 'ok');
    if (ws.inCall && ws.roomId) {
      // 通話中に再接続した場合：ルームへ自動再参加
      $('label-call').textContent = `通話：再接続中 → ${ws.roomId}`;
      const username = getUserName();
      // 再接続時：古いPeerConnectionを全てクリーンアップしてから再参加
      if (ws.callCore) {
        ws.callCore.destroy();
        // CallCoreインスタンスは維持しつつ、socketを再バインド
        ws.callCore.connectSocket(ws.socket);
      }
      Object.keys(ws.peers).forEach(peerId => {
        const pc = ws.peers[peerId];
        if (pc) pc.close();
      });
      ws.peers = {};
      document.querySelectorAll('.remote-wrapper').forEach(el => el.remove());
      updateVideoGridLayout();
      if (ws.callCore) void ws.callCore.joinRoom({ roomId: ws.roomId, username });
      else ws.socket.emit('join-room', { roomId: ws.roomId, username });
      void syncClockWithServer();
      // サーバー録音も再送
      if (srvRecActive && srvRecMR && srvRecMR.state !== 'inactive') {
        srvRecLastValidChunkAt = Date.now();
        setRecordingHealthAlert({ username, source: 'client', active: false });
        ws.socket.emit('start-server-recording', {
          username,
          syncId: ws.syncId || null,
          startEpoch: srvRecStartEpoch,
          clockSyncOk: srvRecClockSync?.clockSyncOk,
          clockRttMs: srvRecClockSync?.clockRttMs,
          clockOffsetMs: srvRecClockSync?.clockOffsetMs,
        });
        console.log('[再接続] ルーム再参加 + サーバー録音再送:', ws.roomId);
      }
      showToast('接続が復旧しました', 'success');
    } else {
      $('label-call').textContent = '通話：接続OK';
    }
  });

  ws.socket.on('disconnect', () => {
    setDot('call', 'warn');
    $('label-call').textContent = ws.inCall ? '通話：切断（再接続中...）' : '通話：切断（再接続中）';
    if (ws.inCall) {
      if (ws.callCore) ws.callCore.destroy();
      Object.keys(ws.peers).forEach(peerId => {
        const pc = ws.peers[peerId];
        if (pc) pc.close();
      });
      ws.peers = {};
      document.querySelectorAll('.remote-wrapper').forEach(el => el.remove());
      updateVideoGridLayout();
    }
    if (Array.isArray(ws.socket?.sendBuffer)) {
      const staleSignals = new Set(['offer', 'answer', 'ice-candidate']);
      ws.socket.sendBuffer = ws.socket.sendBuffer.filter(packet => !staleSignals.has(packet?.data?.[0]));
    }
  });

  ws.socket.on('connect_error', () => {
    setDot('call', 'warn');
    $('label-call').textContent = '通話：接続エラー';
  });

  ws.socket.on('username-assigned', ({ username, originalUsername, transliterated, deduplicated }) => {
    ws.username = username;
    const input = $('username-input');
    if (input) input.value = username;
    saveUsername(username);
    const localLabel = $('local-video-label');
    if (localLabel) localLabel.textContent = `${username}（自分）`;
    if (deduplicated) {
      showToast(`同名の参加者がいるため「${username}」に変更しました`, 'info');
    } else if (transliterated) {
      showToast(`表示名「${originalUsername}」を「${username}」に変換しました`, 'success');
    }
  });

  ws.socket.on('username-invalid', ({ message }) => {
    if (ws.inCall) leaveCall();
    showToast(message || '表示名を確認してください', 'error');
    const input = $('username-input');
    if (input) input.focus();
  });

  ws.socket.on('server-recording-error', ({ message }) => {
    setDot('srv-rec', 'warn');
    $('label-srv-rec').textContent = '録音：開始できませんでした';
    setFooterStatus('srv', 'warn', '録音：開始できませんでした');
    showToast(message || 'サーバー録音を開始できませんでした', 'error');
  });

  // サーバー録音完了通知
  ws.socket.on('server-recording-saved', ({ filename, size, fallback }) => {
    const sizeStr = size ? ` (${(size / 1024 / 1024).toFixed(1)} MB)` : '';
    const label = fallback
      ? `⚠️ 録音（WebM）：${filename}${sizeStr}`
      : `✓ 録音完了：${filename}${sizeStr}`;
    const status = fallback ? 'warn' : 'done';
    const itemId = 'srv-' + filename;
    addConvertStatus(itemId, label, status);
    setDot('srv-rec', fallback ? 'warn' : 'ok');
    $('label-srv-rec').textContent = fallback ? '録音：WebMで保存' : '録音：保存完了';
    setFooterStatus('srv', fallback ? 'warn' : 'ok', $('label-srv-rec').textContent);
    showToast(fallback ? `録音をWebMで保存しました: ${filename}` : `録音を保存しました: ${filename}`, fallback ? 'warn' : 'success');
    console.log('[サーバー録音完了]', filename, sizeStr);
  });

  ws.socket.on('recording-health-alert', ({ username, reason, message, active }) => {
    setRecordingHealthAlert({
      username,
      reason: reason === 'recovered' ? 'no-audio' : (reason || 'no-audio'),
      source: 'server',
      message,
      active: active !== false && reason !== 'recovered',
    });
  });

  ws.socket.on('preflight-command', command => {
    preflightState.running = true;
    const button = $('btn-preflight');
    if (button) {
      button.disabled = true;
      button.textContent = '⌛ チェック中';
    }
    void runPreflightCheck(command);
  });

  ws.socket.on('preflight-result', result => {
    renderPreflightResult(result);
  });

  ws.socket.on('preflight-clear', () => {
    clearPreflightResult();
  });

  ws.socket.on('recording-discarded', ({ username }) => {
    setRecordingHealthAlert({
      username,
      reason: 'discarded',
      source: `discarded-${Date.now()}`,
      active: true,
    });
  });

  ws.socket.on('room-peers', async (peers) => {
    if (ws.callCore) return;
    for (const peerInfo of peers) {
      const peerId   = typeof peerInfo === 'string' ? peerInfo : peerInfo.peerId;
      const username = typeof peerInfo === 'string' ? '' : (peerInfo.username || '');
      if (peerId && username) peerUsernames[peerId] = username;
      if (peerId && !hasPeer(peerId)) {
        await createPeer(peerId, shouldInitiatePeer(peerId));
      }
    }
    updateParticipants();
  });

  ws.socket.on('peer-joined', async (data) => {
    if (ws.callCore) return;
    const peerId   = typeof data === 'string' ? data : data.peerId;
    const username = typeof data === 'string' ? '' : (data.username || '');
    if (peerId && username) peerUsernames[peerId] = username;
    if (peerId && !hasPeer(peerId)) {
      await createPeer(peerId, shouldInitiatePeer(peerId));
    }
    updateParticipants();
  });

  ws.socket.on('offer', async ({ from, offer }) => {
    if (ws.callCore) return;
    let pc = getPeer(from);
    if (!pc) pc = await createPeer(from, false);
    try {
      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      ws.socket.emit('answer', { to: from, answer });
    } catch (e) {
      console.error('[WebRTC] offer処理エラー:', e);
    }
  });

  ws.socket.on('answer', async ({ from, answer }) => {
    if (ws.callCore) return;
    const pc = getPeer(from);
    if (pc) {
      try {
        await pc.setRemoteDescription(new RTCSessionDescription(answer));
      } catch (e) {
        console.error('[WebRTC] answer処理エラー:', e);
      }
    }
  });

  ws.socket.on('ice-candidate', async ({ from, candidate }) => {
    if (ws.callCore) return;
    const pc = getPeer(from);
    if (pc && candidate) {
      try {
        await pc.addIceCandidate(new RTCIceCandidate(candidate));
      } catch (e) { /* 無視 */ }
    }
  });

  ws.socket.on('peer-left', (peerId) => {
    if (ws.callCore) return;
    delete peerUsernames[peerId];
    removePeer(peerId);
    typingPeers.delete(peerId);
    updateTypingIndicator();
    updateParticipants();
    showToast('参加者が退出しました', 'info');
  });

  // ===== エピソード同期 =====
  ws.socket.on('episodes-sync', (data) => {
    handleEpisodesSync(data);
    updateSyncBadge('synced');
  });

  // ===== ルーム参加時：現在選択中のEPに自動同期 =====
  // 既存参加者がいるルームに参加した場合のみサーバーから送信される
  ws.socket.on('room-state', (state) => {
    if (state.currentEpisodeId &&
        episodeState.episodes.some(e => e.id === state.currentEpisodeId)) {
      selectEpisode(state.currentEpisodeId);
    }
  });

  ws.socket.on('episode-updated', ({ id, content }) => {
    const ep = episodeState.episodes.find(e => e.id === id);
    if (ep) {
      ep.content = content;
      if (episodeState.activeId === id) {
        const ta = $('script-textarea');
        const hadFocus = ta === document.activeElement;
        const start = ta.selectionStart;
        const end = ta.selectionEnd;
        ta.value = content;
        if (hadFocus) ta.setSelectionRange(start, end);
        ta.classList.remove('remote-updated');
        void ta.offsetWidth;
        ta.classList.add('remote-updated');
        setTimeout(() => ta.classList.remove('remote-updated'), 800);
      }
    }
    updateSyncBadge('synced');
  });

  ws.socket.on('peer-typing', ({ peerId, isTyping }) => {
    if (isTyping) typingPeers.add(peerId);
    else typingPeers.delete(peerId);
    updateTypingIndicator();
  });

  ws.socket.on('episode-lock', ({ episodeId, holderId, holderName }) => {
    if (holderId === ws.socket.id) {
      myHeldLock = episodeId; delete lockedEpisodes[episodeId];
    } else {
      lockedEpisodes[episodeId] = holderName;
      if (myHeldLock === episodeId) myHeldLock = null;
    }
    applyLockUI();
  });
  ws.socket.on('episode-unlock', ({ episodeId }) => {
    delete lockedEpisodes[episodeId];
    if (myHeldLock === episodeId) myHeldLock = null;
    applyLockUI();
  });
  ws.socket.on('episode-lock-denied', ({ episodeId, holderName }) => {
    lockedEpisodes[episodeId] = holderName;
    if (myHeldLock === episodeId) myHeldLock = null;
    // 自分の未送信の編集を破棄してサーバー内容へ戻す
    if (episodeState.activeId === episodeId) {
      const ep = getActiveEpisode();
      if (ep) $('script-textarea').value = ep.content;
    }
    applyLockUI();
  });

  // ===== 接続品質RTT計測 =====
  ws.socket.on('client-pong', () => {
    if (!rttPingSentAt) return;
    const rtt = Date.now() - rttPingSentAt;
    rttPingSentAt = null;
    updateConnQuality(rtt);
  });

  // ===== 一斉録音開始コマンド受信 =====
  ws.socket.on('recording-start-command', ({ initiator, syncId, countdownEndEpoch, lateJoin = false }) => {
    clearPreflightResult();
    ws.syncId = syncId || null;
    if (isRecordingActive()) {
      // すでに録音中の場合は無視（途中参加者が個別に録音済みのケース）
      console.log('[一斉録音] すでに録音中のため無視');
      return;
    }
    // カウントダウン中も取りこぼさないよう、録音自体は待たずに開始する
    void startRecordingPair();
    showRecordingCountdown(countdownEndEpoch, { lateJoin });
    showToast(lateJoin
      ? '進行中の収録へ参加しました。3、2、1の合図で会話に参加してください。'
      : `「${initiator}」が一斉録音を開始しました。3、2、1の合図で本編を始めてください。`, 'info');
  });

  // 一斉停止コマンド受信
  ws.socket.on('recording-stop-command', () => {
    hideRecordingCountdown();
    if (isRecordingActive()) {
      showToast('録音を停止します...', 'info');
      stopRecording();
      stopServerRecording();
    }
    ws.syncId = null;
  });

  ws.socket.on('peer-recording-status', ({ peerId, username, isRecording }) => {
    const label = $(`label-${peerId}`);
    if (label) {
      label.textContent = isRecording ? `${username} ⏺` : username;
      label.style.background = isRecording
        ? 'rgba(239,68,68,0.75)'
        : (peerId === ws.socket?.id ? 'rgba(34,197,94,0.75)' : 'rgba(0,0,0,0.65)');
    }
  });
}

// ===== PeerConnection 作成 =====
async function createPeer(peerId, isInitiator) {
  const iceConfig = await getIceConfig();
  const pc = new RTCPeerConnection(iceConfig);

  if (ws.localStream) {
    ws.localStream.getTracks().forEach(track => {
      pc.addTrack(track, ws.localStream);
    });
  }
  setPeer(peerId, pc);

  pc.ontrack = (event) => {
    console.log(`[WebRTC] ${peerId} ontrack kind=${event.track?.kind || '?'} streams=${event.streams?.length || 0}`);
    addRemoteVideo(peerId, event.streams[0]);
    updateParticipants();
  };

  pc.onicecandidate = ({ candidate }) => {
    if (candidate && ws.socket) ws.socket.emit('ice-candidate', { to: peerId, candidate });
  };

  pc.onconnectionstatechange = () => {
    console.log(`[WebRTC] ${peerId} connectionState → ${pc.connectionState}`);
    if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
      console.warn(`[WebRTC] ${peerId} 接続不安定 → ICE再起動を試行`);
      try { pc.restartIce(); } catch(e) {}
    }
  };

  pc.oniceconnectionstatechange = () => {
    console.log(`[WebRTC] ${peerId} iceConnectionState → ${pc.iceConnectionState}`);
    if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
      // いったん短めに再試行し、その後も継続していたら再度ICEを起動
      setTimeout(() => {
        if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
          console.warn(`[WebRTC] ${peerId} ICE不安定継続 → 再起動`);
          try { pc.restartIce(); } catch(e) {}
        }
      }, 3000);
    }
  };

  if (isInitiator) {
    try {
      const offer = await pc.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: true });
      await pc.setLocalDescription(offer);
      ws.socket.emit('offer', { to: peerId, offer });
    } catch (e) {
      console.error('[WebRTC] offer作成エラー:', e);
    }
  }

  return pc;
}

function addRemoteVideo(peerId, stream) {
  const existing = $(`video-${peerId}`);
  if (existing) { existing.srcObject = stream; return; }

  const wrapper = document.createElement('div');
  wrapper.className = 'video-wrapper remote-wrapper';
  wrapper.id = `wrapper-${peerId}`;

  const video = document.createElement('video');
  video.id = `video-${peerId}`;
  video.autoplay = true;
  video.playsInline = true;
  video.muted = false;
  if (window.__mediaCore) {
    window.__mediaCore.attachRemote(video, stream).catch(err => {
      console.warn(`[WebRTC] ${peerId} remote video play失敗`, err);
      video.srcObject = stream;
    });
  } else {
    video.srcObject = stream;
    video.addEventListener('loadedmetadata', () => {
      video.play().catch(err => console.warn(`[WebRTC] ${peerId} remote video play失敗`, err));
    });
  }

  const label = document.createElement('div');
  label.className = 'video-label';
  label.id = `label-${peerId}`;
  label.textContent = peerUsernames[peerId] || `参加者 ${peerId.slice(0, 6)}`;

  const state = document.createElement('div');
  state.id = `peer-state-${peerId}`;
  state.style.fontSize = '0.72rem';
  state.style.color = 'var(--text-dim)';
  state.style.padding = '4px 2px 0';
  state.textContent = 'conn=new ice=new';

  wrapper.appendChild(video);
  wrapper.appendChild(label);
  wrapper.appendChild(state);
  $('video-grid').appendChild(wrapper);
  updateVideoGridLayout();
}

function updatePeerConnectionState(peerId, connectionState, iceConnectionState) {
  const stateEl = $(`peer-state-${peerId}`);
  if (!stateEl) return;
  stateEl.textContent = `conn=${connectionState} ice=${iceConnectionState}`;
}

window.addEventListener('resize', () => { if (ws && ws.inCall) updateVideoGridLayout(); });
function updateVideoGridLayout() {
  const grid = $('video-grid');
  const n = grid.querySelectorAll('.video-wrapper').length;
  // 人数に応じた列数（各画面をできるだけ大きく）
  // 1人=1列 / 2〜4人=2列 / 5〜6人=3列
  let cols;
  if (n <= 1) cols = 1;
  else if (n <= 4) cols = 2;
  else cols = 3;
  // 狭い画面ではタイルが小さくなりすぎないよう列数を抑える
  if (window.innerWidth < 640 && cols > 2) cols = 2;
  grid.classList.toggle('solo', n <= 1);
  if (n <= 1) {
    grid.style.gridTemplateColumns = ''; // CSSの.soloに任せる
    grid.style.maxWidth = '';
    grid.style.margin = '';
  } else {
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    grid.style.maxWidth = '';
    grid.style.margin = '';
  }
}

function removePeer(peerId) {
  const pc = getPeer(peerId);
  if (pc) { pc.close(); deletePeer(peerId); }
  const wrapper = $(`wrapper-${peerId}`);
  if (wrapper) wrapper.remove();
  updateVideoGridLayout();
}

function updateParticipants(participantCount = null) {
  const count = participantCount || peerCount() + 1;
  $('call-participants').textContent = `参加者：${count}人`;
  const userCount = $('script-user-count');
  if (ws.inCall) {
    userCount.style.display = 'inline';
    userCount.textContent = `${count}人が参加中`;
  }
}

function updateCallQuality(profile) {
  const quality = $('call-quality');
  if (!quality || !profile) return;
  const labels = {
    two: '高画質',
    group: '標準',
    six: '多人数',
  };
  quality.textContent = `通話品質：${labels[profile.id] || '自動'}（360p / ${profile.maxFramerate}fps）`;
}

// ===== 通話参加 =====
let preJoinScriptContent = '';
let preJoinActiveId = null;
let preJoinEpisodes = null;
let isFirstJoin = false; // 初回参加時のみサーバーのactiveIdを優先するフラグ

// ===== サーバー時刻同期（録音の自動位置合わせ用） =====
async function syncClockWithServer({ showWarning = false } = {}) {
  if (!ws.socket || !ws.socket.connected) {
    const failed = { clockSyncOk: false, clockRttMs: null, clockOffsetMs: ws.clockOffset || 0, syncedAt: Date.now() };
    ws.clockSyncState = failed;
    if (showWarning) {
      setRecordingHealthAlert({ username: getUserName(), reason: 'clock-sync', source: 'clock', active: true });
    }
    return failed;
  }
  const samples = (await Promise.all(Array.from({ length: 5 }, async () => {
    const t0 = Date.now();
    const resp = await new Promise((res) => {
      let done = false;
      ws.socket.emit('time-sync', {}, (r) => { if (!done) { done = true; res(r); } });
      setTimeout(() => { if (!done) { done = true; res(null); } }, 1000);
    });
    const t1 = Date.now();
    if (resp && typeof resp.server === 'number') {
      return { rtt: t1 - t0, offset: resp.server - (t0 + t1) / 2 };
    }
    return null;
  }))).filter(Boolean);
  if (samples.length) {
    samples.sort((a, b) => a.rtt - b.rtt);
    const best = samples[0];
    ws.clockOffset = best.offset;
    ws.clockSyncState = {
      clockSyncOk: best.rtt <= 500,
      clockRttMs: Math.round(best.rtt),
      clockOffsetMs: Math.round(best.offset),
      syncedAt: Date.now(),
    };
    console.log(`[時刻同期] サーバーとの時計差 ${Math.round(ws.clockOffset)}ms (rtt=${best.rtt}ms)`);
  } else {
    ws.clockSyncState = {
      clockSyncOk: false,
      clockRttMs: null,
      clockOffsetMs: Math.round(ws.clockOffset || 0),
      syncedAt: Date.now(),
    };
    console.warn('[時刻同期] 失敗（オフセット未更新のまま録音します）');
  }
  if (showWarning) {
    const bad = !ws.clockSyncState.clockSyncOk;
    const message = ws.clockSyncState.clockRttMs === null
      ? '⚠ サーバーとの時刻同期に失敗しました。録音は続行しますが、自動位置合わせは保証されません。'
      : `⚠ 時刻同期の応答が遅い状態です（RTT ${ws.clockSyncState.clockRttMs}ms）。録音は続行しますが、自動位置合わせは保証されません。`;
    setRecordingHealthAlert({ username: getUserName(), reason: 'clock-sync', source: 'clock', message, active: bad });
  }
  return { ...ws.clockSyncState };
}

// ===== 画面スリープ防止（Wake Lock: スマホ・タブレット対策） =====
let _wakeLock = null;
async function acquireWakeLock() {
  if (!('wakeLock' in navigator)) return false;
  try {
    if (_wakeLock && !_wakeLock.released) return true;
    _wakeLock = await navigator.wakeLock.request('screen');
    _wakeLock.addEventListener('release', () => { _wakeLock = null; });
    console.log('[WakeLock] 画面スリープ防止を有効化');
    return true;
  } catch (e) {
    console.warn('[WakeLock] 取得失敗:', e.message);
    return false;
  }
}
function releaseWakeLock() {
  try { if (_wakeLock) _wakeLock.release(); } catch {}
  _wakeLock = null;
}
// 画面復帰時に自動で再取得（スマホでタブ切替・通知パネル操作をした場合）
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !_wakeLock && ws.inCall) {
    acquireWakeLock();
  }
});

const preflightState = {
  running: false,
  latest: null,
};

function preflightMark(ok, pending = false) {
  if (pending) return '確認中';
  return ok ? 'OK' : 'NG';
}

function getPreflightFix(row) {
  if (row.pending) return '結果を待っています';
  const fixes = [];
  if (!row.micOk) fixes.push(row.audioStatus === 'digital-silence' ? 'マイクのミュートと入力元を確認' : 'マイクを選び直す');
  if (!row.serverReachOk) fixes.push('回線を確認し、もう一度チェック');
  if (!row.clockSyncOk) fixes.push('回線混雑を避けて再チェック');
  if (!row.wakeLockOk) fixes.push('画面をオンのままにする');
  if (row.inAppBrowser) fixes.push('SafariまたはChromeで開き直す');
  return fixes.length ? fixes.join(' / ') : '修正不要';
}

function renderPreflightResult(payload) {
  const panel = $('preflight-results');
  if (!panel || !payload) return;
  preflightState.latest = payload;
  preflightState.running = !payload.complete;
  const button = $('btn-preflight');
  if (button) {
    button.disabled = preflightState.running;
    button.textContent = preflightState.running ? '⌛ チェック中' : '🔍 収録前チェック';
  }

  panel.replaceChildren();
  const summary = document.createElement('div');
  const problemNames = (payload.participants || [])
    .filter(row => !row.pending && !row.ok)
    .map(row => `${row.username}: ${(row.problems || []).join('・')}`);
  if (!payload.complete) {
    summary.textContent = '収録前チェックを実行中です。参加者全員の結果を待っています。';
    summary.className = 'preflight-summary warn';
  } else if (payload.allOk) {
    summary.textContent = '全員の録音準備ができています。';
    summary.className = 'preflight-summary ok';
  } else {
    const diskProblem = payload.disk?.level !== 'ok' ? `サーバー: ${payload.disk?.message || '空き容量を確認'}` : null;
    summary.textContent = `確認が必要です: ${[...problemNames, diskProblem].filter(Boolean).join(' / ')}`;
    summary.className = 'preflight-summary warn';
  }
  panel.appendChild(summary);

  const wrap = document.createElement('div');
  wrap.className = 'preflight-table-wrap';
  const table = document.createElement('table');
  table.className = 'preflight-table';
  const head = document.createElement('thead');
  const headRow = document.createElement('tr');
  ['参加者', 'マイク', '時刻', 'サーバー到達', '画面維持', 'ブラウザ', '参加方法', '対応'].forEach(label => {
    const th = document.createElement('th');
    th.textContent = label;
    headRow.appendChild(th);
  });
  head.appendChild(headRow);
  table.appendChild(head);
  const body = document.createElement('tbody');
  for (const row of payload.participants || []) {
    const tr = document.createElement('tr');
    const cells = [
      row.username,
      `${preflightMark(row.micOk, row.pending)}${row.micLabel ? ` (${row.micLabel})` : ''}`,
      row.pending ? '確認中' : `${preflightMark(row.clockSyncOk)}${row.clockRttMs === null ? '' : ` (${row.clockRttMs}ms)`}`,
      preflightMark(row.serverReachOk, row.pending),
      preflightMark(row.wakeLockOk, row.pending),
      row.pending ? '確認中' : `${row.browser || '不明'}${row.inAppBrowser ? ' (アプリ内)' : ''}`,
      row.speakerMode ? 'スピーカー' : 'イヤホン',
      getPreflightFix(row),
    ];
    cells.forEach((value, index) => {
      const td = document.createElement('td');

      tr.appendChild(td);
    });

  table.appendChild(body);

  panel.appendChild(disk);

function getBrowserName() {
  const ua = navigator.userAgent || '';
  if (/Edg\//.test(ua)) return 'Edge';
  if (/Chrome\//.test(ua) && !/Edg\//.test(ua)) return 'Chrome';
  if (/Firefox\//.test(ua)) return 'Firefox';
  if (/Safari\//.test(ua) && !/Chrome\//.test(ua)) return 'Safari';
  return 'Other';
}

async function runPreflightCheck({ checkId, countdownEndEpoch }) {
  let recorder = null;
  let track = null;
  let error = null;
  const sendPromises = [];
  try {
    if (isRecordingActive()) throw new Error('録音中のためセルフチェックを実行できません');
    const waitMs = Math.max(0, Number(countdownEndEpoch) - (Date.now() + (ws.clockOffset || 0)));
    if (waitMs) await new Promise(resolve => setTimeout(resolve, waitMs));
    track = await ensureRecordingAudioReady();
    if (!track) throw new Error('共有マイクを取得できません');

    const stream = new MediaStream([track]);
    const mimeType = getBestMimeType();
    recorder = new MediaRecorder(stream, {
      mimeType: mimeType || undefined,
      audioBitsPerSecond: 128000,
    });
    let seq = 0;
    recorder.ondataavailable = event => {
      if (!event.data || event.data.size === 0 || !ws.socket) return;
      const pending = event.data.arrayBuffer().then(buf => {
        ws.socket.emit('audio-stream-chunk', { checkId, seq: ++seq, buf });
      });
      sendPromises.push(pending);
    };
    ws.socket.emit('start-server-recording', { preflight: true, checkId });
    const stopped = new Promise(resolve => recorder.addEventListener('stop', resolve, { once: true }));
    recorder.start(1000);
    await new Promise(resolve => setTimeout(resolve, 3000));
    if (recorder.state !== 'inactive') recorder.stop();
    await stopped;
    await Promise.all(sendPromises);
  } catch (err) {
    error = err;
    console.error('[収録前チェック]', err);
    try { if (recorder && recorder.state !== 'inactive') recorder.stop(); } catch {}
  }

  const clock = await syncClockWithServer({ showWarning: false });
  const wakeLockOk = await acquireWakeLock();
  ws.socket?.emit('preflight-report', {
    checkId,
    clockSyncOk: clock.clockSyncOk,
    clockRttMs: clock.clockRttMs,
    clockOffsetMs: clock.clockOffsetMs,
    wakeLockOk,
    browser: getBrowserName(),
    inAppBrowser: isInAppBrowser(),
    speakerMode: Boolean($('speaker-mode')?.checked),
    micLabel: $('mic-select')?.selectedOptions?.[0]?.textContent || track?.label || '不明',
    micTrackOk: Boolean(track && track.readyState === 'live' && !track.muted && !error),
    error: error?.message || null,
  });
}

async function joinCall() {
  const roomId = $('room-input').value.trim().toUpperCase();
  if (!roomId) { showToast('ルームIDを入力してください', 'error'); return; }

  const usernameInput = $('username-input');
  const username = usernameInput.value.normalize('NFKC').trim();
  if (!username) {
    showToast('表示名を入力してください', 'error');
    usernameInput.focus();
    return;
  }
  if (/[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/u.test(username)) {
    showToast('漢字は自動変換できません。ひらがな、カタカナ、または半角英数字で入力してください', 'error');
    usernameInput.focus();
    return;
  }

  let stream = null;
  try {
    $('btn-join-call').disabled = true;
    $('btn-join-call').textContent = '接続中...';
    $('username-input').classList.remove('needs-input');

    try {
      const { stream: audioStream } = await acquireRawAudioStream(48000);
      const sharedAudioTrack = audioStream.getAudioTracks()[0];
      if (!sharedAudioTrack) throw new Error('マイク音声を取得できませんでした');

      let videoTrack = null;
      try {
        const videoStream = await navigator.mediaDevices.getUserMedia({
        video: {
          width: { ideal: 640, max: 640 },
          height: { ideal: 360, max: 360 },
          frameRate: { ideal: 24, max: 24 },
          facingMode: 'user'
        }
      });
        videoTrack = videoStream.getVideoTracks()[0] || null;
      } catch (videoError) {
        console.warn('[WebRTC] カメラ取得失敗、音声のみで参加:', videoError);
        showToast('カメラが利用できないため音声のみで参加します', 'info');
      }

      stream = new MediaStream([videoTrack, sharedAudioTrack].filter(Boolean));
    } catch (mediaError) {
      throw new Error(`マイクへのアクセスに失敗しました: ${mediaError.message}`);
    }

    ws.localStream = stream;
    attachMicWatchdog(stream.getAudioTracks()[0]);
    if (window.__mediaCore) window.__mediaCore.setLocalStream(stream);
    ws.roomId = roomId;
    ws.username = username;
    ws.inCall = true;
    acquireWakeLock();
    ensureCallCore();

    const localLabel = $('local-video-label');
    if (localLabel) localLabel.textContent = username + '（自分）';

    const localVid = $('local-video');
    localVid.srcObject = stream;
    try {
      // ローカルプレビューのplay()は最大2秒で打ち切り（一部端末/自動再生ポリシーでplay()が解決せず参加処理がハングするのを防止）
      const _attach = window.__mediaCore ? window.__mediaCore.attachLocal(localVid, stream) : localVid.play();
      await Promise.race([Promise.resolve(_attach), new Promise(res => setTimeout(res, 2000))]);
    } catch (e) {
      console.warn('[WebRTC] local preview play失敗', e);
    }

    if (!stream.getVideoTracks().length) {
      $('local-wrapper').innerHTML = `
        <div class="video-placeholder">
          <div class="avatar">🎙️</div>
          <span>${username}</span>
        </div>
        <div class="video-label" id="local-video-label">${username}（自分）</div>
      `;
    }

    // テキストエリアの実際の表示内容を優先してバックアップ（curEp.contentと一致しない場合を考慮）
    const curEp = getActiveEpisode();
    const taValue = $('script-textarea').value;
    preJoinScriptContent = taValue || (curEp ? curEp.content : '');
    // 通話参加前のエピソード状態を保存（通話参加後もローカル選択を維持するため）
    preJoinActiveId = episodeState.activeId;
    preJoinEpisodes = JSON.parse(JSON.stringify(episodeState.episodes));
    isFirstJoin = true; // 初回参加フラグを立てる

    if (ws.callCore) {
      ws.socket = ws.callCore.connectSocket(ws.socket);
      await ws.callCore.joinRoom({ roomId, username });
    } else {
      ws.socket.emit('join-room', { roomId, username });
    }
    void syncClockWithServer();

    const url = new URL(window.location.href);
    url.searchParams.set('room', roomId);
    history.pushState({}, '', url);
    // 招待URLには openExternalBrowser=1 を付与（LINEのアプリ内ブラウザを回避し外部ブラウザで開かせる公式パラメータ）
    const inviteUrl = new URL(url);
    inviteUrl.searchParams.set('openExternalBrowser', '1');
    $('invite-url-text').textContent = inviteUrl.toString();
    $('call-room-label').textContent = `ルームID: ${roomId}`;

    $('call-setup').style.display = 'none';
    $('call-active').style.display = 'block';
    setDot('call', 'call-active');
    $('label-call').textContent = `通話中：${roomId}`;
    updateParticipants();
    showToast(`ルーム「${roomId}」に参加しました`, 'success');
    updateVideoGridLayout(); // 参加直後にレイアウト(1人=solo)を適用
    startRTTMonitoring();

  } catch (err) {
    if (ws.callCore) {
      ws.callCore.destroy();
      ws.callCore = null;
    }
    Object.keys(ws.peers).forEach(removePeer);
    ws.peers = {};
    if (ws.socket && ws.roomId) ws.socket.emit('leave-room');
    stream?.getVideoTracks().forEach(track => track.stop());
    ws.localStream = null;
    ws.inCall = false;
    if (window.__mediaCore) window.__mediaCore.localStream = null;
    ws.roomId = null;
    ws.username = null;
    releaseWakeLock();
    $('btn-join-call').disabled = false;
    $('btn-join-call').textContent = '📹 通話に参加';
    showToast(`エラー: ${err.message}`, 'error');
  }
}

// ===== 通話終了 =====
function leaveCall() {
  const wasRecording = isRecordingActive();
  stopServerRecording();
  if (state.isRecording) stopRecording();
  if (wasRecording) showToast('通話終了にともない録音を停止しました。変換中...', 'info');

  if (ws.callCore) {
    ws.callCore.destroy();
    ws.callCore = null;
  }
  Object.keys(ws.peers).forEach(removePeer);
  ws.peers = {};

  stopVUMeter();
  if (ws.localStream) ws.localStream.getVideoTracks().forEach(t => t.stop());
  ws.localStream = null;
  releaseSharedAudioCapture();
  if (window.__mediaCore) window.__mediaCore.localStream = null;

  document.querySelectorAll('.remote-wrapper').forEach(el => el.remove());
  $('local-wrapper').innerHTML = `
    <video id="local-video" autoplay muted playsinline></video>
    <div class="video-label" id="local-video-label">自分</div>
  `;

  if (ws.socket) ws.socket.emit('leave-room');
  ws.roomId = null;
  ws.username = null;
  ws.inCall = false;
  releaseWakeLock();
  ws.audioMuted = false;
  ws.videoMuted = false;

  const url = new URL(window.location.href);
  url.searchParams.delete('room');
  history.pushState({}, '', url);

  $('call-setup').style.display = 'block';
  $('call-active').style.display = 'none';
  $('btn-join-call').disabled = false;
  $('btn-join-call').textContent = '📹 通話に参加';
  $('btn-mute-audio').textContent = '🎙️ ミュート';
  $('btn-mute-audio').classList.remove('muted');
  $('btn-mute-video').textContent = '📹 カメラOFF';
  $('btn-mute-video').classList.remove('muted');
  $('call-quality').textContent = '通話品質：高画質（360p / 24fps）';

  setDot('call', 'ok');
  $('label-call').textContent = '通話：接続OK';
  setDot('srv-rec', '');
  $('label-srv-rec').textContent = '録音：待機中';
  setFooterStatus('srv', '', '録音：待機中');
  stopRTTMonitoring();
  showToast('通話を終了しました。録音をFLAC変換中...', 'info');
  updateSyncBadge('offline');

  if (ws.socket) ws.socket.emit('script-typing', false);
  clearTimeout(typingStopTimer);
  typingPeers.clear();
  updateTypingIndicator();
  $('script-user-count').style.display = 'none';

  loadLocalEpisodes();
}

function findAudioSender(pc) {
  const transceiver = pc.getTransceivers?.().find(item =>
    item.sender && (item.sender.track?.kind === 'audio' || item.receiver?.track?.kind === 'audio')
  );
  return transceiver?.sender || pc.getSenders().find(sender => sender.track?.kind === 'audio') || null;
}

function getActivePeerConnections() {
  return ws.callCore ? ws.callCore.peers.values() : Object.values(ws.peers);
}

async function applyCallAudioMuteState() {
  if (!ws.localStream) return;
  const audioTrack = ws.localStream.getAudioTracks()[0] || null;
  for (const pc of getActivePeerConnections()) {
    const sender = findAudioSender(pc);
    if (sender) await sender.replaceTrack(ws.audioMuted ? null : audioTrack).catch(() => {});
  }
}

async function toggleAudio() {
  if (!ws.localStream) return;
  ws.audioMuted = !ws.audioMuted;
  await applyCallAudioMuteState();
  const btn = $('btn-mute-audio');
  btn.textContent = ws.audioMuted ? '🔇 ミュート中' : '🎙️ ミュート';
  btn.classList.toggle('muted', ws.audioMuted);
}

function toggleVideo() {
  if (!ws.localStream) return;
  ws.videoMuted = !ws.videoMuted;
  ws.localStream.getVideoTracks().forEach(t => { t.enabled = !ws.videoMuted; });
  const btn = $('btn-mute-video');
  btn.textContent = ws.videoMuted ? '📵 カメラ停止中' : '📹 カメラOFF';
  btn.classList.toggle('muted', ws.videoMuted);
}

function generateRoomId() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({ length: 6 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
}

function loadRoomFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const room = params.get('room');
  if (room) {
    $('room-input').value = room.toUpperCase();
    setTimeout(() => {
      showToast(`ルーム「${room}」の招待URLです。参加ボタンを押してください`, 'info');

  } else {
    $('room-input').value = generateRoomId();
  }
}

async function preloadRoomEpisodes(roomId) {
  try {
    const res = await fetch(`/api/episodes/${encodeURIComponent(roomId)}`);
    if (!res.ok) return; // エピソードなし or エラー → 何もしない
    const data = await res.json();
    const episodes = data.list || data.episodes || (Array.isArray(data) ? data : null);
    if (!episodes || episodes.length === 0) return;
    const hasContent = episodes.some(e => e.content && e.content.trim().length > 0);
    if (!hasContent) return;

    // ローカルエピソードをサーバーのもので上書きして表示
    episodeState.episodes = episodes;
    episodeState.activeId = data.activeId || episodes[0].id;
    renderEpisodeTabs();
    renderActiveEpisode();
    showToast(`ルーム「${roomId}」の台本を読み込みました`, 'success');
  } catch (e) {
    // ネットワークエラーなどは無視
  }
}

// 一斉録音開始ボタン
$('btn-rec-all').addEventListener('click', () => {
  if (!ws.inCall || !ws.socket) return;
  if (isRecordingActive()) {
    if (!confirm('参加中の全員の録音を停止します。よろしいですか？')) return;
    ws.socket.emit('recording-stop-all');
    return;
  }
  const latest = preflightState.latest;
  const stale = latest?.roomId !== ws.roomId
    || !latest?.completedAt
    || (Date.now() + (ws.clockOffset || 0)) - Number(latest.completedAt) > 10 * 60 * 1000;
  const needsCheck = stale || !latest?.allOk;
  let confirmedWithoutCheck = false;
  if (needsCheck) {
    const reason = !latest?.completedAt
      ? 'まだ収録前チェックを実行していません。'
      : (stale ? '収録前チェックから10分以上経過しています。' : '前回の収録前チェックに問題があります。');
    if (confirm(`${reason}\n\n今すぐ収録前チェックを実行しますか？`)) {
      ws.socket.emit('preflight-start');
      return;
    }
    if (!confirm('チェックせずに録音を開始します。本当に続行しますか？')) return;
    confirmedWithoutCheck = true;
  }
  if (!confirmedWithoutCheck && !confirm('参加中の全員の録音を今すぐ開始します。よろしいですか？')) return;
  ws.socket.emit('recording-start-all');
});

let srvRecMR = null;

let srvRecStreamShared = false; // サーバー録音が共有トラックを使用中か
let srvRecRequestDataTimer = null;
let srvRecHealthTimer = null;
let srvRecLastValidChunkAt = 0;
let srvRecClockSync = null;
let srvRecStartEpoch = null;
const RECORDING_STALL_MS = 45000;
const RECORDING_HEALTH_INTERVAL_MS = 10000;

function clearServerRecordingClientHealthTimers() {
  clearTimeout(srvRecRequestDataTimer);
  clearInterval(srvRecHealthTimer);
  srvRecRequestDataTimer = null;
  srvRecHealthTimer = null;
}

async function startServerRecording(username, clockSync = null) {
  if (srvRecActive || srvRecStarting) return false;
  srvRecStarting = true;
  try {
    const freshClock = clockSync || await syncClockWithServer({ showWarning: true });
    srvRecClockSync = { ...freshClock };
    const audioTrack = await ensureRecordingAudioReady();
    srvRecStream = new MediaStream([audioTrack]);
    srvRecStreamShared = true;

    const mimeType = getBestMimeType();
    srvRecMR = new MediaRecorder(srvRecStream, {
      mimeType: mimeType || undefined,
      audioBitsPerSecond: 128000, // 128kbps（サーバー録音が本命のため高音質化）
    });

    let srvChunkSeq = 0; // チャンクシーケンス番号（欠損検知用）
    srvBufferFullCount = 0;
    srvRecLastValidChunkAt = Date.now();
    srvRecMR.onstart = () => {
      srvRecStartEpoch = Date.now() + (ws.clockOffset || 0);
      ws.socket.emit('start-server-recording', {
        username,
        syncId: ws.syncId || null,
        startEpoch: srvRecStartEpoch,
        clockSyncOk: srvRecClockSync.clockSyncOk,
        clockRttMs: srvRecClockSync.clockRttMs,
        clockOffsetMs: srvRecClockSync.clockOffsetMs,
      });
    };

    srvRecMR.ondataavailable = async (e) => {
      if (e.data && e.data.size > 0 && ws.socket) {
        if (e.data.size > 1024) {
          srvRecLastValidChunkAt = Date.now();
          setRecordingHealthAlert({ username, source: 'client', active: false });
        }
        try {
          const buf = await e.data.arrayBuffer();
          const seq = ++srvChunkSeq;
          // バッファ監視：200KB超えたらvolatileで破棄（メモリ保護・輻輳防止）
          const bufSize = ws.socket.io?.engine?.transport?.socket?.bufferedAmount ?? 0;
          const isBufferFull = bufSize > 200 * 1024;
          if (isBufferFull) {
            srvBufferFullCount++;
            console.warn(`[サーバー録音] バッファ詰まり (${(bufSize/1024).toFixed(0)}KB) → チャンク#${seq}を破棄 (連続${srvBufferFullCount}回)`);
            ws.socket.volatile.emit('audio-stream-chunk', { seq, buf });
            // 3回連続詰まり → ユーザーに警告
            if (srvBufferFullCount >= 3) {
              showToast('⚠️ 回線が混雑しています。録音の一部が欠損する可能性があります', 'error');
              srvBufferFullCount = 0;
            }
          } else {
            srvBufferFullCount = 0; // 正常送信できたらリセット
            ws.socket.emit('audio-stream-chunk', { seq, buf });
          }
          console.log(`[サーバー録音] チャンク#${seq} 送信 (${(buf.byteLength / 1024).toFixed(0)} KB) buf=${(bufSize/1024).toFixed(0)}KB`);
        } catch (err) {
          console.warn('[サーバー録音] チャンク送信エラー:', err);
        }
      }
    };

    srvRecMR.start(20000); // 20秒チャンク（送信頻度を下げて輻輳リスクを軽減）
    srvRecActive = true;
    clearServerRecordingClientHealthTimers();
    srvRecRequestDataTimer = setTimeout(() => {
      if (srvRecActive && srvRecMR?.state === 'recording') {
        try { srvRecMR.requestData(); } catch {}
      }
    }, 5000);
    srvRecHealthTimer = setInterval(() => {
      if (!srvRecActive) return;
      if (!ws.socket?.connected) {
        setRecordingHealthAlert({ username, source: 'client', active: false });
        return;
      }
      const stalledMs = Date.now() - srvRecLastValidChunkAt;
      if (stalledMs > RECORDING_STALL_MS) {
        console.error(`[録音異常] ${Math.floor(stalledMs / 1000)}秒間、有効な音声チャンクを確認できません`);
        setRecordingHealthAlert({ username, source: 'client', active: true });
      }
    }, RECORDING_HEALTH_INTERVAL_MS);
    if (!LOCAL_RECORDING_ENABLED) { setRecordingUI(true); startTimer(); } // 録音UIはサーバー録音基準

    setDot('srv-rec', 'srv-rec');
    $('label-srv-rec').textContent = `録音中：${username}`;
    setFooterStatus('srv', 'srv-rec', `録音中`);

    console.log('[サーバー録音] 開始:', username);
    return true;
  } catch (err) {
    console.error('[サーバー録音] 開始エラー:', err);
    showToast(`録音エラー: ${err.message}`, 'error');
    return false;
  } finally {
    srvRecStarting = false;
  }
}

let recordingPairStartPromise = null;
async function startRecordingPair() {
  if (isRecordingActive()) return false;
  if (recordingPairStartPromise) return recordingPairStartPromise;
  recordingPairStartPromise = (async () => {
    const freshClock = await syncClockWithServer({ showWarning: true });
    const [localStarted, serverStarted] = await Promise.all([
      LOCAL_RECORDING_ENABLED ? startRecording(freshClock) : true,
      startServerRecording(getUserName(), freshClock),
    ]);
    return Boolean(localStarted && serverStarted);
  })().finally(() => { recordingPairStartPromise = null; });
  return recordingPairStartPromise;
}

function stopServerRecording() {
  if (!srvRecActive) return;
  srvRecActive = false;
  clearServerRecordingClientHealthTimers();
  setRecordingHealthAlert({ username: getUserName(), source: 'client', active: false });
  if (!LOCAL_RECORDING_ENABLED) { setRecordingUI(false); clearInterval(state.timerInterval); }

  if (srvRecMR && srvRecMR.state !== 'inactive') {
    srvRecMR.stop();
  }
  if (srvRecStream) {
    if (!srvRecStreamShared) srvRecStream.getTracks().forEach(t => t.stop());
    srvRecStream = null;
  }
  if (ws.socket) ws.socket.emit('stop-server-recording');
  srvRecMR = null;

  setDot('srv-rec', 'converting');
  $('label-srv-rec').textContent = '録音：変換中...';
  setFooterStatus('srv', 'converting', '録音：変換中...');

  console.log('[サーバー録音] 停止・サーバーへ保存指示（完了通知待ち）');
  // 完了はサーバーから 'server-recording-saved' イベントで通知される
}
