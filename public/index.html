<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SureCast -SEAMLESS REMOTE RECORDING-</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #222222;
      --border: #2a2a2a;
      --accent: #d97706;
      --accent-hover: #f59e0b;
      --red: #ef4444;
      --red-dark: #dc2626;
      --green: #22c55e;
      --yellow: #f59e0b;
      --teal: #22c55e;
      --text: #f5f5f5;
      --text-dim: #a0a0a0;
      --radius: 12px;
    }

    body {
      font-family: 'Hiragino Sans', 'Meiryo', 'Yu Gothic', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== ヘッダー ===== */
    header {
      background: #0f0f0f;
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .header-logo { height: 44px; width: auto; display: block; }
    header .header-link {
      margin-left: auto;
      font-size: 0.82rem;
      color: var(--accent);
      text-decoration: none;
      padding: 6px 12px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      transition: background 0.15s;
      white-space: nowrap;
    }
    header .header-link:hover { background: rgba(217,119,6,0.15); }

    /* ===== ステータスバー ===== */
    #status-bar {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      padding: 6px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 0.80rem;
      flex-shrink: 0;
    }
    .status-item { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    /* ステータスバー内のコンパクトマイク選択 */
    .status-mic-select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      padding: 1px 4px;
      font-size: 0.74rem;
      font-family: inherit;
      outline: none;
      width: auto;
      max-width: 160px;
      cursor: pointer;
      height: 20px;
    }
    .status-mic-select:focus { border-color: var(--accent); }
    /* ステータスバー内のdB表示（非表示） */
    .status-db {
      display: none;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
    }
    .dot.active      { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
    .dot.ok          { background: var(--green);  animation: none; }
    .dot.warn        { background: var(--yellow); animation: none; }
    .dot.converting  { background: var(--teal);   animation: pulse 0.6s ease-in-out infinite; }
    .dot.call-active { background: var(--teal);   animation: pulse 1s ease-in-out infinite; }
    .dot.srv-rec     { background: var(--red);    animation: pulse 0.8s ease-in-out infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.85); }
    }

    /* ===== 2カラム メインレイアウト ===== */
    main {
      flex: 1;
      padding: 16px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
      align-items: start;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    #left-col { display: flex; flex-direction: column; gap: 8px; }
    #right-col { position: sticky; top: 16px; }

    /* ===== カード ===== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }
    .card-title {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ===== ボタン共通 ===== */
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      padding: 11px 16px;
      border: none;
      border-radius: var(--radius);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-record { background: var(--accent); color: #000; }
    .btn-record:not(:disabled):hover { background: var(--accent-hover); }
    .btn-stop   { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-stop:not(:disabled):hover { background: var(--border); }
    .btn-teal   { background: var(--accent); color: #000; font-weight: 800; width: 100%; padding: 13px; font-size: 0.95rem; }
    .btn-teal:not(:disabled):hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-ghost  { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:not(:disabled):hover { background: var(--border); }
    .btn-danger { background: rgba(255,68,68,0.15); color: var(--red); border: 1px solid var(--red); }
    .btn-danger:not(:disabled):hover { background: rgba(255,68,68,0.25); }
    .btn.muted  { opacity: 0.55; }

    /* ===== フォーム ===== */
    .form-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    label { font-size: 0.80rem; color: var(--text-dim); }
    select, input[type="text"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 9px 12px;
      font-size: 0.88rem;
      font-family: inherit;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }
    select:focus, input[type="text"]:focus { border-color: var(--accent); }
    select { cursor: pointer; }
    select option { background: var(--surface2); }
    input[type="text"]::placeholder { color: var(--text-dim); }

    .room-input-row { display: flex; gap: 8px; align-items: stretch; }
    .room-input-row input {
      flex: 1;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .room-input-row .btn-ghost {
      flex: 0 0 auto;
      padding: 9px 12px;
      font-size: 0.80rem;
    }

    /* ===== ビデオグリッド ===== */
    #video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      grid-auto-rows: 220px;
      gap: 8px;
      margin-bottom: 10px;
      max-height: 320px;
      overflow: hidden;
    }
    /* 1人参加時：Discord風の横長表示 */
    #video-grid:has(.video-wrapper:only-child) {
      grid-template-columns: 1fr;
      grid-auto-rows: auto;
      max-width: 560px;
      margin: 0 auto;
    }
    #video-grid .video-wrapper:only-child {
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 320px;
    }
    #video-grid .video-wrapper:only-child video {
      object-fit: cover;
    }
    .video-wrapper {
      position: relative; background: #000;
      border-radius: 10px; overflow: hidden;
      border: 2px solid var(--border);
    }
    .video-wrapper.local-wrapper  { border-color: var(--teal); }
    .video-wrapper.remote-wrapper { border-color: var(--border); }
    .video-wrapper video { width: 100%; height: 100%; object-fit: contain; display: block; }
    .local-wrapper video { transform: scaleX(-1); }
    .video-label {
      position: absolute; bottom: 6px; left: 6px;
      background: rgba(0,0,0,0.65); color: #fff;
      padding: 2px 8px; border-radius: 20px;
      font-size: 0.70rem; font-weight: 700; pointer-events: none;
    }
    .local-wrapper .video-label { background: rgba(34,197,94,0.75); }
    .video-placeholder {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 6px; color: var(--text-dim); font-size: 0.80rem;
      background: var(--surface2);
    }
    .video-placeholder .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--border);
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
    }

    /* ===== 招待バー + コントロール 1行レイアウト ===== */
    #call-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    #invite-bar {
      flex: 1;
      min-width: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #invite-bar .invite-label { font-size: 0.74rem; color: var(--text-dim); flex-shrink: 0; }
    #invite-url-text { flex: 1; font-size: 0.76rem; color: var(--teal); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; font-weight: 600; }
    #btn-copy-url {
      flex-shrink: 0;
      background: var(--accent); color: #000;
      border: none; border-radius: 6px;
      padding: 4px 8px; font-size: 0.74rem; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: background 0.15s; white-space: nowrap;
    }
    #btn-copy-url:hover { background: var(--accent-hover); }

    /* ===== 通話メタ ===== */
    #call-meta {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.80rem; margin-bottom: 10px;
    }
    #call-participants { font-weight: 700; color: var(--teal); }

    /* ===== 通話コントロール行 ===== */
    #call-controls {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      align-items: center;
      flex-shrink: 0;
    }
    #call-controls .btn { padding: 7px 10px; font-size: 0.78rem; }

    /* ===== VUメーター ===== */
    .vu-container {
      padding: 6px 10px;
      background: #111;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 0;
    }
    .vu-label {
      font-size: 0.74rem;
      color: var(--text-dim);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .vu-label .vu-db { font-variant-numeric: tabular-nums; font-weight: 600; }
    .vu-bar-wrap {
      height: 8px;
      background: #1a1a1a;
      border-radius: 4px;
      overflow: hidden;
    }
    .vu-bar {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      transition: width 0.06s linear;
      background: linear-gradient(
        to right,
        #15803d 0%, #15803d 80%,
        #22c55e 80%, #22c55e 90%,
        #f59e0b 90%, #f59e0b 97%,
        #ef4444 97%, #ef4444 100%
      );
    }
    #vu-message {
      margin-top: 4px;
      font-size: 0.74rem;
      min-height: 0;
      font-weight: 600;
      line-height: 1.3;
    }

    /* ===== 録音タイマー ===== */
    #rec-timer-inline {
      font-size: 1.05rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      min-width: 48px;
      display: none;
    }

    /* ===== 変換ステータス ===== */
    #convert-status-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .convert-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.82rem;
    }
    .convert-item.converting { border-color: var(--accent); }
    .convert-item.done       { border-color: var(--green); }
    .convert-item.error      { border-color: var(--red); }
    .convert-icon { font-size: 1rem; flex-shrink: 0; }
    .convert-text { flex: 1; min-width: 0; }
    .convert-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .convert-sub { font-size: 0.72rem; color: var(--text-dim); margin-top: 1px; }

    /* ===== クラッシュリカバリーバナー ===== */
    #recovery-banner {
      display: none;
      background: #1a1200;
      border-bottom: 2px solid var(--accent);
      padding: 12px 24px;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 0.86rem;
      flex-shrink: 0;
    }
    #recovery-banner.visible { display: flex; }
    #recovery-banner .recovery-msg { flex: 1; color: var(--accent); font-weight: 600; }
    #recovery-banner .recovery-sub { font-size: 0.76rem; color: var(--text-dim); margin-top: 2px; }
    #recovery-banner .btn-recovery-dl {
      background: var(--accent); color: #000; border: none; border-radius: 6px;
      padding: 6px 14px; font-size: 0.80rem; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    #recovery-banner .btn-recovery-del {
      background: transparent; color: var(--text-dim); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 12px; font-size: 0.80rem; cursor: pointer; white-space: nowrap;
    }
    #recovery-banner .btn-recovery-del:hover { color: var(--red); border-color: var(--red); }

    /* ===== トースト ===== */
    #toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 18px;
      font-size: 0.86rem; font-weight: 600;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1000; white-space: nowrap; max-width: 90vw; text-align: center;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.success { border-color: var(--green); color: var(--green); }
    #toast.error   { border-color: var(--red);   color: var(--red);   }
    #toast.info    { border-color: var(--accent); color: var(--accent); }

    /* ===== 台本エリア ===== */
    #episode-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    #episode-tabs { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; }
    .ep-tab {
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-dim);
      font-size: 0.80rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      white-space: nowrap;
    }
    .ep-tab:hover { border-color: var(--accent); color: var(--text); }
    .ep-tab.active { background: var(--accent); border-color: var(--accent); color: #000; }
    #btn-ep-add {
      padding: 5px 10px;
      border-radius: 20px;
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--text-dim);
      font-size: 0.80rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      white-space: nowrap;
    }
    #btn-ep-add:hover { border-color: var(--accent); color: var(--accent); }
    #episode-actions { display: flex; gap: 5px; flex-shrink: 0; }
    .ep-action-btn {
      padding: 4px 9px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-dim);
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      white-space: nowrap;
    }
    .ep-action-btn:hover { color: var(--text); background: var(--border); }
    .ep-action-btn.danger:hover { border-color: var(--red); color: var(--red); background: rgba(255,68,68,0.1); }

    #script-textarea {
      width: 100%;
      min-height: 380px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 12px;
      font-size: 0.90rem;
      font-family: 'Hiragino Sans', 'Meiryo', 'Yu Gothic', sans-serif;
      line-height: 1.8;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }
    #script-textarea:focus { border-color: var(--accent); }
    #script-textarea::placeholder { color: var(--text-dim); opacity: 0.7; }

    .sync-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.72rem; padding: 2px 8px; border-radius: 999px;
      font-weight: 600;
    }
    .sync-badge.offline { background: rgba(136,136,153,0.15); color: var(--text-dim); }
    .sync-badge.syncing { background: rgba(255,170,0,0.15);   color: var(--yellow); }
    .sync-badge.synced  { background: rgba(34,204,102,0.15);  color: var(--green);  }

    #script-user-count { font-size: 0.72rem; color: var(--teal); }

    #script-typing-indicator {
      min-height: 18px; margin-top: 6px;
      font-size: 0.76rem; color: var(--text-dim);
      display: flex; align-items: center; gap: 5px;
    }
    .typing-dots { display: inline-flex; gap: 3px; }
    .typing-dots span {
      width: 4px; height: 4px; border-radius: 50%;
      background: var(--accent); animation: typing-bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30%            { transform: translateY(-4px); opacity: 1; }
    }
    @keyframes script-flash {
      0%   { background: rgba(217,119,6,0.12); border-color: var(--accent); }
      100% { background: var(--surface2);      border-color: var(--border); }
    }
    #script-textarea.remote-updated { animation: script-flash 0.8s ease-out; }

    /* audio-panelをコンパクトに */
    #audio-panel { padding: 12px 16px; }

    /* ===== 録音中の視覚フィードバック ===== */
    #left-col.recording #audio-panel {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    /* ===== レスポンシブ ===== */
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      #right-col { position: static; }
    }
    @media (max-width: 768px) {
      header { padding: 10px 16px; }
      .header-logo { height: 36px; }
      #status-bar { padding: 6px 16px; gap: 14px; }
    }
    @media (max-width: 600px) {
      main { padding: 10px; gap: 10px; }
      .card { padding: 14px; }
      #video-grid { grid-template-columns: 1fr 1fr; }
      #call-controls { gap: 6px; }
      #call-controls .btn { padding: 8px 10px; font-size: 0.78rem; }
    }
  </style>
</head>
<body>

<header>
  <img src="/images/surecast-logo-2-white.png" alt="SureCast" class="header-logo">
  <a href="/recordings.html" class="header-link">☁ 録音ファイル一覧</a>
</header>

<div id="recovery-banner">
  <div>
    <div class="recovery-msg">⚠️ 前回の録音が復元できます。FLACに変換・保存しますか？</div>
    <div class="recovery-sub" id="recovery-sub"></div>
  </div>
  <button class="btn-recovery-dl" id="btn-recovery-dl">🔄 変換・保存</button>
  <button class="btn-recovery-del" id="btn-recovery-del">🗑 削除</button>
</div>

<div id="status-bar">
  <div class="status-item">
    <div class="dot" id="dot-mic"></div>
    <span id="label-mic">マイク：未接続</span>
    <select id="mic-select" class="status-mic-select">
      <option value="">（検出中...）</option>
    </select>
    <span class="status-db" id="vu-db-label">— dB</span>
  </div>
  <div class="status-item">
    <div class="dot" id="dot-local-rec"></div>
    <span id="label-local-rec">ローカル録音：停止中</span>
  </div>
  <div class="status-item">
    <div class="dot" id="dot-srv-rec"></div>
    <span id="label-srv-rec">サーバー録音：待機中</span>
  </div>
  <div class="status-item">
    <div class="dot" id="dot-call"></div>
    <span id="label-call">通話：未接続</span>
  </div>
  <div class="status-item">
    <div class="dot" id="dot-conn"></div>
    <span id="label-conn">接続品質：－</span>
  </div>
</div>

<main>

  <!-- ===== 左カラム ===== -->
  <div id="left-col">

    <!-- 通話前セットアップ -->
    <div class="card" id="call-setup">
      <div class="form-row">
        <label for="username-input">ユーザー名（録音ファイル名・参加者表示に使用）</label>
        <input type="text" id="username-input" placeholder="例：Taro（未入力の場合はランダム）" maxlength="20">
      </div>
      <div class="form-row">
        <label>ルームID（英数字・自動生成）</label>
        <div class="room-input-row">
          <input type="text" id="room-input" placeholder="例：ABC123" maxlength="12">
          <button class="btn btn-ghost" id="btn-random-room">ランダム</button>
        </div>
      </div>
      <button class="btn btn-teal" id="btn-join-call">📹 通話に参加</button>
    </div>

    <!-- 通話中エリア（参加後に表示） -->
    <div class="card" id="call-active" style="display:none">
      <div id="call-meta">
        <span id="call-participants">参加者：自分のみ</span>

<div id="toast"></div>

<!-- Socket.io クライアント -->
<script src="/socket.io/socket.io.js"></script>

<script>
// ===== DOM ヘルパー =====
const $ = id => document.getElementById(id);

// ===== 共通 UI ヘルパー =====
function setDot(id, cls) {
  const dot = $(`dot-${id}`);
  if (dot) dot.className = 'dot' + (cls ? ` ${cls}` : '');
}

let toastTimer;
function showToast(msg, type = 'info') {
  const toast = $('toast');
  toast.textContent = msg;
  toast.className = `show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.className = ''; }, 3200);
}

// ===== フォーマット =====
function pad(n) { return String(n).padStart(2, '0'); }
function formatDatetimeDisplay(d) {
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function formatSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
}

// ===== ユーザー名管理 =====
const LS_USERNAME_KEY = 'surecast-username';

function generateRandomName() {
  const adj = ['Swift', 'Calm', 'Bold', 'Deep', 'Pure', 'Keen'];
  const noun = ['Wave', 'Cast', 'Mic', 'Voice', 'Air', 'Studio'];
  return adj[Math.floor(Math.random() * adj.length)] + noun[Math.floor(Math.random() * noun.length)];
}

function getUserName() {
  const inputVal = $('username-input') ? $('username-input').value.trim() : '';
  return inputVal || localStorage.getItem(LS_USERNAME_KEY) || generateRandomName();
}

function loadUsername() {
  const saved = localStorage.getItem(LS_USERNAME_KEY);
  if (saved && $('username-input')) $('username-input').value = saved;
}

function saveUsername(name) {
  if (name) localStorage.setItem(LS_USERNAME_KEY, name);
}

// ===== ピアのユーザー名管理 =====
const peerUsernames = {}; // peerId -> username

// =========================================================
// ===== WebRTC / ビデオ通話 =====
// =========================================================

// ICE設定（接続時に毎回取得して確実に反映する）
let _iceConfig = null;
async function getIceConfig() {
  if (_iceConfig) return _iceConfig;
  try {
    const r = await fetch('/api/turn-credentials');
    const data = await r.json();
    if (data.iceServers && data.iceServers.length > 0) {
      _iceConfig = { iceServers: data.iceServers };
      console.log('[TURN] クレデンシャル取得OK');
      return _iceConfig;
    }
  } catch(e) { console.warn('[TURN] 取得失敗、STUNにフォールバック', e); }
  _iceConfig = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
    ]
  };
  return _iceConfig;
}
// 後方互換のためSTUNも定義
const STUN = null; // createPeer内でgetIceConfig()を使用する

const ws = {
  socket: null,
  peers: {},
  localStream: null,
  roomId: null,
  inCall: false,
  audioMuted: false,
  videoMuted: false,
};

function shouldInitiatePeer(peerId) {
  const myId = ws.socket?.id;
  if (!myId || !peerId) return false;
  return myId > peerId;
}

// ===== Socket.io 初期化 =====
function initSocket() {
  ws.socket = io({
    reconnection: true,
    reconnectionAttempts: Infinity,    // 何度でも再接続
    reconnectionDelay: 500,            // 初回0.5秒後（早めの再接続）
    reconnectionDelayMax: 5000,        // 最大5秒間隔（高レイテンシ回線でも素早く復帰）
    timeout: 120000,                   // 接続タイムアウト2分（ping1500ms超対応）
    retries: 0,                        // イベントバッファリング無効（誤再送防止）
  });

  ws.socket.on('connect', () => {
    setDot('call', 'ok');
    if (ws.inCall && ws.roomId) {
      // 通話中に再接続した場合：ルームへ自動再参加
      $('label-call').textContent = `通話：再接続中 → ${ws.roomId}`;
      const username = getUserName();
      ws.socket.emit('join-room', { roomId: ws.roomId, username });
      // サーバー録音も再送
      if (srvRecActive && srvRecMR && srvRecMR.state !== 'inactive') {
        ws.socket.emit('start-server-recording', { username });
        console.log('[再接続] ルーム再参加 + サーバー録音再送:', ws.roomId);
      }
      showToast('接続が復旧しました', 'success');
    } else {
      $('label-call').textContent = '通話：接続OK';
    }
  });

  ws.socket.on('disconnect', () => {
    setDot('call', 'warn');
    $('label-call').textContent = ws.inCall ? '通話：切断（再接続中...）' : '通話：切断（再接続中）';
  });

  ws.socket.on('connect_error', () => {
    setDot('call', 'warn');
    $('label-call').textContent = '通話：接続エラー';
  });

  // サーバー録音完了通知
  ws.socket.on('server-recording-saved', ({ filename, size, fallback }) => {
    const sizeStr = size ? ` (${(size / 1024 / 1024).toFixed(1)} MB)` : '';
    const label = fallback
      ? `⚠️ サーバー録音（WebM）：${filename}${sizeStr}`
      : `✓ サーバー録音完了：${filename}${sizeStr}`;
    const status = fallback ? 'warn' : 'done';
    const itemId = 'srv-' + filename;
    addConvertStatus(itemId, label, status);
    setDot('srv-rec', fallback ? 'warn' : 'ok');
    $('label-srv-rec').textContent = fallback ? 'サーバー録音：WebMで保存' : 'サーバー録音：保存完了';
    setFooterStatus('srv', fallback ? 'warn' : 'ok', $('label-srv-rec').textContent);
    showToast(fallback ? `録音をWebMで保存しました: ${filename}` : `サーバー録音を保存しました: ${filename}`, fallback ? 'warn' : 'success');
    console.log('[サーバー録音完了]', filename, sizeStr);
  });

  ws.socket.on('room-peers', async (peers) => {
    for (const peerInfo of peers) {
      const peerId   = typeof peerInfo === 'string' ? peerInfo : peerInfo.peerId;
      const username = typeof peerInfo === 'string' ? '' : (peerInfo.username || '');
      if (peerId && username) peerUsernames[peerId] = username;
      if (peerId && !ws.peers[peerId]) {
        await createPeer(peerId, shouldInitiatePeer(peerId));
      }
    }
    updateParticipants();
  });

  ws.socket.on('peer-joined', async (data) => {
    const peerId   = typeof data === 'string' ? data : data.peerId;
    const username = typeof data === 'string' ? '' : (data.username || '');
    if (peerId && username) peerUsernames[peerId] = username;
    if (peerId && !ws.peers[peerId]) {
      await createPeer(peerId, shouldInitiatePeer(peerId));
    }
    updateParticipants();
  });

  ws.socket.on('offer', async ({ from, offer }) => {
    let pc = ws.peers[from];
    if (!pc) pc = await createPeer(from, false);
    try {
      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      ws.socket.emit('answer', { to: from, answer });
    } catch (e) {
      console.error('[WebRTC] offer処理エラー:', e);
    }
  });

  ws.socket.on('answer', async ({ from, answer }) => {
    const pc = ws.peers[from];
    if (pc) {
      try {
        await pc.setRemoteDescription(new RTCSessionDescription(answer));
      } catch (e) {
        console.error('[WebRTC] answer処理エラー:', e);
      }
    }
  });

  ws.socket.on('ice-candidate', async ({ from, candidate }) => {
    const pc = ws.peers[from];
    if (pc && candidate) {
      try {
        await pc.addIceCandidate(new RTCIceCandidate(candidate));
      } catch (e) { /* 無視 */ }
    }
  });

  ws.socket.on('peer-left', (peerId) => {
    delete peerUsernames[peerId];
    removePeer(peerId);
    typingPeers.delete(peerId);
    updateTypingIndicator();
    updateParticipants();
    showToast('参加者が退出しました', 'info');
  });

  // ===== エピソード同期 =====
  ws.socket.on('episodes-sync', (data) => {
    handleEpisodesSync(data);
    updateSyncBadge('synced');
  });

  // ===== ルーム参加時：現在選択中のEPに自動同期 =====
  // 既存参加者がいるルームに参加した場合のみサーバーから送信される
  ws.socket.on('room-state', (state) => {
    if (state.currentEpisodeId &&
        episodeState.episodes.some(e => e.id === state.currentEpisodeId)) {
      selectEpisode(state.currentEpisodeId);
    }
  });

  ws.socket.on('episode-updated', ({ id, content }) => {
    const ep = episodeState.episodes.find(e => e.id === id);
    if (ep) {
      ep.content = content;
      if (episodeState.activeId === id) {
        const ta = $('script-textarea');
        const hadFocus = ta === document.activeElement;
        const start = ta.selectionStart;
        const end = ta.selectionEnd;
        ta.value = content;
        if (hadFocus) ta.setSelectionRange(start, end);
        ta.classList.remove('remote-updated');
        void ta.offsetWidth;
        ta.classList.add('remote-updated');
        setTimeout(() => ta.classList.remove('remote-updated'), 800);
      }
    }
    updateSyncBadge('synced');
  });

  ws.socket.on('peer-typing', ({ peerId, isTyping }) => {
    if (isTyping) typingPeers.add(peerId);
    else typingPeers.delete(peerId);
    updateTypingIndicator();
  });

  // ===== 接続品質RTT計測 =====
  ws.socket.on('client-pong', () => {
    if (!rttPingSentAt) return;
    const rtt = Date.now() - rttPingSentAt;
    rttPingSentAt = null;
    updateConnQuality(rtt);
  });

  // ===== 一斉録音開始コマンド受信 =====
  ws.socket.on('recording-start-command', ({ initiator }) => {
    if (state.isRecording) {
      // すでに録音中の場合は無視（途中参加者が個別に録音済みのケース）
      console.log('[一斉録音] すでに録音中のため無視');
      return;
    }
    showToast(`「${initiator}」が一斉録音を開始しました。録音を開始します...`, 'info');
    // 少し間を置いてから開始（トースト表示を見せるため）
    setTimeout(() => {
      startRecording();
      startServerRecording(getUsername());
    }, 500);
  });
}

// ===== PeerConnection 作成 =====
async function createPeer(peerId, isInitiator) {
  const iceConfig = await getIceConfig();
  const pc = new RTCPeerConnection(iceConfig);
  ws.peers[peerId] = pc;

  if (ws.localStream) {
    ws.localStream.getTracks().forEach(track => {
      const sender = pc.addTrack(track, ws.localStream);
      const params = sender.getParameters();
      if (!params.encodings || params.encodings.length === 0) params.encodings = [{}];
      if (track.kind === 'video') {
        params.encodings[0].maxBitrate = 500_000;  // 500kbps（3人通話で十分な品質）
        params.encodings[0].maxFramerate = 24;
        params.encodings[0].scaleResolutionDownBy = 1;
      } else if (track.kind === 'audio') {
        params.encodings[0].maxBitrate = 64_000;   // 64kbps（音声品質優先）
      }
      sender.setParameters(params).catch(() => {});
    });
  }

  pc.ontrack = (event) => {
    addRemoteVideo(peerId, event.streams[0]);
    updateParticipants();
  };

  pc.onicecandidate = ({ candidate }) => {
    if (candidate && ws.socket) ws.socket.emit('ice-candidate', { to: peerId, candidate });
  };

  pc.onconnectionstatechange = () => {
    console.log(`[WebRTC] ${peerId} connectionState → ${pc.connectionState}`);
    if (pc.connectionState === 'failed') {
      console.warn(`[WebRTC] ${peerId} 接続失敗 → ICE再起動`);
      try { pc.restartIce(); } catch(e) {}
    }
  };

  pc.oniceconnectionstatechange = () => {
    console.log(`[WebRTC] ${peerId} iceConnectionState → ${pc.iceConnectionState}`);
    if (pc.iceConnectionState === 'disconnected') {
      // ping 1580ms環境では2秒以内に一時的disconnectedが多発し再起動ループになる
      // 8秒待ちに設定（RTT×3 + バッファ）
      setTimeout(() => {
        if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
          console.warn(`[WebRTC] ${peerId} ICE disconnected継続 → 再起動`);
          try { pc.restartIce(); } catch(e) {}
        }
      }, 8000);
    }
  };

  if (isInitiator) {
    try {
      const offer = await pc.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: true });
      await pc.setLocalDescription(offer);
      ws.socket.emit('offer', { to: peerId, offer });
    } catch (e) {
      console.error('[WebRTC] offer作成エラー:', e);
    }
  }

  return pc;
}

function addRemoteVideo(peerId, stream) {
  const existing = $(`video-${peerId}`);
  if (existing) { existing.srcObject = stream; return; }

  const wrapper = document.createElement('div');
  wrapper.className = 'video-wrapper remote-wrapper';
  wrapper.id = `wrapper-${peerId}`;

  const video = document.createElement('video');
  video.id = `video-${peerId}`;
  video.autoplay = true; video.playsinline = true; video.srcObject = stream;

  const label = document.createElement('div');
  label.className = 'video-label';
  label.id = `label-${peerId}`;
  label.textContent = peerUsernames[peerId] || `参加者 ${peerId.slice(0, 6)}`;

  wrapper.appendChild(video);
  wrapper.appendChild(label);
  $('video-grid').appendChild(wrapper);
  updateVideoGridLayout();
}

function updateVideoGridLayout() {
  const grid = $('video-grid');
  const wrappers = grid.querySelectorAll('.video-wrapper');
  if (wrappers.length <= 1) {
    grid.style.gridTemplateColumns = '1fr';
    grid.style.gridAutoRows = 'auto';
    grid.style.maxWidth = '560px';
    grid.style.margin = '0 auto';
  } else {
    grid.style.gridTemplateColumns = '';
    grid.style.gridAutoRows = '';
    grid.style.maxWidth = '';
    grid.style.margin = '';
  }
}

function removePeer(peerId) {
  const pc = ws.peers[peerId];
  if (pc) { pc.close(); delete ws.peers[peerId]; }
  const wrapper = $(`wrapper-${peerId}`);
  if (wrapper) wrapper.remove();
  updateVideoGridLayout();
}

function updateParticipants() {
  const count = Object.keys(ws.peers).length + 1;
  $('call-participants').textContent = `参加者：${count}人`;
  const userCount = $('script-user-count');
  if (ws.inCall) {
    userCount.style.display = 'inline';
    userCount.textContent = `${count}人が参加中`;
  }
}

// ===== 通話参加 =====
let preJoinScriptContent = '';
let preJoinActiveId = null;
let preJoinEpisodes = null;
let isFirstJoin = false; // 初回参加時のみサーバーのactiveIdを優先するフラグ

async function joinCall() {
  const roomId = $('room-input').value.trim().toUpperCase();
  if (!roomId) { showToast('ルームIDを入力してください', 'error'); return; }

  const username = getUserName();
  saveUsername(username.replace(/[^a-zA-Z0-9_\-]/g, '_').slice(0, 20) || 'user');

  try {
    $('btn-join-call').disabled = true;
    $('btn-join-call').textContent = '接続中...';

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
          sampleRate: 48000,
          channelCount: 1,
        },
        video: {
          width: { ideal: 640, max: 1280 },
          height: { ideal: 360, max: 720 },
          frameRate: { ideal: 24, max: 30 },
          facingMode: 'user'
        }
      });
    } catch {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        showToast('カメラが利用できないため音声のみで参加します', 'info');
      } catch (e) {
        throw new Error('マイク/カメラへのアクセスが拒否されました');
      }
    }

    ws.localStream = stream;
    ws.roomId = roomId;
    ws.inCall = true;

    const localLabel = $('local-video-label');
    if (localLabel) localLabel.textContent = username + '（自分）';

    const localVid = $('local-video');
    localVid.srcObject = stream;

    if (!stream.getVideoTracks().length) {
      $('local-wrapper').innerHTML = `
        <div class="video-placeholder">
          <div class="avatar">🎙️</div>
          <span>${username}</span>
        </div>
        <div class="video-label" id="local-video-label">${username}（自分）</div>
      `;
    }

    // テキストエリアの実際の表示内容を優先してバックアップ（curEp.contentと一致しない場合を考慮）
    const curEp = getActiveEpisode();
    const taValue = $('script-textarea').value;
    preJoinScriptContent = taValue || (curEp ? curEp.content : '');
    // 通話参加前のエピソード状態を保存（通話参加後もローカル選択を維持するため）
    preJoinActiveId = episodeState.activeId;
    preJoinEpisodes = JSON.parse(JSON.stringify(episodeState.episodes));
    isFirstJoin = true; // 初回参加フラグを立てる

    ws.socket.emit('join-room', { roomId, username });

    const url = new URL(window.location.href);
    url.searchParams.set('room', roomId);
    history.pushState({}, '', url);
    $('invite-url-text').textContent = url.toString();
    $('call-room-label').textContent = `ルームID: ${roomId}`;

    $('call-setup').style.display = 'none';
    $('call-active').style.display = 'block';
    setDot('call', 'call-active');
    $('label-call').textContent = `通話中：${roomId}`;
    updateParticipants();
    showToast(`ルーム「${roomId}」に参加しました`, 'success');
    startRTTMonitoring();

  } catch (err) {
    $('btn-join-call').disabled = false;
    $('btn-join-call').textContent = '📹 通話に参加';
    showToast(`エラー: ${err.message}`, 'error');
  }
}

// ===== 通話終了 =====
function leaveCall() {
  stopServerRecording();

  Object.keys(ws.peers).forEach(removePeer);
  ws.peers = {};

  if (ws.localStream) {
    ws.localStream.getTracks().forEach(t => t.stop());
    ws.localStream = null;
  }

  document.querySelectorAll('.remote-wrapper').forEach(el => el.remove());
  $('local-wrapper').innerHTML = `
    <video id="local-video" autoplay muted playsinline></video>
    <div class="video-label" id="local-video-label">自分</div>
  `;

  if (ws.socket) ws.socket.volatile.emit('leave-room');
  ws.roomId = null;
  ws.inCall = false;
  ws.audioMuted = false;
  ws.videoMuted = false;

  const url = new URL(window.location.href);
  url.searchParams.delete('room');
  history.pushState({}, '', url);

  $('call-setup').style.display = 'block';
  $('call-active').style.display = 'none';
  $('btn-join-call').disabled = false;
  $('btn-join-call').textContent = '📹 通話に参加';
  $('btn-mute-audio').textContent = '🎙️ ミュート';

// ===== サーバー側録音（Craig方式） =====
// =========================================================

let srvRecMR = null;
let srvRecStream = null;
let srvRecActive = false;
let srvBufferFullCount = 0; // バッファ詰まり連続カウント（警告用）

async function startServerRecording(username) {
  if (srvRecActive) return;
  try {
    const deviceId = $('mic-select').value;
    const constraints = {
      audio: deviceId
        ? { deviceId: { exact: deviceId }, echoCancellation: false, noiseSuppression: false, sampleRate: 48000 }
        : { echoCancellation: false, noiseSuppression: false, sampleRate: 48000 }
    };
    srvRecStream = await navigator.mediaDevices.getUserMedia(constraints);

    const mimeType = getBestMimeType();
    srvRecMR = new MediaRecorder(srvRecStream, {
      mimeType: mimeType || undefined,
      audioBitsPerSecond: 48000, // 48kbps（低速回線対応・音声品質は十分維持）
    });

    let srvChunkSeq = 0; // チャンクシーケンス番号（欠損検知用）
    srvBufferFullCount = 0;
    ws.socket.emit('start-server-recording', { username });

    srvRecMR.ondataavailable = async (e) => {
      if (e.data && e.data.size > 0 && ws.socket) {
        try {
          const buf = await e.data.arrayBuffer();
          const seq = ++srvChunkSeq;
          // バッファ監視：200KB超えたらvolatileで破棄（メモリ保護・輻輳防止）
          const bufSize = ws.socket.io?.engine?.transport?.socket?.bufferedAmount ?? 0;
          const isBufferFull = bufSize > 200 * 1024;
          if (isBufferFull) {
            srvBufferFullCount++;
            console.warn(`[サーバー録音] バッファ詰まり (${(bufSize/1024).toFixed(0)}KB) → チャンク#${seq}を破棄 (連続${srvBufferFullCount}回)`);
            ws.socket.volatile.emit('audio-stream-chunk', { seq, buf });
            // 3回連続詰まり → ユーザーに警告
            if (srvBufferFullCount >= 3) {
              showToast('⚠️ 回線が混雑しています。クラウド録音の一部が欠損する可能性があります', 'error');
              srvBufferFullCount = 0;
            }
          } else {
            srvBufferFullCount = 0; // 正常送信できたらリセット
            ws.socket.emit('audio-stream-chunk', { seq, buf });
          }
          console.log(`[サーバー録音] チャンク#${seq} 送信 (${(buf.byteLength / 1024).toFixed(0)} KB) buf=${(bufSize/1024).toFixed(0)}KB`);
        } catch (err) {
          console.warn('[サーバー録音] チャンク送信エラー:', err);
        }
      }
    };

    srvRecMR.start(20000); // 20秒チャンク（送信頻度を下げて輻輳リスクを軽減）
    srvRecActive = true;

    setDot('srv-rec', 'srv-rec');
    $('label-srv-rec').textContent = `サーバー録音中：${username}`;
    setFooterStatus('srv', 'srv-rec', `サーバー録音中`);

    console.log('[サーバー録音] 開始:', username);
  } catch (err) {
    console.error('[サーバー録音] 開始エラー:', err);
    showToast(`サーバー録音エラー: ${err.message}`, 'error');
  }
}

function stopServerRecording() {
  if (!srvRecActive) return;
  srvRecActive = false;

  if (srvRecMR && srvRecMR.state !== 'inactive') {
    srvRecMR.stop();
  }
  if (srvRecStream) {
    srvRecStream.getTracks().forEach(t => t.stop());
    srvRecStream = null;
  }
  if (ws.socket) ws.socket.volatile.emit('stop-server-recording');
  srvRecMR = null;

  setDot('srv-rec', 'converting');
  $('label-srv-rec').textContent = 'サーバー録音：変換中...';
  setFooterStatus('srv', 'converting', 'サーバー録音：変換中...');

  console.log('[サーバー録音] 停止・サーバーへ保存指示（完了通知待ち）');
  // 完了はサーバーから 'server-recording-saved' イベントで通知される
}

const LS_EPISODES_KEY = 'podcast-episodes-v2';

const episodeState = {
  episodes: [],
  activeId: null,
};

function genLocalId() {
  return 'l_' + Math.random().toString(36).slice(2, 10);
}

function getActiveEpisode() {
  return episodeState.episodes.find(e => e.id === episodeState.activeId) || episodeState.episodes[0] || null;
}

function saveLocalEpisodes() {
  if (ws.inCall) return;
  try {
    localStorage.setItem(LS_EPISODES_KEY, JSON.stringify({
      episodes: episodeState.episodes,
      activeId: episodeState.activeId,
    }));
  } catch {}
}

function loadLocalEpisodes() {
  try {
    const saved = localStorage.getItem(LS_EPISODES_KEY);
    if (saved) {
      const data = JSON.parse(saved);
      episodeState.episodes = data.episodes || [];
      episodeState.activeId = data.activeId || null;
    }
  } catch {}

  if (episodeState.episodes.length === 0) {
    const ep = { id: genLocalId(), name: 'EP1', content: '' };
    episodeState.episodes = [ep];
    episodeState.activeId = ep.id;
  }
  if (!episodeState.episodes.find(e => e.id === episodeState.activeId)) {
    episodeState.activeId = episodeState.episodes[0].id;
  }
  renderEpisodeTabs();
  renderActiveEpisode();
}

function handleEpisodesSync(data) {
  const serverEpisodes = data.list || [];
  const serverHasContent = serverEpisodes.some(e => e.content && e.content.trim().length > 0);
  const hasOtherParticipants = !!data.hasOtherParticipants; // 参加時のみサーバーが付与

  if (isFirstJoin && hasOtherParticipants) {
    // ★ 既存ルームへの参加：コンテンツの有無に関わらずサーバーのEP一覧を使用
    // → room-state ハンドラが後から selectEpisode() で正しいEPに切り替える
    episodeState.episodes = serverEpisodes;
    episodeState.activeId = data.activeId || (serverEpisodes[0] && serverEpisodes[0].id);

  } else if (isFirstJoin && !serverHasContent && preJoinEpisodes && preJoinEpisodes.length > 0) {
    // 新規ルーム（自分が最初の参加者）：ローカルエピソードを維持し、コンテンツをサーバーに同期
    episodeState.episodes = preJoinEpisodes;
    episodeState.activeId = preJoinActiveId || preJoinEpisodes[0].id;

    const activeEp = getActiveEpisode();
    const serverFirstEpId = serverEpisodes.length > 0 ? serverEpisodes[0].id : null;
    if (activeEp && activeEp.content && serverFirstEpId && ws.socket) {
      ws.socket.emit('episode-update', { id: serverFirstEpId, content: activeEp.content });
    }

  } else {
    // 通話中の再同期（EP作成・削除・名前変更・選択など）：サーバーEP一覧を使用、アクティブIDはローカル優先
    episodeState.episodes = serverEpisodes;
    const localActiveStillExists = preJoinActiveId && serverEpisodes.find(e => e.id === preJoinActiveId);
    episodeState.activeId = localActiveStillExists
      ? preJoinActiveId
      : (data.activeId || (serverEpisodes[0] && serverEpisodes[0].id));
  }

  isFirstJoin = false;
  preJoinScriptContent = '';
  preJoinActiveId = null;
  preJoinEpisodes = null;

  renderEpisodeTabs();
  renderActiveEpisode();
}

function renderEpisodeTabs() {
  const tabsEl = $('episode-tabs');
  tabsEl.innerHTML = '';
  episodeState.episodes.forEach(ep => {
    const btn = document.createElement('button');
    btn.className = 'ep-tab' + (ep.id === episodeState.activeId ? ' active' : '');
    btn.textContent = ep.name;
    btn.dataset.id = ep.id;
    btn.addEventListener('click', () => selectEpisode(ep.id));
    tabsEl.appendChild(btn);
  });
}

function renderActiveEpisode() {
  const ep = getActiveEpisode();
  $('script-textarea').value = ep ? ep.content : '';
}

function selectEpisode(id) {
  const current = getActiveEpisode();
  if (current) current.content = $('script-textarea').value;

  episodeState.activeId = id;
  renderEpisodeTabs();
  renderActiveEpisode();
  saveLocalEpisodes();

  if (ws.inCall && ws.socket) {
    ws.socket.emit('episode-select', { id });
  }
}

function addEpisode() {
  const epNum = episodeState.episodes.length + 1;
  const name = `EP${epNum}`;

  if (ws.inCall && ws.socket) {
    ws.socket.emit('episode-create', { name });
  } else {
    const ep = { id: genLocalId(), name, content: '' };
    episodeState.episodes.push(ep);
    episodeState.activeId = ep.id;
    renderEpisodeTabs();
    renderActiveEpisode();
    saveLocalEpisodes();
  }
}

function renameEpisode() {
  const ep = getActiveEpisode();
  if (!ep) return;
  const newName = prompt('エピソード名を入力してください:', ep.name);
  if (!newName || !newName.trim()) return;
  const name = newName.trim().slice(0, 30);

  if (ws.inCall && ws.socket) {
    ws.socket.emit('episode-rename', { id: ep.id, name });
  } else {
    ep.name = name;
    renderEpisodeTabs();
    saveLocalEpisodes();
  }
}

function deleteEpisode() {
  if (episodeState.episodes.length <= 1) {
    showToast('エピソードは最低1つ必要です', 'error');
    return;
  }
  const ep = getActiveEpisode();
  if (!ep) return;
  if (!confirm(`「${ep.name}」を削除しますか？`)) return;

  if (ws.inCall && ws.socket) {
    ws.socket.emit('episode-delete', { id: ep.id });
  } else {
    episodeState.episodes = episodeState.episodes.filter(e => e.id !== ep.id);
    episodeState.activeId = episodeState.episodes[0].id;
    renderEpisodeTabs();
    renderActiveEpisode();
    saveLocalEpisodes();
  }
}

// ===== VUメーター =====
// =========================================================

let vuAnalyser = null;
let vuStream = null;
let vuAnimFrame = null;
let vuCtx = null;
let silenceTimer = null;

async function startVUMeter() {
  if (vuAnalyser) return;
  try {
    const deviceId = $('mic-select').value;
    const constraints = {
      audio: deviceId
        ? { deviceId: { exact: deviceId }, echoCancellation: false, noiseSuppression: false }
        : { echoCancellation: false, noiseSuppression: false }
    };
    vuStream = await navigator.mediaDevices.getUserMedia(constraints);
    vuCtx = new AudioContext();
    const source = vuCtx.createMediaStreamSource(vuStream);
    vuAnalyser = vuCtx.createAnalyser();
    vuAnalyser.fftSize = 2048;
    vuAnalyser.smoothingTimeConstant = 0.25;
    source.connect(vuAnalyser);
    requestAnimationFrame(updateVUMeter);
    console.log('[VUメーター] 開始');
  } catch (e) {
    console.warn('[VUメーター] 初期化失敗:', e.message);
  }
}

function stopVUMeter() {
  if (vuAnimFrame) { cancelAnimationFrame(vuAnimFrame); vuAnimFrame = null; }
  if (vuStream) { vuStream.getTracks().forEach(t => t.stop()); vuStream = null; }
  if (vuCtx) { vuCtx.close().catch(() => {}); vuCtx = null; }
  vuAnalyser = null;
  if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
  const bar = $('vu-bar');
  if (bar) bar.style.width = '0%';
  const dbLabel = $('vu-db-label');
  if (dbLabel) dbLabel.textContent = '— dB';
  const msg = $('vu-message');
  if (msg) msg.textContent = '';
}

function updateVUMeter() {
  if (!vuAnalyser) return;

  const data = new Float32Array(vuAnalyser.fftSize);
  vuAnalyser.getFloatTimeDomainData(data);

  let sum = 0;
  let peak = 0;
  for (let i = 0; i < data.length; i++) {
    sum += data[i] * data[i];
    if (Math.abs(data[i]) > peak) peak = Math.abs(data[i]);
  }
  const rms = Math.sqrt(sum / data.length);
  const db = rms > 0.000001 ? Math.max(-60, 20 * Math.log10(rms)) : -60;
  const pct = Math.max(0, Math.min(100, (db + 60) / 60 * 100));

  const bar = $('vu-bar');
  const dbLabel = $('vu-db-label');
  const msg = $('vu-message');

  if (bar) bar.style.width = pct + '%';
  if (dbLabel) dbLabel.textContent = db > -60 ? `${db.toFixed(1)} dB` : '-∞ dB';

  const isClipping = peak >= 0.99;

  if (msg) {
    if (isClipping || db >= 0) {
      msg.textContent = '⚠️ クリッピング！録音レベルが高すぎます';
      msg.style.color = 'var(--red)';
    } else if (db >= -6) {
      msg.textContent = '⚠️ 音量が高めです（-6dB以下を推奨）';
      msg.style.color = 'var(--yellow)';
    } else if (db >= -12) {
      msg.textContent = '✓ 適正レベルです';
      msg.style.color = 'var(--green)';
    } else {
      msg.textContent = '';
    }
  }

  if (db < -55) {
    if (!silenceTimer) {
      silenceTimer = setTimeout(() => {
        if (msg && !msg.textContent) {
          msg.textContent = '⚠️ マイクを確認してください（5秒以上無音が続いています）';
          msg.style.color = 'var(--yellow)';
        }
      }, 5000);
    }
  } else {
    if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
  }

  vuAnimFrame = requestAnimationFrame(updateVUMeter);
}

$('mic-select').addEventListener('change', async () => {
  if (vuAnalyser) {
    stopVUMeter();
    await startVUMeter();
  }
});

// ===== IndexedDB クラッシュリカバリー =====
// =========================================================

const IDB_NAME = 'surecast-recovery';
const IDB_VERSION = 1;
let idb = null;

function openIDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('sessions')) {
        db.createObjectStore('sessions', { keyPath: 'sessionId' });
      }
      if (!db.objectStoreNames.contains('chunks')) {
        const s = db.createObjectStore('chunks', { keyPath: 'key' });
        s.createIndex('sessionId', 'sessionId', { unique: false });
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

function idbReq(req) {
  return new Promise((resolve, reject) => {
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror  = (e) => reject(e.target.error);
  });
}

async function idbSaveChunk(sessionId, chunkIndex, blob, mimeType) {
  if (!idb) return;
  const tx = idb.transaction(['chunks', 'sessions'], 'readwrite');
  tx.objectStore('chunks').put({ key: `${sessionId}-${chunkIndex}`, sessionId, chunkIndex, blob, mimeType });
  tx.objectStore('sessions').put({ sessionId, mimeType, chunkCount: chunkIndex, ts: Date.now() });
}

async function idbGetSessions() {
  if (!idb) return [];
  const tx = idb.transaction('sessions', 'readonly');
  return idbReq(tx.objectStore('sessions').getAll());
}

async function idbGetChunks(sessionId) {
  if (!idb) return [];
  const tx = idb.transaction('chunks', 'readonly');
  const all = await idbReq(tx.objectStore('chunks').index('sessionId').getAll(sessionId));
  return all.sort((a, b) => a.chunkIndex - b.chunkIndex);
}

async function idbClearSession(sessionId) {
  if (!idb) return;
  const chunks = await idbGetChunks(sessionId);
  const tx = idb.transaction(['chunks', 'sessions'], 'readwrite');
  chunks.forEach(c => tx.objectStore('chunks').delete(c.key));
  tx.objectStore('sessions').delete(sessionId);
}

async function checkRecovery() {
  const sessions = await idbGetSessions();
  if (sessions.length === 0) return;

  const banner   = $('recovery-banner');
  const subLabel = $('recovery-sub');
  const btnDl    = $('btn-recovery-dl');
  const btnDel   = $('btn-recovery-del');

  const session = sessions.sort((a, b) => b.ts - a.ts)[0];
  const d = new Date(session.ts);
  subLabel.textContent =
    `セッション: ${session.sessionId}  チャンク数: ${session.chunkCount}  `
    + `(${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} `
    + `${pad(d.getHours())}:${pad(d.getMinutes())})`;

  banner.classList.add('visible');

  btnDl.onclick = async () => {
    btnDl.disabled = true;
    btnDl.textContent = '変換中...';
    const chunks = await idbGetChunks(session.sessionId);
    if (chunks.length === 0) { banner.classList.remove('visible'); return; }
    const mimeType = chunks[0].mimeType || 'audio/webm;codecs=opus';
    const blob = new Blob(chunks.map(c => c.blob), { type: mimeType });
    if (blob.size === 0) { banner.classList.remove('visible'); return; }

    const username = getUserName();
    addConvertStatus('recover', `変換中（クラッシュ復元）... ${formatSize(blob.size)}`, 'converting');
    try {
      const data = await uploadForFlacConversion(blob, username);
      updateConvertStatus('recover', `✓ 復元保存完了：${data.filename} (${formatSize(data.size)})`, 'done');
      await idbClearSession(session.sessionId);
    } catch (err) {
      // FLAC変換失敗時はWebMとして直接ダウンロード
      const webmFilename = downloadWebmDirect(blob, username, session.sessionId);
      updateConvertStatus('recover', `⚠️ FLAC変換失敗 → WebMで保存済み：${webmFilename}`, 'error');
    }

    banner.classList.remove('visible');
  };

  btnDel.onclick = async () => {
    await idbClearSession(session.sessionId);
    banner.classList.remove('visible');
    showToast('前回の録音データを削除しました', 'info');
  };
}

// =========================================================
// ===== 録音機能 =====
// =========================================================

const state = {
  mediaRecorder: null,
  stream: null,
  chunks: [],        // メモリ上のチャンク（全件保持）
  isRecording: false,
  startTime: null,
  timerInterval: null,
  chunkCount: 0,     // IDBバックアップ用インデックス
  mimeType: '',
  sessionId: '',
};

const btnStart  = $('btn-start');
const btnStop   = $('btn-stop');
const micSelect = $('mic-select');

async function loadMics() {
  try {
    const tmp = await navigator.mediaDevices.getUserMedia({ audio: true });
    tmp.getTracks().forEach(t => t.stop());
    const devices = await navigator.mediaDevices.enumerateDevices();
    const mics = devices.filter(d => d.kind === 'audioinput');
    micSelect.innerHTML = '';
    mics.forEach((m, i) => {
      const opt = document.createElement('option');
      opt.value = m.deviceId;
      opt.textContent = m.label || `マイク ${i + 1}`;
      micSelect.appendChild(opt);
    });
    setDot('mic', 'ok');
    $('label-mic').textContent = `マイク：${mics.length}台検出`;

    await startVUMeter();
  } catch {
    setDot('mic', 'warn');
    $('label-mic').textContent = 'マイク：アクセス拒否';
    showToast('マイクへのアクセスを許可してください', 'error');
  }
}

function getBestMimeType() {
  const types = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/ogg;codecs=opus',
    'audio/mp4'
  ];
  for (const t of types) {
    if (MediaRecorder.isTypeSupported(t)) return t;
  }
  return '';
}

async function startRecording() {
  try {
    const deviceId = micSelect.value;
    const constraints = {
      audio: deviceId
        ? { deviceId: { exact: deviceId }, echoCancellation: false, noiseSuppression: false, sampleRate: 44100 }
        : { echoCancellation: false, noiseSuppression: false, sampleRate: 44100 }
    };
    state.stream = await navigator.mediaDevices.getUserMedia(constraints);

    state.mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
      ? 'audio/webm;codecs=opus'
      : getBestMimeType();

    state.chunks = [];
    state.chunkCount = 0;
    const _now = new Date();
    state.sessionId = `${_now.getFullYear()}${pad(_now.getMonth()+1)}${pad(_now.getDate())}-${pad(_now.getHours())}${pad(_now.getMinutes())}${pad(_now.getSeconds())}`;

    state.mediaRecorder = new MediaRecorder(state.stream, {
      mimeType: state.mimeType || undefined,
      audioBitsPerSecond: 128000, // 128kbps（高音質・ポッドキャスト推奨）
    });

    state.mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) {
        // メモリに保持（主要パス）
        state.chunks.push(e.data);
        // IDBにバックアップ保存（クラッシュリカバリー用・失敗しても録音は続く）
        if (idb && state.sessionId) {
          state.chunkCount++;
          const idx = state.chunkCount;
          const sid = state.sessionId;
          const mt = state.mimeType;
          idbSaveChunk(sid, idx, e.data, mt).catch(() => {});
        }
      }
    };

    state.mediaRecorder.onstop = finalizeRecording;
    state.mediaRecorder.start(10000); // 10秒チャンク（IDB書き込み頻度を下げCPU/IO負荷軽減）

    state.isRecording = true;
    state.startTime = Date.now();

    setRecordingUI(true);
    startTimer();

    setDot('local-rec', 'active');
    $('label-local-rec').textContent = 'ローカル録音：収録中';
    setFooterStatus('local', 'active', 'ローカル録音：収録中');

    showToast('録音を開始しました', 'success');

  } catch (err) {
    showToast(`録音開始エラー: ${err.message}`, 'error');
  }
}

function stopRecording() {
  if (!state.mediaRecorder || state.mediaRecorder.state === 'inactive') return;
  clearInterval(state.timerInterval);
  state.mediaRecorder.stop();
  state.stream?.getTracks().forEach(t => t.stop());
  state.isRecording = false;
  setRecordingUI(false);

  setDot('local-rec', '');
  $('label-local-rec').textContent = 'ローカル録音：変換中...';
  setFooterStatus('local', '', 'ローカル録音：変換中...');
}

async function finalizeRecording() {
  const sessionId = state.sessionId;
  const mimeType = state.mimeType || 'audio/webm;codecs=opus';
  const memoryChunks = [...state.chunks]; // メモリチャンクをコピー
  state.chunks = []; // クリア

  let finalBlob = null;

  if (memoryChunks.length > 0) {
    // ★ メインパス：メモリチャンクを使用（確実）
    finalBlob = new Blob(memoryChunks, { type: mimeType });
    console.log(`[録音] メモリチャンク ${memoryChunks.length}個 → ${formatSize(finalBlob.size)}`);
  } else {
    // フォールバック：IDBから読み出し（メモリが空の場合）
    console.warn('[録音] メモリチャンクが空 → IDBからフォールバック');
    const idbChunks = await idbGetChunks(sessionId);
    if (idbChunks.length > 0) {
      finalBlob = new Blob(idbChunks.map(c => c.blob), { type: mimeType });
      console.log(`[録音] IDBチャンク ${idbChunks.length}個 → ${formatSize(finalBlob.size)}`);
    }
  }

  if (!finalBlob || finalBlob.size === 0) {
    console.warn('[録音] データがありません（メモリ・IDB両方空）');
    setDot('local-rec', 'warn');
    $('label-local-rec').textContent = 'ローカル録音：停止中（データなし）';
    setFooterStatus('local', 'warn', 'データなし');
    await idbClearSession(sessionId);
    return;
  }

  const username = getUserName();
  const itemId = 'local-' + sessionId;
  addConvertStatus(itemId, `FLAC変換・アップロード中... (${formatSize(finalBlob.size)}) ※低回線では時間がかかります`, 'converting');

  try {
    const data = await uploadForFlacConversion(finalBlob, username);
    updateConvertStatus(itemId, `✓ 保存完了：${data.filename} (${formatSize(data.size)})`, 'done');
    setDot('local-rec', 'ok');
    $('label-local-rec').textContent = 'ローカル録音：保存完了';
    setFooterStatus('local', 'ok', 'ローカル録音：保存完了');
    setTimeout(() => {
      $('label-local-rec').textContent = 'ローカル録音：停止中';
      setFooterStatus('local', '', 'ローカル録音：停止中');
    }, 5000);
    await idbClearSession(sessionId);
  } catch (err) {
    // ★ FLAC変換失敗時：WebMとして直接ダウンロード（低回線でのセーフティネット）
    console.warn('[録音] FLAC変換失敗 → WebMダウンロードフォールバック:', err.message);
    const webmFilename = downloadWebmDirect(finalBlob, username, sessionId);
    updateConvertStatus(itemId,
      `⚠️ FLAC変換失敗のためWebMで保存済み：${webmFilename}\n（エラー：${err.message}）`,
      'error'
    );
    setDot('local-rec', 'warn');
    $('label-local-rec').textContent = 'ローカル録音：WebMで保存済み';
    setFooterStatus('local', 'warn', 'ローカル録音：WebMで保存済み');
    showToast('FLAC変換に失敗しました。WebMファイルとしてダウンロードしました。', 'error');
    // IDBは保持しておく（再試行可能なように）
  }
}

async function uploadForFlacConversion(blob, username) {
  const formData = new FormData();
  formData.append('audio', blob, 'recording.webm');
  formData.append('username', (username || 'user').replace(/[^a-zA-Z0-9_\-]/g, '_').slice(0, 20));

  // タイムアウトを10分に設定（低回線での大容量アップロード対応）
  // 2時間×96kbps ≈ 86MB のアップロードを許容
  const controller = new AbortController();
  const uploadTimeout = setTimeout(() => controller.abort(), 10 * 60 * 1000);

  try {
    const res = await fetch('/convert-to-flac', {
      method: 'POST',
      body: formData,
      signal: controller.signal,
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
      throw new Error(err.error || `HTTP ${res.status}`);
    }
    return res.json();
  } finally {
    clearTimeout(uploadTimeout);
  }
}

// WebMとしてブラウザから直接ダウンロード（FLAC変換失敗時のバックアップ）
function downloadWebmDirect(blob, username, sessionId) {
  const safeUser = (username || 'user').replace(/[^a-zA-Z0-9_\-]/g, '_').slice(0, 20);
  const filename = `surecast-${safeUser}-${sessionId}-local.webm`;
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  showToast(`WebMとして保存しました: ${filename}`, 'info');
  return filename;
}

function addConvertStatus(id, text, type) {
  const list = $('convert-status-list');
  const item = document.createElement('div');
  item.className = `convert-item ${type}`;
  item.id = `convert-item-${id}`;

  const icons = { converting: '🔄', done: '✓', error: '⚠️' };
  item.innerHTML = `
    <div class="convert-icon">${icons[type] || '🎵'}</div>
    <div class="convert-text">
      <div class="convert-title" id="convert-title-${id}">${text}</div>
      <div class="convert-sub">${new Date().toLocaleTimeString('ja-JP')}</div>
    </div>
  `;
  list.insertBefore(item, list.firstChild);
}

function updateConvertStatus(id, text, type) {
  const item = $(`convert-item-${id}`);
  if (item) {
    item.className = `convert-item ${type}`;
    const icons = { converting: '🔄', done: '✓', error: '⚠️' };
    const icon = item.querySelector('.convert-icon');
    const title = $(`convert-title-${id}`);
    if (icon) icon.textContent = icons[type] || '🎵';
    if (title) title.textContent = text;
  }
}

function startTimer() {
  const timerEl = $('rec-timer-inline');
  timerEl.style.display = 'inline';
  state.timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    timerEl.textContent = `${m}:${s}`;
  }, 500);
}

function setRecordingUI(recording) {
  btnStart.disabled = recording;
  btnStop.disabled  = !recording;
  micSelect.disabled = recording;

  const leftCol = $('left-col');
  if (recording) {
    leftCol.classList.add('recording');
  } else {
    leftCol.classList.remove('recording');
    const timerEl = $('rec-timer-inline');
    timerEl.style.display = 'none';
    timerEl.textContent = '';
  }
}

function setFooterStatus(type, dotClass, label) {
  if (type === 'local') {
    setDot('local-rec', dotClass);
    $('label-local-rec').textContent = label;
  } else if (type === 'srv') {
    setDot('srv-rec', dotClass);
    $('label-srv-rec').textContent = label;
  }
}

async function checkServer() {
  try {
    const res = await fetch('/recordings', { signal: AbortSignal.timeout(3000) });
    if (res.ok) {
      setDot('srv-rec', '');
      $('label-srv-rec').textContent = 'サーバー録音：待機中';
    }
  } catch {
    // サイレントに失敗
  }
}

// =========================================================
// ===== 接続品質モニタリング（RTT計測）=====
// =========================================================

let rttPingSentAt = null;
let rttInterval = null;

function startRTTMonitoring() {
  if (rttInterval) return;
  measureRTT(); // 即時計測
  rttInterval = setInterval(measureRTT, 15000); // 15秒ごと
}

function stopRTTMonitoring() {
  if (rttInterval) { clearInterval(rttInterval); rttInterval = null; }
  setDot('conn', '');
  $('label-conn').textContent = '接続品質：－';
}

function measureRTT() {
  if (!ws.socket || !ws.socket.connected) return;
  rttPingSentAt = Date.now();
  ws.socket.volatile.emit('client-ping'); // volatile: 計測用なので破棄されてもOK
}

function updateConnQuality(rtt) {
  const label = $('label-conn');
  const dot = $('dot-conn');
  if (!label || !dot) return;

  if (rtt < 150) {
    dot.className = 'dot ok';
    label.textContent = `接続品質：良好 (${rtt}ms)`;
  } else if (rtt < 500) {
    dot.className = 'dot warn';
    label.textContent = `接続品質：やや遅い (${rtt}ms)`;
  } else if (rtt < 1500) {
    dot.className = 'dot warn';
    label.textContent = `接続品質：低速 (${rtt}ms)`;
  } else {
    dot.className = 'dot active'; // 赤点滅
    label.textContent = `接続品質：非常に低速 (${rtt}ms) ⚠️`;
  }
}

btnStart.addEventListener('click', () => {
  startRecording();
  startServerRecording(getUsername());
});
btnStop.addEventListener('click', () => {
  stopRecording();
  stopServerRecording();
});
window.addEventListener('beforeunload', (e) => {
  if (state.isRecording) {
    e.preventDefault();
    e.returnValue = '録音中です。ページを離れると録音データが失われる可能性があります。';
    // メモリ上の未保存チャンクをIDBに緊急フラッシュ（クラッシュリカバリー用）
    if (idb && state.sessionId && state.chunks.length > 0) {
      try {
        const tx = idb.transaction(['chunks', 'sessions'], 'readwrite');
        state.chunks.forEach((chunk, i) => {
          const idx = state.chunkCount - state.chunks.length + i + 1;
          tx.objectStore('chunks').put({ key: `${state.sessionId}-${idx}`, sessionId: state.sessionId, chunkIndex: idx, blob: chunk, mimeType: state.mimeType });
        });
        tx.objectStore('sessions').put({ sessionId: state.sessionId, mimeType: state.mimeType, chunkCount: state.chunkCount, ts: Date.now() });
      } catch {}
    }
  }
  if (srvRecActive) {
    // sendBeacon でサーバーにページ離脱を通知（Socket.io emit は beforeunload で届かないことがある）
    // サーバー側は切断イベント + グレース期間で対応するので最低限の通知でOK
    try { navigator.sendBeacon('/api/recording-stop', JSON.stringify({ note: 'beforeunload' })); } catch {}
    stopServerRecording();
  }
});

})();
