<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SureCast -SEAMLESS REMOTE RECORDING-</title>
  <style>
    /* ===== リセット & ベース ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #222222;
      --border: #2a2a2a;
      --accent: #d97706;
      --accent-hover: #f59e0b;
      --red: #ef4444;
      --red-dark: #dc2626;
      --green: #22c55e;
      --yellow: #f59e0b;
      --teal: #22c55e;
      --text: #f5f5f5;
      --text-dim: #a0a0a0;
      --radius: 12px;
      --footer-h: 72px;
    }

    body {
      font-family: 'Hiragino Sans', 'Meiryo', 'Yu Gothic', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: var(--footer-h);
    }

    /* ===== ヘッダー ===== */
    header {
      background: #f5f0e8;
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-logo {
      height: 50px;
      width: auto;
      display: block;
    }
    header .header-link {
      margin-left: auto;
      font-size: 0.82rem;
      color: var(--accent);
      text-decoration: none;
      padding: 6px 12px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      transition: background 0.15s;
      white-space: nowrap;
    }
    header .header-link:hover { background: rgba(217,119,6,0.15); }

    /* ===== ステータスバー ===== */
    #status-bar {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      padding: 8px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 0.82rem;
    }
    .status-item { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
    }
    .dot.active     { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
    .dot.ok         { background: var(--green);  animation: none; }
    .dot.warn       { background: var(--yellow); animation: none; }
    .dot.uploading  { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
    .dot.call-active{ background: var(--teal);   animation: pulse 1s ease-in-out infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.85); }
    }

    /* ===== メインレイアウト ===== */
    main {
      flex: 1;
      padding: 20px;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ===== カード ===== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ===== ボタン共通 ===== */
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      flex: 1;
      min-width: 120px;
      padding: 13px 16px;
      border: none;
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-family: inherit;
    }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-record { background: var(--accent); color: #000; }
    .btn-record:not(:disabled):hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-stop { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-stop:not(:disabled):hover { background: var(--border); transform: translateY(-1px); }
    .btn-save { background: var(--accent); color: #000; }
    .btn-save:not(:disabled):hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-teal { background: var(--accent); color: #000; font-weight: 800; }
    .btn-teal:not(:disabled):hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:not(:disabled):hover { background: var(--border); transform: translateY(-1px); }
    .btn-danger { background: rgba(255,68,68,0.15); color: var(--red); border: 1px solid var(--red); }
    .btn-danger:not(:disabled):hover { background: rgba(255,68,68,0.25); transform: translateY(-1px); }

    /* ===== フォーム ===== */
    .form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    label { font-size: 0.83rem; color: var(--text-dim); }
    select, input[type="text"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 14px;
      font-size: 0.9rem;
      font-family: inherit;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }
    select:focus, input[type="text"]:focus { border-color: var(--accent); }
    select { cursor: pointer; }
    select option { background: var(--surface2); }
    input[type="text"]::placeholder { color: var(--text-dim); }

    /* ===== ビデオ通話UI ===== */
    .room-input-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .room-input-row input {
      flex: 1;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .room-input-row .btn-ghost {
      flex: 0 0 auto;
      min-width: unset;
      padding: 10px 12px;
      font-size: 0.82rem;
      white-space: nowrap;
    }

    /* 招待バー */
    #invite-bar {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    #invite-bar .invite-label { font-size: 0.78rem; color: var(--text-dim); flex-shrink: 0; }
    #invite-url-text { flex: 1; font-size: 0.82rem; color: var(--teal); word-break: break-all; min-width: 0; font-weight: 600; }
    #btn-copy-url {
      flex-shrink: 0;
      background: var(--accent); color: #000;
      border: none; border-radius: 6px;
      padding: 6px 12px; font-size: 0.82rem; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: background 0.15s; white-space: nowrap;
    }
    #btn-copy-url:hover { background: var(--accent-hover); }

    /* ビデオグリッド */
    #video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
      min-height: 140px;
    }
    .video-wrapper {
      position: relative; background: #000;
      border-radius: 10px; overflow: hidden;
      aspect-ratio: 4/3; border: 2px solid var(--border);
    }
    .video-wrapper.local-wrapper  { border-color: var(--teal); }
    .video-wrapper.remote-wrapper { border-color: var(--border); }
    .video-wrapper video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .local-wrapper video { transform: scaleX(-1); }

    .video-label {
      position: absolute; bottom: 7px; left: 7px;
      background: rgba(0,0,0,0.65); color: #fff;
      padding: 3px 9px; border-radius: 20px;
      font-size: 0.72rem; font-weight: 700; pointer-events: none;
    }
    .local-wrapper .video-label { background: rgba(34,197,94,0.75); }

    .video-placeholder {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 8px; color: var(--text-dim); font-size: 0.83rem;
      background: var(--surface2);
    }
    .video-placeholder .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--border);
      display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
    }

    #call-meta {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.82rem; color: var(--text-dim); margin-bottom: 10px;
    }
    #call-participants { font-weight: 700; color: var(--teal); }
    #call-controls .btn { min-width: 100px; padding: 11px 12px; font-size: 0.85rem; }
    .btn.muted { opacity: 0.55; }

    /* ===== 自動保存ログ ===== */
    #chunk-log {
      max-height: 100px;
      overflow-y: auto;
      font-size: 0.8rem;
      color: var(--text-dim);
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 14px;
    }
    .log-entry {
      display: flex; align-items: center; gap: 6px;
      padding: 3px 0; border-bottom: 1px solid var(--border);
    }
    .log-entry .time { color: var(--accent); font-variant-numeric: tabular-nums; }

    /* ===== 録音ファイル一覧 ===== */
    #file-list {
      display: flex; flex-direction: column;
      gap: 8px; max-height: 320px; overflow-y: auto;
    }
    .file-item {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 14px;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .file-item.new-file { border-color: var(--green); animation: file-highlight 2s ease-out forwards; }
    @keyframes file-highlight {
      0%   { background: rgba(34,204,102,0.15); border-color: var(--green); }
      100% { background: var(--surface2);       border-color: var(--border); }
    }
    .file-info { flex: 1; min-width: 0; }
    .file-name { font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-meta { font-size: 0.76rem; color: var(--text-dim); margin-top: 2px; }
    .file-actions { display: flex; gap: 7px; flex-shrink: 0; }
    .btn-small {
      padding: 6px 12px; border: none; border-radius: 6px;
      font-size: 0.8rem; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: all 0.15s; white-space: nowrap;
    }
    .btn-dl { background: var(--accent); color: #000; }
    .btn-dl:hover { background: var(--accent-hover); }
    .btn-dl-now { background: var(--green); color: #000; }
    .btn-dl-now:hover { background: #1aaa55; }
    audio {
      width: 100%; height: 34px; margin-top: 7px;
      border-radius: 6px; background: var(--surface);
    }
    audio::-webkit-media-controls-panel { background: var(--surface2); }

    /* クラウドファイル一覧へのリンク */
    .cloud-link-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 8px;
      margin-bottom: 12px;
      font-size: 0.85rem;
    }
    .cloud-link-bar a {
      color: var(--accent); text-decoration: none; font-weight: 700;
      padding: 5px 12px; border: 1px solid var(--accent); border-radius: 6px;
      transition: background 0.15s;
    }
    .cloud-link-bar a:hover { background: rgba(217,119,6,0.15); }

    /* ===== アップロードステータス ===== */
    #upload-status-area {
      margin-top: 12px; padding: 11px 14px;
      border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface2); display: none;
    }
    #upload-status-area.visible { display: block; }
    #upload-status-msg { font-size: 0.86rem; display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .progress-wrap { height: 5px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .progress-bar  { height: 100%; background: var(--accent); width: 0; transition: width 0.3s; border-radius: 999px; }

    .empty-state { text-align: center; padding: 28px; color: var(--text-dim); font-size: 0.88rem; }

    /* ===== トースト ===== */
    #toast {
      position: fixed; bottom: calc(var(--footer-h) + 12px); left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 11px 18px;
      font-size: 0.88rem; font-weight: 600;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1000; white-space: nowrap; max-width: 90vw; text-align: center;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.success { border-color: var(--green); color: var(--green); }
    #toast.error   { border-color: var(--red);   color: var(--red);   }
    #toast.info    { border-color: var(--accent); color: var(--accent); }

    /* ===== 台本エリア ===== */
    /* エピソードバー */
    #episode-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    #episode-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      flex: 1;
    }
    .ep-tab {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-dim);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      white-space: nowrap;
    }
    .ep-tab:hover { border-color: var(--accent); color: var(--text); }
    .ep-tab.active { background: var(--accent); border-color: var(--accent); color: #000; }
    #btn-ep-add {
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--text-dim);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      white-space: nowrap;
    }
    #btn-ep-add:hover { border-color: var(--accent); color: var(--accent); }

    #episode-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .ep-action-btn {
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-dim);
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      white-space: nowrap;
    }
    .ep-action-btn:hover { border-color: var(--border); color: var(--text); background: var(--border); }
    .ep-action-btn.danger:hover { border-color: var(--red); color: var(--red); background: rgba(255,68,68,0.1); }

    #script-textarea {
      width: 100%;
      min-height: 260px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 14px;
      font-size: 0.92rem;
      font-family: 'Hiragino Sans', 'Meiryo', 'Yu Gothic', sans-serif;
      line-height: 1.8;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }
    #script-textarea:focus { border-color: var(--accent); }
    #script-textarea::placeholder { color: var(--text-dim); opacity: 0.7; }

    .sync-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.76rem; padding: 3px 9px; border-radius: 999px;
      font-weight: 600; margin-left: 6px;
    }
    .sync-badge.offline { background: rgba(136,136,153,0.15); color: var(--text-dim); }
    .sync-badge.syncing { background: rgba(255,170,0,0.15);   color: var(--yellow); }
    .sync-badge.synced  { background: rgba(34,204,102,0.15);  color: var(--green);  }

    #script-user-count { font-size: 0.76rem; color: var(--teal); margin-left: 5px; }

    #script-typing-indicator {
      min-height: 20px; margin-top: 7px;
      font-size: 0.78rem; color: var(--text-dim);
      display: flex; align-items: center; gap: 6px;
    }
    .typing-dots { display: inline-flex; gap: 3px; }
    .typing-dots span {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent); animation: typing-bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30%            { transform: translateY(-4px); opacity: 1; }
    }

    @keyframes script-flash {
      0%   { background: rgba(217,119,6,0.12); border-color: var(--accent); }
      100% { background: var(--surface2);      border-color: var(--border); }
    }
    #script-textarea.remote-updated { animation: script-flash 0.8s ease-out; }

    /* ===== 固定録音フッター ===== */
    #rec-footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--footer-h);
      background: var(--surface);
      border-top: 2px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      z-index: 500;
    }
    #rec-footer.recording {
      border-top-color: var(--accent);
      background: color-mix(in srgb, var(--surface) 88%, var(--accent) 12%);
    }

    #rec-footer-status {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
      flex: 1;
    }
    .rec-stat-row {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.78rem; white-space: nowrap;
    }
    .rec-stat-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-dim); flex-shrink: 0;
    }
    .rec-stat-dot.active   { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
    .rec-stat-dot.ok       { background: var(--green);  }
    .rec-stat-dot.uploading{ background: var(--accent); animation: pulse 1s ease-in-out infinite; }
    .rec-stat-dot.warn     { background: var(--yellow); }

    #rec-footer-center {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      flex-shrink: 0;
    }
    #rec-timer-footer {
      font-size: 1.3rem; font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.05em;
      color: var(--accent);
    }

    #rec-footer-btns {
      display: flex; gap: 10px; flex-shrink: 0;
    }
    #rec-footer-btns .btn {
      min-width: 0;
      padding: 11px 18px;
      font-size: 0.88rem;
      flex: 0 0 auto;
    }

    /* ===== 2カラムレイアウト（通話中） ===== */
    @media (min-width: 960px) {
      main.in-call {
        max-width: 1440px;
        display: grid;
        grid-template-columns: 1fr 420px;
        gap: 20px;
        align-items: start;
      }
      main.in-call > #call-card      { grid-column: 1; grid-row: 1; }
      main.in-call > #recording-card { grid-column: 1; grid-row: 2; }
      main.in-call > #files-card     { grid-column: 1; grid-row: 3; }
      main.in-call > #script-card    {
        grid-column: 2; grid-row: 1 / span 3;
        position: sticky; top: 16px;
      }
      main.in-call #script-textarea { min-height: 480px; }
    }

    /* ===== レスポンシブ ===== */
    @media (max-width: 600px) {
      main { padding: 10px; gap: 14px; }
      .card { padding: 14px; }
      .btn  { min-width: 90px; padding: 11px 10px; font-size: 0.85rem; }
      #video-grid { grid-template-columns: 1fr 1fr; }
      #call-controls .btn { min-width: 72px; font-size: 0.78rem; padding: 10px 8px; }
      #rec-footer { padding: 0 12px; gap: 10px; }
      #rec-footer-btns .btn { padding: 10px 14px; font-size: 0.82rem; }
      #rec-timer-footer { font-size: 1.1rem; }
      .rec-stat-row { font-size: 0.72rem; }
      #episode-actions { gap: 4px; }
      .ep-action-btn { padding: 4px 8px; font-size: 0.72rem; }
    }
    @media (max-width: 400px) {
      #video-grid { grid-template-columns: 1fr; }
      #rec-footer-status { display: none; }
    }
  </style>
</head>
<body>

<header>
  <img src="/images/surecast-logo.png" alt="SureCast" class="header-logo">
  <a href="/recordings.html" class="header-link">☁ クラウド録音一覧</a>
</header>

<div id="status-bar">
  <div class="status-item">
    <div class="dot" id="dot-mic"></div>
    <span id="label-mic">マイク：未接続</span>
  </div>
  <div class="status-item">
    <div class="dot" id="dot-local-rec"></div>
    <span id="label-local-rec">ローカル録音：停止中</span>
  </div>
  <div class="status-item">
    <div class="dot" id="dot-cloud"></div>
    <span id="label-cloud">クラウド：待機中</span>
  </div>
  <div class="status-item">
    <div class="dot" id="dot-call"></div>
    <span id="label-call">通話：未接続</span>
  </div>
</div>

<main>

  <!-- ===== ビデオ通話 ===== -->
  <div class="card" id="call-card">
    <div class="card-title">📹 ビデオ通話</div>

    <!-- 参加前 -->
    <div id="call-setup">
      <div class="form-row">
        <label>ルームID（英数字・自動生成されます）</label>
        <div class="room-input-row">
          <input type="text" id="room-input" placeholder="例：ABC123" maxlength="12">
          <button class="btn btn-ghost" id="btn-random-room">ランダム</button>
        </div>
      </div>

<!-- Socket.io クライアント -->
<script src="/socket.io/socket.io.js"></script>

<script>
// ===== DOM ヘルパー =====
const $ = id => document.getElementById(id);

// ===== 共通 UI ヘルパー =====
function setDot(id, cls) {
  const dot = $(`dot-${id}`);
  if (dot) dot.className = 'dot' + (cls ? ` ${cls}` : '');
}

let toastTimer;
function showToast(msg, type = 'info') {
  const toast = $('toast');
  toast.textContent = msg;
  toast.className = `show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.className = ''; }, 3200);
}

// ===== フォーマット =====
function formatDatetime(d) {
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}
function formatDatetimeDisplay(d) {
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function formatTime(d) { return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function pad(n) { return String(n).padStart(2, '0'); }
function formatSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
}

// =========================================================
// ===== WebRTC / ビデオ通話 =====
// =========================================================

const STUN = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:stun2.l.google.com:19302' },
    { urls: 'stun:stun3.l.google.com:19302' },
  ]
};

const ws = {
  socket: null,
  peers: {},
  localStream: null,
  roomId: null,
  inCall: false,
  audioMuted: false,
  videoMuted: false,
};

// ===== Socket.io 初期化 =====
function initSocket() {
  ws.socket = io();

  ws.socket.on('connect', () => {
    setDot('call', 'ok');
    $('label-call').textContent = '通話：接続OK';
  });

  ws.socket.on('disconnect', () => {
    setDot('call', 'warn');
    $('label-call').textContent = '通話：切断（再接続中）';
  });

  ws.socket.on('connect_error', () => {
    setDot('call', 'warn');
    $('label-call').textContent = '通話：接続エラー';
  });

  ws.socket.on('room-peers', async (peers) => {
    for (const peerId of peers) {
      await createPeer(peerId, true);
    }
    updateParticipants();
  });

  ws.socket.on('peer-joined', (peerId) => {
    console.log(`[WebRTC] 新規参加: ${peerId.slice(0,8)}`);
    updateParticipants();
  });

  ws.socket.on('offer', async ({ from, offer }) => {
    let pc = ws.peers[from];
    if (!pc) pc = await createPeer(from, false);
    try {
      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      ws.socket.emit('answer', { to: from, answer });
    } catch (e) {
      console.error('[WebRTC] offer処理エラー:', e);
    }
  });

  ws.socket.on('answer', async ({ from, answer }) => {
    const pc = ws.peers[from];
    if (pc) {
      try {
        await pc.setRemoteDescription(new RTCSessionDescription(answer));
      } catch (e) {
        console.error('[WebRTC] answer処理エラー:', e);
      }
    }
  });

  ws.socket.on('ice-candidate', async ({ from, candidate }) => {
    const pc = ws.peers[from];
    if (pc && candidate) {
      try {
        await pc.addIceCandidate(new RTCIceCandidate(candidate));
      } catch (e) { /* 無視 */ }
    }
  });

  ws.socket.on('peer-left', (peerId) => {
    removePeer(peerId);
    typingPeers.delete(peerId);
    updateTypingIndicator();
    updateParticipants();
    showToast('参加者が退出しました', 'info');
  });

  // ===== エピソード同期 =====
  ws.socket.on('episodes-sync', (data) => {
    handleEpisodesSync(data);
    updateSyncBadge('synced');
  });

  ws.socket.on('episode-updated', ({ id, content }) => {
    const ep = episodeState.episodes.find(e => e.id === id);
    if (ep) {
      ep.content = content;
      // アクティブエピソードの場合はtextareaを更新
      if (episodeState.activeId === id) {
        const ta = $('script-textarea');
        const hadFocus = ta === document.activeElement;
        const start = ta.selectionStart;
        const end = ta.selectionEnd;
        ta.value = content;
        if (hadFocus) ta.setSelectionRange(start, end);
        ta.classList.remove('remote-updated');
        void ta.offsetWidth;
        ta.classList.add('remote-updated');
        setTimeout(() => ta.classList.remove('remote-updated'), 800);
      }
    }
    updateSyncBadge('synced');
  });

  ws.socket.on('peer-typing', ({ peerId, isTyping }) => {
    if (isTyping) typingPeers.add(peerId);
    else typingPeers.delete(peerId);
    updateTypingIndicator();
  });
}

// ===== PeerConnection 作成 =====
async function createPeer(peerId, isInitiator) {
  const pc = new RTCPeerConnection(STUN);
  ws.peers[peerId] = pc;

  if (ws.localStream) {
    ws.localStream.getTracks().forEach(track => pc.addTrack(track, ws.localStream));
  }

  pc.ontrack = (event) => {
    addRemoteVideo(peerId, event.streams[0]);
    updateParticipants();
  };

  pc.onicecandidate = ({ candidate }) => {
    if (candidate && ws.socket) ws.socket.emit('ice-candidate', { to: peerId, candidate });
  };

  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'failed') {
      try { pc.restartIce(); } catch(e) {}
    }
  };

  if (isInitiator) {
    try {
      const offer = await pc.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: true });
      await pc.setLocalDescription(offer);
      ws.socket.emit('offer', { to: peerId, offer });
    } catch (e) {
      console.error('[WebRTC] offer作成エラー:', e);
    }
  }

  return pc;
}

function addRemoteVideo(peerId, stream) {
  const existing = $(`video-${peerId}`);
  if (existing) { existing.srcObject = stream; return; }

  const wrapper = document.createElement('div');
  wrapper.className = 'video-wrapper remote-wrapper';
  wrapper.id = `wrapper-${peerId}`;

  const video = document.createElement('video');
  video.id = `video-${peerId}`;
  video.autoplay = true; video.playsinline = true; video.srcObject = stream;

  const label = document.createElement('div');
  label.className = 'video-label';
  label.textContent = `参加者 ${peerId.slice(0, 6)}`;

  wrapper.appendChild(video);
  wrapper.appendChild(label);
  $('video-grid').appendChild(wrapper);
}

function removePeer(peerId) {
  const pc = ws.peers[peerId];
  if (pc) { pc.close(); delete ws.peers[peerId]; }
  const wrapper = $(`wrapper-${peerId}`);
  if (wrapper) wrapper.remove();
}

function updateParticipants() {
  const count = Object.keys(ws.peers).length + 1;
  $('call-participants').textContent = `参加者：${count}人`;
  const userCount = $('script-user-count');
  if (ws.inCall) {
    userCount.style.display = 'inline';
    userCount.textContent = `${count}人が参加中`;
  }
}

// ===== 通話参加 =====
async function joinCall() {
  const roomId = $('room-input').value.trim().toUpperCase();
  if (!roomId) { showToast('ルームIDを入力してください', 'error'); return; }

  try {
    $('btn-join-call').disabled = true;
    $('btn-join-call').textContent = '接続中...';

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true },
        video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }
      });
    } catch {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        showToast('カメラが利用できないため音声のみで参加します', 'info');
      } catch (e) {
        throw new Error('マイク/カメラへのアクセスが拒否されました');
      }
    }

    ws.localStream = stream;
    ws.roomId = roomId;
    ws.inCall = true;

    const localVid = $('local-video');
    localVid.srcObject = stream;

    if (!stream.getVideoTracks().length) {
      $('local-wrapper').innerHTML = `
        <div class="video-placeholder">
          <div class="avatar">🎙️</div>
          <span>音声のみ</span>
        </div>
        <div class="video-label">自分</div>
      `;
    }

    ws.socket.emit('join-room', roomId);

    const url = new URL(window.location.href);
    url.searchParams.set('room', roomId);
    history.pushState({}, '', url);
    $('invite-url-text').textContent = url.toString();
    $('call-room-label').textContent = `ルームID: ${roomId}`;

    $('call-setup').style.display = 'none';
    $('call-active').style.display = 'block';
    setDot('call', 'call-active');
    $('label-call').textContent = `通話中：${roomId}`;
    updateParticipants();
    showToast(`ルーム「${roomId}」に参加しました`, 'success');

    document.querySelector('main').classList.add('in-call');

  } catch (err) {
    $('btn-join-call').disabled = false;
    $('btn-join-call').textContent = '📹 通話に参加';
    showToast(`エラー: ${err.message}`, 'error');
  }
}

// ===== 通話終了 =====
function leaveCall() {
  Object.keys(ws.peers).forEach(removePeer);
  ws.peers = {};

  if (ws.localStream) {
    ws.localStream.getTracks().forEach(t => t.stop());
    ws.localStream = null;
  }

  document.querySelectorAll('.remote-wrapper').forEach(el => el.remove());
  $('local-wrapper').innerHTML = `
    <video id="local-video" autoplay muted playsinline></video>
    <div class="video-label">自分</div>
  `;

  if (ws.socket) ws.socket.emit('leave-room');
  ws.roomId = null;
  ws.inCall = false;
  ws.audioMuted = false;
  ws.videoMuted = false;

  const url = new URL(window.location.href);
  url.searchParams.delete('room');
  history.pushState({}, '', url);

  $('call-setup').style.display = 'block';
  $('call-active').style.display = 'none';
  $('btn-join-call').disabled = false;
  $('btn-join-call').textContent = '📹 通話に参加';
  $('btn-mute-audio').textContent = '🎙️ ミュート';
  $('btn-mute-audio').classList.remove('muted');
  $('btn-mute-video').textContent = '📹 カメラOFF';
  $('btn-mute-video').classList.remove('muted');

  setDot('call', 'ok');
  $('label-call').textContent = '通話：接続OK';
  showToast('通話を終了しました', 'info');
  document.querySelector('main').classList.remove('in-call');
  updateSyncBadge('offline');

  if (ws.socket) ws.socket.emit('script-typing', false);
  clearTimeout(typingStopTimer);
  typingPeers.clear();
  updateTypingIndicator();
  $('script-user-count').style.display = 'none';

  // ローカルに戻す
  loadLocalEpisodes();
}

function toggleAudio() {
  if (!ws.localStream) return;
  ws.audioMuted = !ws.audioMuted;
  ws.localStream.getAudioTracks().forEach(t => { t.enabled = !ws.audioMuted; });
  const btn = $('btn-mute-audio');
  btn.textContent = ws.audioMuted ? '🔇 ミュート中' : '🎙️ ミュート';
  btn.classList.toggle('muted', ws.audioMuted);
}

function toggleVideo() {
  if (!ws.localStream) return;
  ws.videoMuted = !ws.videoMuted;
  ws.localStream.getVideoTracks().forEach(t => { t.enabled = !ws.videoMuted; });
  const btn = $('btn-mute-video');
  btn.textContent = ws.videoMuted ? '📵 カメラ停止中' : '📹 カメラOFF';
  btn.classList.toggle('muted', ws.videoMuted);
}

function generateRoomId() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({ length: 6 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
}

function loadRoomFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const room = params.get('room');
  if (room) {
    $('room-input').value = room.toUpperCase();
    setTimeout(() => {
      showToast(`ルーム「${room}」の招待URLです。参加ボタンを押してください`, 'info');
    }, 800);
  } else {
    $('room-input').value = generateRoomId();
  }
}

$('btn-join-call').addEventListener('click', joinCall);
$('btn-leave-call').addEventListener('click', leaveCall);
$('btn-mute-audio').addEventListener('click', toggleAudio);
$('btn-mute-video').addEventListener('click', toggleVideo);
$('btn-random-room').addEventListener('click', () => { $('room-input').value = generateRoomId(); });
$('btn-copy-url').addEventListener('click', () => {
  navigator.clipboard.writeText($('invite-url-text').textContent)
    .then(() => showToast('URLをコピーしました', 'success'))
    .catch(() => showToast('コピーに失敗しました', 'error'));
});
$('room-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') joinCall(); });

// =========================================================
// ===== 台本・エピソード管理 =====
// =========================================================

const LS_EPISODES_KEY = 'podcast-episodes-v2';

// エピソード状態
const episodeState = {
  episodes: [],  // [{id, name, content}]
  activeId: null,
};

function genLocalId() {
  return 'l_' + Math.random().toString(36).slice(2, 10);
}

function getActiveEpisode() {
  return episodeState.episodes.find(e => e.id === episodeState.activeId) || episodeState.episodes[0] || null;
}

// ローカルストレージ保存
function saveLocalEpisodes() {
  if (ws.inCall) return; // 通話中はサーバーが管理
  try {
    localStorage.setItem(LS_EPISODES_KEY, JSON.stringify({
      episodes: episodeState.episodes,
      activeId: episodeState.activeId,
    }));
  } catch {}
}

// ローカルストレージ読み込み
function loadLocalEpisodes() {
  try {
    const saved = localStorage.getItem(LS_EPISODES_KEY);
    if (saved) {
      const data = JSON.parse(saved);
      episodeState.episodes = data.episodes || [];
      episodeState.activeId = data.activeId || null;
    }
  } catch {}

  if (episodeState.episodes.length === 0) {
    const ep = { id: genLocalId(), name: 'EP1', content: '' };
    episodeState.episodes = [ep];
    episodeState.activeId = ep.id;
  }
  if (!episodeState.episodes.find(e => e.id === episodeState.activeId)) {
    episodeState.activeId = episodeState.episodes[0].id;
  }
  renderEpisodeTabs();
  renderActiveEpisode();
}

// サーバーからの全エピソード同期
function handleEpisodesSync(data) {
  episodeState.episodes = data.list || [];
  episodeState.activeId = data.activeId || (episodeState.episodes[0] && episodeState.episodes[0].id);
  renderEpisodeTabs();
  renderActiveEpisode();
}

// タブを描画
function renderEpisodeTabs() {
  const tabsEl = $('episode-tabs');
  tabsEl.innerHTML = '';
  episodeState.episodes.forEach(ep => {
    const btn = document.createElement('button');
    btn.className = 'ep-tab' + (ep.id === episodeState.activeId ? ' active' : '');
    btn.textContent = ep.name;
    btn.dataset.id = ep.id;
    btn.addEventListener('click', () => selectEpisode(ep.id));
    tabsEl.appendChild(btn);
  });
}

// アクティブエピソードの内容をtextareaに反映
function renderActiveEpisode() {
  const ep = getActiveEpisode();
  $('script-textarea').value = ep ? ep.content : '';
}

// エピソード選択
function selectEpisode(id) {
  // 現在のテキストを保存
  const current = getActiveEpisode();
  if (current) current.content = $('script-textarea').value;

  episodeState.activeId = id;
  renderEpisodeTabs();
  renderActiveEpisode();
  saveLocalEpisodes();

  if (ws.inCall && ws.socket) {
    ws.socket.emit('episode-select', { id });
  }
}

// エピソード追加
function addEpisode() {
  const epNum = episodeState.episodes.length + 1;
  const name = `EP${epNum}`;

  if (ws.inCall && ws.socket) {
    ws.socket.emit('episode-create', { name });
  } else {
    const ep = { id: genLocalId(), name, content: '' };
    episodeState.episodes.push(ep);
    episodeState.activeId = ep.id;
    renderEpisodeTabs();
    renderActiveEpisode();
    saveLocalEpisodes();
  }
}

// エピソード名変更
function renameEpisode() {
  const ep = getActiveEpisode();
  if (!ep) return;
  const newName = prompt('エピソード名を入力してください:', ep.name);
  if (!newName || !newName.trim()) return;
  const name = newName.trim().slice(0, 30);

  if (ws.inCall && ws.socket) {
    ws.socket.emit('episode-rename', { id: ep.id, name });
  } else {
    ep.name = name;
    renderEpisodeTabs();
    saveLocalEpisodes();
  }
}

// エピソード削除
function deleteEpisode() {
  if (episodeState.episodes.length <= 1) {
    showToast('エピソードは最低1つ必要です', 'error');
    return;
  }
  const ep = getActiveEpisode();
  if (!ep) return;
  if (!confirm(`「${ep.name}」を削除しますか？`)) return;

  if (ws.inCall && ws.socket) {
    ws.socket.emit('episode-delete', { id: ep.id });
  } else {
    episodeState.episodes = episodeState.episodes.filter(e => e.id !== ep.id);
    episodeState.activeId = episodeState.episodes[0].id;
    renderEpisodeTabs();
    renderActiveEpisode();
    saveLocalEpisodes();
  }
}

$('btn-ep-add').addEventListener('click', addEpisode);
$('btn-ep-rename').addEventListener('click', renameEpisode);
$('btn-ep-delete').addEventListener('click', deleteEpisode);

// ===== 台本リアルタイム同期 =====
function updateSyncBadge(state) {
  const badge = $('sync-badge');
  badge.className = `sync-badge ${state}`;
  const labels = { offline: 'ローカルのみ', syncing: '同期中...', synced: '同期済み' };
  badge.textContent = labels[state] || state;
}

const typingPeers = new Set();
let typingStopTimer = null;

function updateTypingIndicator() {
  const el = $('script-typing-indicator');
  const count = typingPeers.size;
  if (count === 0 || !ws.inCall) { el.innerHTML = ''; return; }
  const text = count === 1 ? '1人が編集中' : `${count}人が編集中`;
  el.innerHTML = `<span>${text}</span><div class="typing-dots"><span></span><span></span><span></span></div>`;
}

let scriptDebounce = null;
$('script-textarea').addEventListener('input', () => {
  // 現在のエピソードに反映
  const ep = getActiveEpisode();
  if (ep) ep.content = $('script-textarea').value;

  if (!ws.inCall || !ws.roomId) {
    saveLocalEpisodes();
    return;
  }

  // タイピング通知
  if (ws.socket) ws.socket.emit('script-typing', true);
  clearTimeout(typingStopTimer);
  typingStopTimer = setTimeout(() => {
    if (ws.socket) ws.socket.emit('script-typing', false);
  }, 1500);

  clearTimeout(scriptDebounce);
  updateSyncBadge('syncing');
  scriptDebounce = setTimeout(() => {
    if (ep && ws.socket) {
      ws.socket.emit('episode-update', { id: ep.id, content: ep.content });
    }
    updateSyncBadge('synced');
  }, 150);
});

// =========================================================
// ===== 録音機能 =====
// =========================================================

const state = {
  mediaRecorder: null,
  stream: null,
  chunks: [],
  isRecording: false,
  startTime: null,
  timerInterval: null,
  chunkInterval: null,
  chunkCount: 0,
  localFiles: [],
  mimeType: '',
};

const btnStart    = $('btn-start');
const btnStop     = $('btn-stop');
const micSelect   = $('mic-select');
const chunkLog    = $('chunk-log');
const fileList    = $('file-list');

async function loadMics() {
  try {
    const tmp = await navigator.mediaDevices.getUserMedia({ audio: true });
    tmp.getTracks().forEach(t => t.stop());
    const devices = await navigator.mediaDevices.enumerateDevices();
    const mics = devices.filter(d => d.kind === 'audioinput');
    micSelect.innerHTML = '';
    mics.forEach((m, i) => {
      const opt = document.createElement('option');
      opt.value = m.deviceId;
      opt.textContent = m.label || `マイク ${i + 1}`;
      micSelect.appendChild(opt);
    });
    setDot('mic', 'ok');
    $('label-mic').textContent = `マイク：${mics.length}台検出`;
  } catch {
    setDot('mic', 'warn');
    $('label-mic').textContent = 'マイク：アクセス拒否';
    showToast('マイクへのアクセスを許可してください', 'error');
  }
}

function getBestMimeType() {
  const types = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];
  for (const t of types) {
    if (MediaRecorder.isTypeSupported(t)) return t;
  }
  return '';
}

async function startRecording() {
  try {
    const deviceId = micSelect.value;
    const constraints = {
      audio: deviceId
        ? { deviceId: { exact: deviceId }, echoCancellation: false, noiseSuppression: false, sampleRate: 48000 }
        : { echoCancellation: false, noiseSuppression: false, sampleRate: 48000 }
    };
    state.stream = await navigator.mediaDevices.getUserMedia(constraints);
    state.mimeType = getBestMimeType();
    state.chunks = [];
    state.chunkCount = 0;

    state.mediaRecorder = new MediaRecorder(state.stream, {
      mimeType: state.mimeType || undefined,
      audioBitsPerSecond: 128000,
    });
    state.mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) state.chunks.push(e.data);
    };
    state.mediaRecorder.onstop = finalizeRecording;
    state.mediaRecorder.start(1000);
    state.isRecording = true;
    state.startTime = Date.now();

    setRecordingUI(true);
    startTimer();
    state.chunkInterval = setInterval(saveChunk, 30000);

    // ステータスバー更新
    setDot('local-rec', 'active');
    $('label-local-rec').textContent = 'ローカル録音：収録中';
    // フッターステータス更新
    setFooterStatus('local', 'active', 'ローカル録音：収録中');

    showToast('録音を開始しました（ローカル + クラウド）', 'success');
  } catch (err) {
    showToast(`録音開始エラー: ${err.message}`, 'error');
  }
}

function stopRecording() {
  if (!state.mediaRecorder || state.mediaRecorder.state === 'inactive') return;
  clearInterval(state.chunkInterval);
  clearInterval(state.timerInterval);
  state.mediaRecorder.stop();
  state.stream?.getTracks().forEach(t => t.stop());
  state.isRecording = false;
  setRecordingUI(false);

  // ステータスバー更新
  setDot('local-rec', '');
  $('label-local-rec').textContent = 'ローカル録音：停止中';
  setFooterStatus('local', '', 'ローカル録音：停止中');
}

function finalizeRecording() {
  if (state.chunks.length === 0) return;
  const ext = state.mimeType.includes('ogg') ? 'ogg' : state.mimeType.includes('mp4') ? 'mp4' : 'webm';
  const blob = new Blob(state.chunks, { type: state.mimeType || 'audio/webm' });
  const ts = formatDatetime(new Date());
  const filename = `録音_${ts}.${ext}`;
  addLocalFile(blob, filename, true);
  state.chunks = [];
  uploadToServer(blob, filename);
}

function saveChunk() {
  if (state.chunks.length === 0) return;
  state.chunkCount++;
  const snap = [...state.chunks];
  state.chunks = [];
  const ext = state.mimeType.includes('ogg') ? 'ogg' : state.mimeType.includes('mp4') ? 'mp4' : 'webm';
  const blob = new Blob(snap, { type: state.mimeType || 'audio/webm' });
  const ts = formatDatetime(new Date());
  const filename = `録音_${ts}_チャンク${state.chunkCount}.${ext}`;
  addLocalFile(blob, filename, false);
  uploadToServer(blob, filename);
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `<span class="time">${formatTime(new Date())}</span> チャンク${state.chunkCount}を自動保存 (${formatSize(blob.size)})`;
  chunkLog.insertBefore(entry, chunkLog.firstChild);
}

// isLatest=true のとき「PCに保存」ボタンを強調
function addLocalFile(blob, filename, isLatest) {
  const url = URL.createObjectURL(blob);
  state.localFiles.unshift({ blob, url, filename, size: blob.size, date: new Date(), isNew: isLatest });
  renderFileList();
}

function renderFileList() {
  if (state.localFiles.length === 0) {
    fileList.innerHTML = '<div class="empty-state">録音を開始すると、ここにファイルが表示されます</div>';
    return;
  }
  fileList.innerHTML = '';
  state.localFiles.forEach((f, i) => {
    const item = document.createElement('div');
    item.className = 'file-item' + (f.isNew ? ' new-file' : '');
    item.innerHTML = `
      <div class="file-info">
        <div class="file-name">${f.filename}</div>
        <div class="file-meta">${formatDatetimeDisplay(f.date)} ・ ${formatSize(f.size)}</div>
        <audio controls src="${f.url}"></audio>
      </div>
      <div class="file-actions">
        <button class="btn-small ${f.isNew ? 'btn-dl-now' : 'btn-dl'}" onclick="downloadFile(${i})">
          ${f.isNew ? '⬇ PCに保存' : '⬇ 保存'}
        </button>
      </div>
    `;
    fileList.appendChild(item);
    // isNew フラグをリセット（ハイライトは一度だけ）
    f.isNew = false;
  });
}

function downloadFile(index) {
  const f = state.localFiles[index];
  const a = document.createElement('a');
  a.href = f.url; a.download = f.filename; a.click();
}

async function uploadToServer(blob, filename) {
  const statusArea  = $('upload-status-area');
  const statusMsg   = $('upload-status-msg');
  const progressBar = $('progress-bar');

  statusArea.classList.add('visible');
  statusMsg.innerHTML = `<span>⬆️</span><span>「${filename}」をクラウドへ送信中...</span>`;
  progressBar.style.width = '10%';

  // クラウドステータス更新
  setDot('cloud', 'uploading');
  $('label-cloud').textContent = 'クラウド：送信中...';
  setFooterStatus('cloud', 'uploading', 'クラウド：送信中...');

  try {
    const formData = new FormData();
    formData.append('audio', blob, filename);
    const xhr = new XMLHttpRequest();
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        progressBar.style.width = Math.round((e.loaded / e.total) * 90 + 10) + '%';
      }
    };
    await new Promise((resolve, reject) => {
      xhr.open('POST', '/upload');
      xhr.onload = () => xhr.status === 200 ? resolve() : reject(new Error(`HTTP ${xhr.status}`));
      xhr.onerror = () => reject(new Error('ネットワークエラー'));
      xhr.send(formData);
    });
    progressBar.style.width = '100%';
    statusMsg.innerHTML = `<span style="color:var(--green)">✓</span><span style="color:var(--green)">クラウド送信完了：${filename}</span>`;
    setTimeout(() => { progressBar.style.width = '0'; statusArea.classList.remove('visible'); }, 4000);

    setDot('cloud', 'ok');
    $('label-cloud').textContent = 'クラウド：送信完了';
    setFooterStatus('cloud', 'ok', 'クラウド：送信完了');
    showToast('クラウドへの保存が完了しました', 'success');
  } catch (err) {
    progressBar.style.width = '0';
    statusMsg.innerHTML = `<span style="color:var(--yellow)">⚠️</span><span style="color:var(--yellow)">クラウド送信失敗（ローカルに保存済み）：${err.message}</span>`;
    setTimeout(() => { statusArea.classList.remove('visible'); }, 6000);

    setDot('cloud', 'warn');
    $('label-cloud').textContent = 'クラウド：送信失敗';
    setFooterStatus('cloud', 'warn', 'クラウド：送信失敗');
    console.warn('アップロード失敗:', err.message);
  }
}

function startTimer() {
  const timerEl = $('rec-timer-footer');
  timerEl.style.display = 'block';
  state.timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    timerEl.textContent = `${m}:${s}`;
  }, 500);
}

function setRecordingUI(recording) {
  btnStart.disabled = recording;
  btnStop.disabled  = !recording;
  micSelect.disabled = recording;

  const footer = $('rec-footer');
  if (recording) {
    footer.classList.add('recording');
  } else {
    footer.classList.remove('recording');
    $('rec-timer-footer').style.display = 'none';
    $('rec-timer-footer').textContent = '00:00';
  }
}

function setFooterStatus(type, dotClass, label) {
  if (type === 'local') {
    const dot = $('rec-dot-local');
    const lbl = $('rec-label-local');
    dot.className = 'rec-stat-dot' + (dotClass ? ` ${dotClass}` : '');
    lbl.textContent = label;
  } else if (type === 'cloud') {
    const dot = $('rec-dot-cloud');
    const lbl = $('rec-label-cloud');
    dot.className = 'rec-stat-dot' + (dotClass ? ` ${dotClass}` : '');
    lbl.textContent = label;
  }
}

async function checkServer() {
  try {
    const res = await fetch('/recordings', { signal: AbortSignal.timeout(3000) });
    if (res.ok) {
      setDot('cloud', 'ok');
      $('label-cloud').textContent = 'クラウド：接続OK';
      setFooterStatus('cloud', 'ok', 'クラウド：接続OK');
    }
  } catch {
    setDot('cloud', 'warn');
    $('label-cloud').textContent = 'クラウド：オフライン（ローカル録音のみ）';
    setFooterStatus('cloud', 'warn', 'クラウド：オフライン');
  }
}

btnStart.addEventListener('click', startRecording);
btnStop.addEventListener('click', stopRecording);
window.addEventListener('beforeunload', (e) => {
  if (state.isRecording) {
    e.preventDefault();
    e.returnValue = '録音中です。ページを離れると録音が失われます。';
  }
});

// =========================================================
// ===== 初期化 =====
// =========================================================
(async () => {
  loadRoomFromUrl();
  loadLocalEpisodes();
  updateSyncBadge('offline');
  initSocket();
  await loadMics();
  await checkServer();
})();
</script>
